name: Publish v30 Stability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v30-stability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and publish v30
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $script = './v30/publish-v30.ps1'
          $text = Get-Content -LiteralPath $script -Raw
          $old = 'Expand-Archive -LiteralPath $overrideZip -DestinationPath $sourceRoot -Force'
          $new = "tar -xf `$overrideZip -C `$sourceRoot`nif (`$LASTEXITCODE -ne 0) { throw 'v30 override extraction failed.' }"
          if (-not $text.Contains($old)) { throw 'Expected override extraction line was not found.' }
          Set-Content -LiteralPath $script -Value ($text.Replace($old, $new)) -Encoding UTF8
          & $script
