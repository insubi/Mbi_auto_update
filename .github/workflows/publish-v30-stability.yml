name: Publish v30 Stability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v30-stability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and publish v30
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v30'
          $sourceName = 'CombinedFishingDungeon_v30_StabilityRemote.zip'
          $liteName = 'MabiAuto_v30_Windows_Lite.zip'

          $work = Join-Path $PWD 'v30-work'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work | Out-Null

          Write-Host 'Downloading v29 source baseline...'
          $baselineZip = Join-Path $work 'baseline-v29.zip'
          Invoke-WebRequest -Uri 'https://github.com/insubi/Mbi_auto_update/releases/download/v29/CombinedFishingDungeon_v29_DashboardSmartUpdate.zip' -OutFile $baselineZip
          if ((Get-Item $baselineZip).Length -lt 10000) { throw 'v29 baseline ZIP download failed.' }

          $srcArea = Join-Path $work 'source'
          New-Item -ItemType Directory -Path $srcArea | Out-Null
          Expand-Archive -LiteralPath $baselineZip -DestinationPath $srcArea -Force

          $baselineProj = Get-ChildItem -Path $srcArea -Recurse -Filter 'FishingAutomation.csproj' | Select-Object -First 1
          if (-not $baselineProj) { throw 'FishingAutomation.csproj not found in baseline.' }
          $sourceRoot = Split-Path $baselineProj.Directory.FullName -Parent

          Write-Host 'Reassembling v30 source override...'
          $parts = 1..4 | ForEach-Object { Join-Path $PWD "v30/patch.part$_.b64" }
          foreach ($part in $parts) { if (-not (Test-Path $part)) { throw "Missing patch part: $part" } }
          $b64 = ($parts | ForEach-Object { Get-Content -LiteralPath $_ -Raw }) -join ''
          $overrideZip = Join-Path $work 'v30-override.zip'
          [IO.File]::WriteAllBytes($overrideZip, [Convert]::FromBase64String($b64))
          Expand-Archive -LiteralPath $overrideZip -DestinationPath $sourceRoot -Force

          $parent = Split-Path $sourceRoot -Parent
          $v30Root = Join-Path $parent 'CombinedFishingDungeon_v30'
          if ($sourceRoot -ne $v30Root) {
            Remove-Item $v30Root -Recurse -Force -ErrorAction SilentlyContinue
            Rename-Item -LiteralPath $sourceRoot -NewName 'CombinedFishingDungeon_v30'
          }

          $mainProj = Get-ChildItem -Path $v30Root -Recurse -Filter 'FishingAutomation.csproj' | Select-Object -First 1
          if (-not $mainProj) { throw 'v30 FishingAutomation.csproj missing after patch.' }
          $appDir = $mainProj.Directory.FullName

          Write-Host 'Creating clean v30 source ZIP before build outputs exist...'
          $sourceZip = Join-Path $PWD $sourceName
          Remove-Item $sourceZip,"$sourceZip.sha256" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $v30Root -DestinationPath $sourceZip -CompressionLevel Optimal
          $sourceHash = (Get-FileHash -Algorithm SHA256 $sourceZip).Hash.ToLowerInvariant()
          "$sourceHash  $sourceName" | Set-Content -LiteralPath "$sourceZip.sha256" -Encoding ASCII

          $publishMain = Join-Path $work 'publish-main'
          $publishWatch = Join-Path $work 'publish-watchdog'
          Write-Host 'Publishing MABI AUTO v30 self-contained Windows x64...'
          dotnet publish $mainProj.FullName `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $publishMain
          if ($LASTEXITCODE -ne 0) { throw 'FishingAutomation v30 publish failed.' }

          $watchProj = Get-ChildItem -Path $v30Root -Recurse -Filter 'MacroWatchdog.csproj' | Select-Object -First 1
          if ($watchProj) {
            dotnet publish $watchProj.FullName `
              -c Release `
              -r win-x64 `
              --self-contained true `
              -p:PublishSingleFile=true `
              -p:EnableCompressionInSingleFile=true `
              -p:DebugType=None `
              -p:DebugSymbols=false `
              -o $publishWatch
            if ($LASTEXITCODE -ne 0) { throw 'MacroWatchdog v30 publish failed.' }
          }

          if (-not (Test-Path (Join-Path $publishMain 'FishingAutomation.exe'))) {
            throw 'FishingAutomation.exe was not created.'
          }

          Write-Host 'Packaging lightweight Windows-ready build...'
          $liteBase = Join-Path $work 'lite'
          $liteRoot = Join-Path $liteBase 'MabiAuto_v30'
          New-Item -ItemType Directory -Path $liteRoot | Out-Null
          $runtimeDir = Join-Path $liteRoot 'release'
          New-Item -ItemType Directory -Path $runtimeDir | Out-Null
          Copy-Item -Path (Join-Path $publishMain '*') -Destination $runtimeDir -Recurse -Force
          Remove-Item (Join-Path $runtimeDir '*.pdb') -Force -ErrorAction SilentlyContinue

          if ($watchProj) {
            $watchExe = Join-Path $publishWatch 'MacroWatchdog.exe'
            if (Test-Path $watchExe) { Copy-Item $watchExe (Join-Path $runtimeDir 'MacroWatchdog.exe') -Force }
          }

          $miniSource = Join-Path $liteRoot 'FishingAutomation'
          New-Item -ItemType Directory -Path $miniSource | Out-Null
          foreach ($name in @('config.json','notification.json','interception.dll')) {
            $src = Join-Path $appDir $name
            if (Test-Path $src) { Copy-Item $src (Join-Path $miniSource $name) -Force }
          }
          foreach ($name in @('templates','dungeon','abyss','drivers')) {
            $src = Join-Path $appDir $name
            if (Test-Path $src) { Copy-Item $src (Join-Path $miniSource $name) -Recurse -Force }
          }

          $toolsOut = Join-Path $liteRoot 'tools'
          New-Item -ItemType Directory -Path $toolsOut | Out-Null
          foreach ($tool in @('InstallInterception.ps1','SetupPhoneAlert.ps1','AddTemplates.ps1','ApplyUpdate.ps1')) {
            $src = Join-Path (Join-Path $v30Root 'tools') $tool
            if (Test-Path $src) { Copy-Item $src (Join-Path $toolsOut $tool) -Force }
          }

          foreach ($rootFile in @('1_INSTALL_INTERCEPTION.cmd','SETUP_PHONE_ALERT.cmd','SETUP_PHONE_ALERT_ALT.bat','ADD_TEMPLATES.cmd','OPEN_TEMPLATES.cmd','PHONE_ALERT_README.txt','AUTO_UPDATE_README.txt','START_HERE_v30.txt','CHANGES_v30_STABILITY_REMOTE.txt')) {
            $src = Join-Path $v30Root $rootFile
            if (Test-Path $src) { Copy-Item $src (Join-Path $liteRoot $rootFile) -Force }
          }

          $startLines = @(
            '@echo off',
            'setlocal EnableExtensions',
            'cd /d "%~dp0"',
            'set "EXE=%~dp0release\FishingAutomation.exe"',
            'if not exist "%EXE%" (',
            '  echo.',
            '  echo ERROR: release\FishingAutomation.exe is missing.',
            '  echo Download the Windows_Lite ZIP again and extract all files.',
            '  echo.',
            '  pause',
            '  exit /b 6',
            ')',
            'start "" /d "%~dp0release" "%EXE%"',
            'exit /b 0'
          )
          Set-Content -LiteralPath (Join-Path $liteRoot 'START.cmd') -Value $startLines -Encoding ASCII

          $liteInfo = @(
            'MABI AUTO v30 - Windows Lite',
            '',
            '- .NET SDK installation is NOT required.',
            '- SHA256 update verification is enabled.',
            '- Failed startup after an update automatically rolls back to the previous version.',
            '- Startup diagnostics check game window, templates, OCR, keyboard input, Telegram and update server.',
            '- Telegram remote commands: /status, /stop, /restart, /help.',
            '',
            'Run START.cmd to launch.'
          )
          Set-Content -LiteralPath (Join-Path $liteRoot 'WINDOWS_LITE.txt') -Value $liteInfo -Encoding UTF8

          $liteZip = Join-Path $PWD $liteName
          Remove-Item $liteZip,"$liteZip.sha256" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $liteRoot -DestinationPath $liteZip -CompressionLevel Optimal
          $liteHash = (Get-FileHash -Algorithm SHA256 $liteZip).Hash.ToLowerInvariant()
          "$liteHash  $liteName" | Set-Content -LiteralPath "$liteZip.sha256" -Encoding ASCII

          $sizeMb = [Math]::Round((Get-Item $liteZip).Length / 1MB, 1)
          Write-Host "v30 Windows Lite size: $sizeMb MB"

          $notes = @'
## MABI AUTO v30

### Stability & Remote Control
- Automatic update rollback if the newly installed app cannot start successfully
- SHA256 verification for Windows Lite update packages
- Startup diagnostics for game window, image templates, OCR, keyboard input, Telegram and GitHub update connection
- Telegram remote commands: `/status`, `/stop`, `/restart`, `/help`
- Windows Lite self-contained build: .NET SDK is not required on the PC

For normal use, download or auto-update to **MabiAuto_v30_Windows_Lite.zip**.
'@
          $notesFile = Join-Path $work 'release-notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding UTF8

          $assets = @($sourceZip, "$sourceZip.sha256", $liteZip, "$liteZip.sha256")
          gh release view $tag --repo $env:REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $env:REPO --clobber
            if ($LASTEXITCODE -ne 0) { throw 'v30 release asset upload failed.' }
            gh release edit $tag --repo $env:REPO --title 'Mabi Auto v30' --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw 'v30 release metadata update failed.' }
          } else {
            gh release create $tag @assets --repo $env:REPO --title 'Mabi Auto v30' --notes-file $notesFile --target main
            if ($LASTEXITCODE -ne 0) { throw 'v30 release creation failed.' }
          }

          Write-Host "V30 RELEASE OK: $liteName ($sizeMb MB)"
