name: Inspect V0.1.60 runtime error reporting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-runtime-error-reporting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Download V0.1.60 source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item source -ItemType Directory -Force | Out-Null
          gh release download V0.1.60 --repo $env:GITHUB_REPOSITORY --pattern 'MabiAuto_V0.1.60_Source.zip' --dir source
          Expand-Archive source/MabiAuto_V0.1.60_Source.zip source/current -Force
          $root=(Resolve-Path source/current).Path
          foreach($name in @('RuntimeErrorUploader.cs','TelegramNotifier.cs','AppLog.cs','MainForm.cs')){
            $f=Get-ChildItem $root -Recurse -Filter $name | Select-Object -First 1
            if($f){
              Write-Host "===== $name : $($f.FullName.Substring($root.Length+1)) ====="
              if($name -eq 'MainForm.cs'){
                Select-String -Path $f.FullName -Pattern 'RuntimeErrorUploader|TelegramNotifier|Notify|Upload|error|오류' -Context 5,20 |
                  ForEach-Object { $_.Context.PreContext; $_.Line; $_.Context.PostContext; '---' }
              } else {
                Get-Content -Raw $f.FullName
              }
            }
          }
