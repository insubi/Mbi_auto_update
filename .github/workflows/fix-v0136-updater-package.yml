name: Fix V0.1.36 Updater Package Layout

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-v0136-updater-package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repack:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Repack V0.1.36 exactly for ApplyUpdate.ps1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='V0.1.36'
          $asset='MabiAuto_V0.1.36_Windows_Lite.zip'
          $shaAsset="$asset.sha256"

          New-Item -ItemType Directory -Path current,work,package,out | Out-Null

          gh release download $tag --repo $env:REPO --pattern $asset --dir current --clobber
          if($LASTEXITCODE-ne0){throw 'download V0.1.36 release asset failed'}

          Expand-Archive (Join-Path current $asset) -DestinationPath work -Force
          $children=@(Get-ChildItem work -Force)
          $dirs=@($children|Where-Object{$_.PSIsContainer})
          if($children.Count-eq1 -and $dirs.Count-eq1){
            $sourceRoot=$dirs[0].FullName
          }else{
            $sourceRoot=(Resolve-Path work).Path
          }

          $sourceRelease=Join-Path $sourceRoot 'release'
          $sourceExe=Join-Path $sourceRelease 'FishingAutomation.exe'
          if(-not(Test-Path -LiteralPath $sourceExe)){
            throw "source package missing release/FishingAutomation.exe: $sourceExe"
          }

          Copy-Item -LiteralPath $sourceRelease -Destination 'package/release' -Recurse -Force
          @(
            'MABI AUTO V0.1.36 Windows Lite',
            'Updater-compatible package root.',
            'Keep release/FishingAutomation.exe directly under this archive root.'
          ) | Set-Content 'package/WINDOWS_LITE.txt' -Encoding UTF8

          foreach($required in @(
            'package/release/FishingAutomation.exe',
            'package/release/dungeon/config/targets.json',
            'package/release/dungeon/templates/retry_visual_v0129.jpg',
            'package/release/templates/hook.png',
            'package/release/templates/gauge.png',
            'package/release/templates/healthbar.png',
            'package/release/templates/compass.png',
            'package/release/visual-tests/assets/peaca_map_actual_v0136.jpg',
            'package/release/visual-tests/assets/runda_map_actual_v0136.jpg',
            'package/WINDOWS_LITE.txt'
          )){
            if(-not(Test-Path -LiteralPath $required)){throw "repack missing: $required"}
          }

          $fixed=Join-Path (Resolve-Path out).Path $asset
          Compress-Archive -Path 'package/*' -DestinationPath $fixed -CompressionLevel Optimal

          function Assert-UpdaterLayout([string]$zipPath,[string]$dest){
            Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -LiteralPath $zipPath -DestinationPath $dest -Force
            $kids=@(Get-ChildItem -LiteralPath $dest -Force)
            $subdirs=@($kids|Where-Object{$_.PSIsContainer})
            if($kids.Count-eq1 -and $subdirs.Count-eq1){
              $root=$subdirs[0].FullName
            }else{
              $root=(Resolve-Path $dest).Path
            }
            $incomingExe=Join-Path $root 'release/FishingAutomation.exe'
            $marker=Join-Path $root 'WINDOWS_LITE.txt'
            Write-Host "UPDATER_SIM children=$($kids.Count) dirs=$($subdirs.Count) sourceRoot=$root"
            if(-not(Test-Path -LiteralPath $incomingExe)){throw "ApplyUpdate simulation failed: $incomingExe"}
            if(-not(Test-Path -LiteralPath $marker)){throw 'WINDOWS_LITE root marker missing'}
            if(Test-Path -LiteralPath (Join-Path $root 'START.cmd')){throw 'unexpected full-package START.cmd in updater ZIP'}
            if(Test-Path -LiteralPath (Join-Path $root 'FishingAutomation')){throw 'unexpected source tree in updater ZIP'}
          }

          Assert-UpdaterLayout $fixed 'simulate1'

          $hash=(Get-FileHash $fixed -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset"|Set-Content (Join-Path out $shaAsset) -Encoding ASCII
          $size=(Get-Item $fixed).Length
          Write-Host "FIXED_SHA256=$hash"
          Write-Host "FIXED_SIZE=$size"
          if($size -gt 180000000){throw "repacked updater ZIP still unexpectedly large: $size"}

          gh release upload $tag $fixed (Join-Path out $shaAsset) --repo $env:REPO --clobber
          if($LASTEXITCODE-ne0){throw 'V0.1.36 release asset replace failed'}

          New-Item -ItemType Directory -Path verify | Out-Null
          gh release download $tag --repo $env:REPO --pattern $asset --dir verify --clobber
          if($LASTEXITCODE-ne0){throw 'redownload fixed V0.1.36 failed'}
          $downloaded=Join-Path verify $asset
          $verifyHash=(Get-FileHash $downloaded -Algorithm SHA256).Hash.ToLowerInvariant()
          if($verifyHash-ne$hash){throw "hash mismatch local=$hash release=$verifyHash"}
          Assert-UpdaterLayout $downloaded 'simulate2'

          $release=gh api "repos/$env:REPO/releases/tags/$tag" | ConvertFrom-Json
          $zip=@($release.assets|Where-Object{$_.name-eq$asset})[0]
          if($null-eq$zip){throw 'fixed release ZIP missing after upload'}
          Write-Host "RELEASE_SIZE=$($zip.size)"
          Write-Host 'V0136_UPDATER_PACKAGE_FIX_OK'
