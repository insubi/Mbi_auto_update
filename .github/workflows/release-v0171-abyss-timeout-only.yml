# V0.1.71 release trigger 3
name: Release V0.1.71 Abyss Timeout Only

on:
  push:
    branches: [fix/abyss-combat-timeout-only]
    paths:
      - '.github/workflows/release-v0171-abyss-timeout-only.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v0171-abyss-timeout-only
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    steps:
      - name: Checkout V0.1.71 patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore V0.1.70 source and apply V0.1.71
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item source -ItemType Directory -Force | Out-Null
          gh release download V0.1.70 --repo $env:GITHUB_REPOSITORY --pattern 'MabiAuto_V0.1.70_Source.zip' --dir source
          if($LASTEXITCODE-ne0){throw 'V0.1.70 source download failed'}
          Expand-Archive source/MabiAuto_V0.1.70_Source.zip source/current -Force
          $root=(Resolve-Path source/current).Path

          if ((Get-FileHash source/MabiAuto_V0.1.70_Source.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b4c6d7a79f3cb52a20eca23c6c2e52b120877c22608416fc1a100626b41c4336') { throw 'Baseline source hash mismatch' }
          python release-source/v0171_release_apply.py $root
          if($LASTEXITCODE-ne0){throw 'V0.1.71 patch failed'}
          dotnet run --project tests/abyss-timeout/Regression.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'Abyss regression failed'}

          $project=Get-Content -Raw (Join-Path $root 'FishingAutomation/FishingAutomation.csproj')
          $update=Get-Content -Raw (Join-Path $root 'FishingAutomation/UpdateManager.cs')
          if(-not $project.Contains('<Version>0.1.71</Version>')){throw 'project version mismatch'}
          if(-not $update.Contains('CurrentVersion = "V0.1.71"')){throw 'updater version mismatch'}

          "SOURCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'V0171_SOURCE_PATCH_OK'

      - name: Build and smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fish=Join-Path $env:SOURCE_ROOT 'FishingAutomation/FishingAutomation.csproj'
          $watch=Join-Path $env:SOURCE_ROOT 'MacroWatchdog/MacroWatchdog.csproj'

          dotnet build $fish -c Release -r win-x64
          if($LASTEXITCODE-ne0){throw 'FishingAutomation build failed'}
          dotnet build $watch -c Release
          if($LASTEXITCODE-ne0){throw 'MacroWatchdog build failed'}

          $pubArgs=@('-c','Release','-r','win-x64','--self-contained','true','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true','-p:EnableCompressionInSingleFile=true','-p:PublishTrimmed=false','-p:PublishAot=false','-p:DebugType=None','-p:DebugSymbols=false')
          dotnet publish $fish @pubArgs -o stage/release
          if($LASTEXITCODE-ne0){throw 'app publish failed'}
          dotnet publish $watch @pubArgs -o stage/watchdog
          if($LASTEXITCODE-ne0){throw 'watchdog publish failed'}
          Copy-Item stage/watchdog/MacroWatchdog.exe stage/release/MacroWatchdog.exe -Force

          $exe=(Resolve-Path stage/release/FishingAutomation.exe).Path
          if((Get-Item $exe).VersionInfo.FileVersion-ne'0.1.71.0'){throw "EXE version mismatch: $((Get-Item $exe).VersionInfo.FileVersion)"}

          $proc=Start-Process $exe -WorkingDirectory (Resolve-Path stage/release).Path -PassThru
          Start-Sleep 5
          $proc.Refresh()
          if($proc.HasExited){throw "smoke test exit $($proc.ExitCode)"}
          Stop-Process $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Process MacroWatchdog -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          Write-Host 'V0171_BUILD_SMOKE_OK'

      - name: Package Windows and source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:SOURCE_ROOT
          New-Item package/release,package/tools,package/FishingAutomation,out,source-package -ItemType Directory -Force | Out-Null
          Copy-Item stage/release/* package/release -Recurse -Force
          Copy-Item (Join-Path $root 'tools/ApplyUpdate.ps1') package/tools/ApplyUpdate.ps1 -Force
          Copy-Item (Join-Path $root 'START.cmd') package/START.cmd -Force
          Copy-Item (Join-Path $root 'REPAIR_AUTO_UPDATE.cmd') package/REPAIR_AUTO_UPDATE.cmd -Force
          'Compatibility directory for legacy updater notification restore.' | Set-Content package/FishingAutomation/.update_compat -Encoding ASCII
          'MABI AUTO V0.1.71 Windows Lite - Abyss combat timeout only' | Set-Content package/WINDOWS_LITE.txt -Encoding UTF8

          $zip='out/MabiAuto_V0.1.71_Windows_Lite.zip'
          Compress-Archive package/* $zip -CompressionLevel Optimal
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MabiAuto_V0.1.71_Windows_Lite.zip" | Set-Content "$zip.sha256" -Encoding ASCII

          Copy-Item (Join-Path $root 'FishingAutomation') source-package/FishingAutomation -Recurse
          Copy-Item (Join-Path $root 'MacroWatchdog') source-package/MacroWatchdog -Recurse
          Copy-Item (Join-Path $root 'tools') source-package/tools -Recurse
          Copy-Item (Join-Path $root 'START.cmd') source-package/START.cmd -Force
          Copy-Item (Join-Path $root 'REPAIR_AUTO_UPDATE.cmd') source-package/REPAIR_AUTO_UPDATE.cmd -Force
          Copy-Item release-source/v0171_release_notes.md source-package/RELEASE_NOTES.md
          Get-ChildItem source-package -Recurse -Directory | Where-Object { $_.Name -in @('bin','obj','debug') } | Remove-Item -Recurse -Force
          Compress-Archive source-package/* out/MabiAuto_V0.1.71_Source.zip -CompressionLevel Optimal

          Remove-Item verify -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip verify -Force
          if((Get-Item verify/release/FishingAutomation.exe).VersionInfo.FileVersion-ne'0.1.71.0'){throw 'ZIP EXE version mismatch'}
          Write-Host "V0171_PACKAGE_OK SHA256=$hash"

      - name: Publish V0.1.71
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $tag='V0.1.71'

          $all = gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if($LASTEXITCODE-ne0){throw 'Release list query failed'}
          $existing = @($all | Where-Object { $_.tag_name -eq $tag }) | Select-Object -First 1
          if($null -ne $existing){
            if(-not $existing.draft){
              throw 'V0.1.71 is already published; refusing to overwrite it'
            }
            gh api -X DELETE "repos/$repo/releases/$($existing.id)"
            if($LASTEXITCODE-ne0){throw 'Existing V0.1.71 draft cleanup failed'}
            Write-Host "Removed stale V0.1.71 draft release id=$($existing.id)"
          }

          gh release create $tag --repo $repo --target $env:GITHUB_SHA --title 'Mabi Auto V0.1.71' --notes-file release-source/v0171_release_notes.md out/MabiAuto_V0.1.71_Windows_Lite.zip out/MabiAuto_V0.1.71_Windows_Lite.zip.sha256 out/MabiAuto_V0.1.71_Source.zip
          if($LASTEXITCODE-ne0){throw 'V0.1.71 release creation failed'}

          $release=gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if($LASTEXITCODE-ne0){throw 'V0.1.71 release verification lookup failed'}
          $names=@($release.assets | ForEach-Object {$_.name})
          foreach($required in @('MabiAuto_V0.1.71_Windows_Lite.zip','MabiAuto_V0.1.71_Windows_Lite.zip.sha256','MabiAuto_V0.1.71_Source.zip')){
            if($required -notin $names){throw "release asset missing: $required"}
          }

          gh release edit $tag --repo $repo --latest
          if($LASTEXITCODE-ne0){throw 'Latest release marking failed'}

          $latest=gh api "repos/$repo/releases/latest" | ConvertFrom-Json
          if($latest.tag_name -ne $tag -or $latest.draft -or $latest.prerelease){throw 'Auto-update latest release mismatch'}
          Write-Host "V0171_RELEASE_OK $($release.html_url)"
