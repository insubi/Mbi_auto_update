name: Test V0.1.59 Abyss Sequence Regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-v0159-abyss-sequence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    steps:
      - name: Checkout strengthened tests
        uses: actions/checkout@v4
        with:
          ref: test-v0159-abyss-sequence-regression
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run strengthened regression against released V0.1.59 source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'

          New-Item source -ItemType Directory -Force | Out-Null
          gh release download V0.1.59 --repo $env:GITHUB_REPOSITORY --pattern 'MabiAuto_V0.1.59_Source.zip' --dir source
          if($LASTEXITCODE-ne0){throw 'V0.1.59 source download failed'}

          Expand-Archive source/MabiAuto_V0.1.59_Source.zip source/current -Force
          $root=(Resolve-Path source/current).Path
          $fish=Join-Path $root 'FishingAutomation/FishingAutomation.csproj'

          $project=Get-Content -Raw $fish
          if(-not $project.Contains('<Version>0.1.59</Version>')){
            throw 'released source is not V0.1.59'
          }

          dotnet build $fish -c Release -r win-x64
          if($LASTEXITCODE-ne0){throw 'V0.1.59 production source build failed'}

          $dll=Get-ChildItem (Join-Path $root 'FishingAutomation/bin/Release') -Recurse -Filter 'FishingAutomation.dll' |
            Where-Object { $_.FullName -match 'win-x64' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if(-not $dll){throw 'FishingAutomation.dll not found'}

          $sourceDir=(Resolve-Path (Join-Path $root 'FishingAutomation')).Path
          $actualResult=(Resolve-Path 'tests/abyss-offline/result_buttons_actual.b64').Path

          dotnet run --project tests/abyss-offline/AbyssOfflineRegressionTests.csproj -c Release -- $dll.FullName $sourceDir $actualResult
          if($LASTEXITCODE-ne0){throw 'strengthened V0.1.59 sequence regression failed'}

          Write-Host 'V0159_STRENGTHENED_SEQUENCE_REGRESSION_OK'
