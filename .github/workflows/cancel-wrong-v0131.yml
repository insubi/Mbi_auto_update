name: Cancel incorrect V0.1.31 runs

on:
  push:
    branches:
      - v0131-peaca-auto-route
    paths:
      - '.github/workflows/cancel-wrong-v0131.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel incorrect D2-2 release runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          for run_id in 35244294361 35244852958; do
            echo "Cancelling workflow run ${run_id}"
            gh api -X POST "repos/${REPO}/actions/runs/${run_id}/cancel" || true
          done
