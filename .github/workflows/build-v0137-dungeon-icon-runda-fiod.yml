name: Build V0.1.37 Dungeon Icon Runda Fiod

on:
  workflow_dispatch:
  push:
    branches:
      - v0137-dungeon-icon-runda-fiod
    paths:
      - '.github/workflows/build-v0137-dungeon-icon-runda-fiod.yml'
      - 'release-source/v0137_dungeon_icon_runda_fiod.py'
      - 'release-source/v0137_updater_survival.py'

permissions:
  contents: write

env:
  RELEASE_TAG: V0.1.37

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Patch build and validate V0.1.37
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'

          Invoke-WebRequest -Uri 'https://github.com/insubi/Mbi_auto_update/releases/download/V0.1.31/CombinedFishingDungeon_V0.1.31_PeacaAutoRoute.zip' -OutFile current.zip
          Expand-Archive current.zip -DestinationPath current
          $root=Get-ChildItem current -Directory | Select-Object -First 1
          if($null-eq$root){throw 'source root missing'}
          $fish=Join-Path $root.FullName 'FishingAutomation'

          python release-source/v0132_ulla_fixed_click_final.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.32 patch failed'}
          python release-source/v0133_result_retry_fastpath.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.33 patch failed'}
          python release-source/v0134_runtime_error_upload.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.34 patch failed'}
          python release-source/v0135_visual_test_environment.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.35 patch failed'}
          python release-source/v0136_worldmap_ocr_fix.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.36 patch failed'}
          python release-source/v0137_dungeon_icon_runda_fiod.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.37 patch failed'}
          python release-source/v0137_updater_survival.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.37 updater survival patch failed'}

          $project=Get-Content -Raw (Join-Path $fish 'FishingAutomation.csproj')
          $refui=Get-Content -Raw (Join-Path $fish 'MainForm.ReferenceUI.cs')
          $main=Get-Content -Raw (Join-Path $fish 'MainForm.cs')
          $engine=Get-Content -Raw (Join-Path $fish 'dungeon/ScenarioEngine.cs')
          $targets=Get-Content -Raw (Join-Path $fish 'dungeon/config/targets.json')
          $tester=Get-Content -Raw (Join-Path $fish 'VisualRecognitionTester.cs')
          $uploader=Get-Content -Raw (Join-Path $fish 'RuntimeErrorUploader.cs')

          foreach($required in @(
            '<Version>0.1.37</Version>',
            'DUNGEON_WORLD_ROUTE_V11',
            'TryFindDungeonIconAboveLabel',
            '위 던전 아이콘 클릭',
            'runda_d1_1',
            'runda_d2_1',
            'fiod_d1_1',
            'fiod_d2_1',
            '룬다 1-1',
            '룬다 2-1',
            '피오드 1-1',
            '피오드 2-1',
            'route_runda_map',
            'route_fiod_map',
            'route_regular_1_1',
            'route_regular_2_1',
            'route_enter_regular_1_1',
            'route_enter_regular_2_1',
            'VISUAL_TEST_ENV_V10',
            'RUNTIME_ERROR_GITHUB_UPLOAD_V9',
            'DUNGEON_RESULT_RETRY_FASTPATH_V8'
          )){
            if(-not (($project+$refui+$main+$engine+$targets+$tester+$uploader).Contains($required))){
              throw "required marker missing: $required"
            }
          }

          foreach($forbidden in @(
            'RunPeacaPreRouteAsync',
            'FindPeacaOnWorldMapAsync',
            '글자 위치 클릭'
          )){
            if($engine.Contains($forbidden)){throw "old direct-text route residue: $forbidden"}
          }

          if(-not $refui.Contains('AddButton("인식 테스트", new(18, 511, 178, 59), owner.ShowVisualRecognitionTest, "", "nav");')){
            throw 'recognition-test UI truncation fix missing'
          }

          dotnet restore (Join-Path $fish 'FishingAutomation.csproj')
          if($LASTEXITCODE-ne0){throw 'FishingAutomation restore failed'}
          dotnet build (Join-Path $fish 'FishingAutomation.csproj') -c Release --no-restore
          if($LASTEXITCODE-ne0){throw 'FishingAutomation build failed'}

          $watchProj=Join-Path $root.FullName 'MacroWatchdog/MacroWatchdog.csproj'
          if(Test-Path $watchProj){
            dotnet restore $watchProj
            if($LASTEXITCODE-ne0){throw 'MacroWatchdog restore failed'}
            dotnet build $watchProj -c Release --no-restore
            if($LASTEXITCODE-ne0){throw 'MacroWatchdog build failed'}
          }

          New-Item -ItemType Directory -Path stage,stage/release,package,package/release,package/tools,out | Out-Null
          $pubArgs=@('-c','Release','-r','win-x64','--self-contained','true','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true','-p:EnableCompressionInSingleFile=true','-p:PublishTrimmed=false','-p:PublishAot=false','-p:DebugType=None','-p:DebugSymbols=false')
          dotnet publish (Join-Path $fish 'FishingAutomation.csproj') @pubArgs -o stage/release
          if($LASTEXITCODE-ne0){throw 'FishingAutomation publish failed'}

          if(Test-Path $watchProj){
            dotnet publish $watchProj @pubArgs -o stage/watchdog
            if($LASTEXITCODE-ne0){throw 'MacroWatchdog publish failed'}
            if(Test-Path 'stage/watchdog/MacroWatchdog.exe'){
              Copy-Item 'stage/watchdog/MacroWatchdog.exe' 'stage/release/MacroWatchdog.exe' -Force
            }
          }

          $exe=(Resolve-Path 'stage/release/FishingAutomation.exe').Path
          $p=Start-Process $exe -WorkingDirectory (Resolve-Path 'stage/release').Path -PassThru
          Start-Sleep 5
          $p.Refresh()
          if($p.HasExited){throw "smoke test exit $($p.ExitCode)"}
          Stop-Process $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process MacroWatchdog -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'SMOKE_TEST_OK'

          Copy-Item 'stage/release/*' 'package/release' -Recurse -Force
          Copy-Item (Join-Path $root.FullName 'tools/ApplyUpdate.ps1') 'package/tools/ApplyUpdate.ps1' -Force
          @(
            'MABI AUTO V0.1.37 Windows Lite',
            'Updater-compatible package root.',
            'The archive root intentionally contains release/ and WINDOWS_LITE.txt.'
          ) | Set-Content 'package/WINDOWS_LITE.txt' -Encoding UTF8

          foreach($required in @(
            'package/release/FishingAutomation.exe',
            'package/release/dungeon/config/targets.json',
            'package/release/dungeon/templates/retry_visual_v0129.jpg',
            'package/release/templates/hook.png',
            'package/release/templates/gauge.png',
            'package/release/templates/healthbar.png',
            'package/release/templates/compass.png',
            'package/release/visual-tests/assets/peaca_map_actual_v0136.jpg',
            'package/release/visual-tests/assets/runda_map_actual_v0136.jpg',
            'package/tools/ApplyUpdate.ps1',
            'package/WINDOWS_LITE.txt'
          )){
            if(-not(Test-Path $required)){throw "updater package missing: $required"}
          }

          if(Test-Path 'package/START.cmd'){throw 'unexpected START.cmd in updater package'}
          if(Test-Path 'package/FishingAutomation'){throw 'unexpected source tree in updater package'}
          if(-not(Test-Path 'package/tools/ApplyUpdate.ps1')){throw 'updater survival file missing from package'}

          $zip=(Resolve-Path out).Path+'\MabiAuto_V0.1.37_Windows_Lite.zip'
          Compress-Archive -Path 'package/*' -DestinationPath $zip -CompressionLevel Optimal

          Remove-Item verify -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath verify -Force
          $children=@(Get-ChildItem verify -Force)
          $dirs=@($children|Where-Object{$_.PSIsContainer})
          if($children.Count-eq1 -and $dirs.Count-eq1){$sourceRoot=$dirs[0].FullName}else{$sourceRoot=(Resolve-Path verify).Path}
          if(-not(Test-Path (Join-Path $sourceRoot 'release/FishingAutomation.exe'))){throw 'updater simulation missing release/FishingAutomation.exe'}
          if(-not(Test-Path (Join-Path $sourceRoot 'WINDOWS_LITE.txt'))){throw 'updater simulation missing root marker'}
          if(Test-Path (Join-Path $sourceRoot 'START.cmd')){throw 'updater ZIP unexpectedly contains START.cmd'}
          if(Test-Path (Join-Path $sourceRoot 'FishingAutomation')){throw 'updater ZIP unexpectedly contains source tree'}
          if(-not(Test-Path (Join-Path $sourceRoot 'tools/ApplyUpdate.ps1'))){throw 'updater ZIP missing tools/ApplyUpdate.ps1'}
          Write-Host "UPDATER_LAYOUT_OK children=$($children.Count) dirs=$($dirs.Count) sourceRoot=$sourceRoot"

          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MabiAuto_V0.1.37_Windows_Lite.zip"|Set-Content "$zip.sha256" -Encoding ASCII
          $size=(Get-Item $zip).Length
          Write-Host "LITE_SHA256=$hash"
          Write-Host "LITE_SIZE=$size"
          if($size -gt 180000000){throw "updater ZIP unexpectedly large: $size"}

      - name: Preserve V0.1.37 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MabiAuto_V0.1.37_Windows_Lite
          path: |
            out/MabiAuto_V0.1.37_Windows_Lite.zip
            out/MabiAuto_V0.1.37_Windows_Lite.zip.sha256
          retention-days: 7
          compression-level: 0

      - name: Publish V0.1.37
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $tag=$env:RELEASE_TAG

          gh release view $tag --repo $env:REPO *> $null
          if($LASTEXITCODE-eq0){gh release delete $tag --repo $env:REPO --yes --cleanup-tag}
          $null=$LASTEXITCODE

          @(
            'MABI AUTO V0.1.37 - 던전 아이콘 클릭 + 룬다/피오드 1-1·2-1',
            '',
            '인식 테스트 메뉴 글자 잘림을 수정했습니다.',
            '월드맵 던전 이름은 OCR 위치 확인용으로만 사용하고 실제 클릭은 글씨 위의 던전 아이콘에만 합니다.',
            '아이콘 확인에 실패하면 글씨나 임의 좌표를 누르지 않고 정지합니다.',
            '룬다 1-1, 룬다 2-1, 피오드 1-1, 피오드 2-1을 추가했습니다.',
            '룬다/피오드는 1-1과 2-1만 사용하고 정확한 1층/2층 1구역 진입 문구 확인 후 Space를 누릅니다.',
            '업데이트 패키지에 tools/ApplyUpdate.ps1을 포함하고 다음 업데이트에서도 updater가 삭제되지 않도록 보강했습니다.'
          ) | Set-Content notes.txt -Encoding UTF8

          gh release create $tag --repo $env:REPO --target $env:GITHUB_SHA --title 'Mabi Auto V0.1.37' --notes-file notes.txt out/MabiAuto_V0.1.37_Windows_Lite.zip out/MabiAuto_V0.1.37_Windows_Lite.zip.sha256
          if($LASTEXITCODE-ne0){throw 'release publish failed'}

          $release=gh api "repos/$env:REPO/releases/tags/$tag" | ConvertFrom-Json
          $zip=@($release.assets|Where-Object{$_.name-eq'MabiAuto_V0.1.37_Windows_Lite.zip'})[0]
          if($null-eq$zip -or [int64]$zip.size-lt 1000000){throw 'published ZIP missing/small'}
          if([int64]$zip.size-gt 180000000){throw "published ZIP unexpectedly large: $($zip.size)"}
          Write-Host "RELEASE_URL=$($release.html_url)"
          Write-Host "RELEASE_DIGEST=$($zip.digest)"
          Write-Host "RELEASE_ZIP_SIZE=$($zip.size)"

      - name: Record V0.1.37 workflow status
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path workflow-status -Force | Out-Null
          @(
            "status=$env:JOB_STATUS",
            "run_id=${{ github.run_id }}",
            "run_attempt=${{ github.run_attempt }}",
            "sha=${{ github.sha }}",
            "ref=${{ github.ref }}",
            "time=$([DateTime]::UtcNow.ToString('O'))"
          ) | Set-Content workflow-status/v0137.txt -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflow-status/v0137.txt
          if(-not (git diff --cached --quiet)){
            git commit -m 'Record V0.1.37 workflow status [skip ci]'
            git push origin HEAD:v0137-dungeon-icon-runda-fiod
          }
