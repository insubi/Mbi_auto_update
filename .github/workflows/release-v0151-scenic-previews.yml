name: Release V0.1.51 Original Abyss Previews

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0151-scenic-previews.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v0151-original-abyss-previews
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    steps:
      - name: Checkout V0.1.51 patch source
        uses: actions/checkout@v4
        with:
          ref: v0151-restore-scenic-previews
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore V0.1.50 source and apply original previews
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item source -ItemType Directory -Force | Out-Null
          gh release download V0.1.50 --repo $env:GITHUB_REPOSITORY --pattern 'MabiAuto_V0.1.50_Source.zip' --dir source
          if($LASTEXITCODE-ne0){throw 'V0.1.50 source download failed'}
          Expand-Archive source/MabiAuto_V0.1.50_Source.zip source/current -Force
          $root=(Resolve-Path source/current).Path

          # Preserve hashes of unrelated runtime logic before this UI-asset-only fix.
          $guardFiles=@(
            'FishingAutomation/MainForm.cs',
            'FishingAutomation/dungeon/ScenarioEngine.cs',
            'FishingAutomation/dungeon/ScenarioEngine.AbyssRetry.cs',
            'FishingAutomation/dungeon/PeacaRouteEngine.cs',
            'FishingAutomation/abyss/config/scenario.json'
          )
          $before=@{}
          foreach($rel in $guardFiles){
            $p=Join-Path $root $rel
            if(-not(Test-Path $p)){throw "guard file missing before patch: $rel"}
            $before[$rel]=(Get-FileHash $p -Algorithm SHA256).Hash
          }

          python release-source/v0151_restore_scenic_previews.py $root
          if($LASTEXITCODE-ne0){throw 'V0.1.51 original preview patch failed'}

          foreach($rel in $guardFiles){
            $p=Join-Path $root $rel
            $after=(Get-FileHash $p -Algorithm SHA256).Hash
            if($after-ne$before[$rel]){throw "unrelated runtime file changed: $rel"}
          }

          $expected=@{
            'hallucination_anchorage.jpg'='0195c292d2b32cb369d2561ab01227e4b7120e9cade8178cc174d40bf8ceeb9d'
            'madness_cave.jpg'='e6af39c665f1126dde46f17054589413b88690a0eaae56fc14e06a6434b4e50e'
            'scattered_waterway.jpg'='d1d56c996e21aaf60c8ec6d09770b2b93ae918ea1c1c290f4e767b62490c1ff6'
          }
          foreach($entry in $expected.GetEnumerator()){
            $p=Join-Path $root "FishingAutomation/abyss/previews/$($entry.Key)"
            if(-not(Test-Path $p)){throw "restored original preview missing: $($entry.Key)"}
            $hash=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
            if($hash-ne$entry.Value){throw "restored original preview hash mismatch: $($entry.Key)"}
            Write-Host "ORIGINAL_PREVIEW_SOURCE_OK $($entry.Key) $hash"
          }

          $refui=Get-Content -Raw (Join-Path $root 'FishingAutomation/MainForm.ReferenceUI.cs')
          foreach($marker in @(
            'LoadDungeonPreview("hallucination_anchorage.jpg")',
            'LoadDungeonPreview("madness_cave.jpg")',
            'LoadDungeonPreview("scattered_waterway.jpg")',
            'Path.Combine(AppContext.BaseDirectory, "abyss", "previews", fileName)'
          )){
            if(-not $refui.Contains($marker)){throw "original preview UI marker missing: $marker"}
          }
          if($refui.Contains('Path.Combine(AppContext.BaseDirectory, "abyss", "templates", fileName)')){
            throw 'recognition templates are still wired to UI preview loader'
          }

          $project=Get-Content -Raw (Join-Path $root 'FishingAutomation/FishingAutomation.csproj')
          $update=Get-Content -Raw (Join-Path $root 'FishingAutomation/UpdateManager.cs')
          $main=Get-Content -Raw (Join-Path $root 'FishingAutomation/MainForm.cs')
          if(-not $project.Contains('<Version>0.1.51</Version>')){throw 'project version mismatch'}
          if(-not $update.Contains('CurrentVersion = "V0.1.51"')){throw 'updater version mismatch'}
          if(-not $main.Contains('await CheckForUpdatesAsync(false);')){throw 'startup auto-update check missing'}

          "SOURCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Windows build and verify original scenic previews
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:SOURCE_ROOT
          $fish=Join-Path $root 'FishingAutomation/FishingAutomation.csproj'
          $watch=Join-Path $root 'MacroWatchdog/MacroWatchdog.csproj'

          dotnet build $fish -c Release
          if($LASTEXITCODE-ne0){throw 'Windows app build failed'}
          dotnet build $watch -c Release
          if($LASTEXITCODE-ne0){throw 'watchdog build failed'}

          $pubArgs=@('-c','Release','-r','win-x64','--self-contained','true','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true','-p:EnableCompressionInSingleFile=true','-p:PublishTrimmed=false','-p:PublishAot=false','-p:DebugType=None','-p:DebugSymbols=false')
          dotnet publish $fish @pubArgs -o stage/release
          if($LASTEXITCODE-ne0){throw 'app publish failed'}
          dotnet publish $watch @pubArgs -o stage/watchdog
          if($LASTEXITCODE-ne0){throw 'watchdog publish failed'}
          Copy-Item stage/watchdog/MacroWatchdog.exe stage/release/MacroWatchdog.exe -Force

          $expected=@{
            'hallucination_anchorage.jpg'='0195c292d2b32cb369d2561ab01227e4b7120e9cade8178cc174d40bf8ceeb9d'
            'madness_cave.jpg'='e6af39c665f1126dde46f17054589413b88690a0eaae56fc14e06a6434b4e50e'
            'scattered_waterway.jpg'='d1d56c996e21aaf60c8ec6d09770b2b93ae918ea1c1c290f4e767b62490c1ff6'
          }
          foreach($entry in $expected.GetEnumerator()){
            $p="stage/release/abyss/previews/$($entry.Key)"
            if(-not(Test-Path $p)){throw "published original preview missing: $($entry.Key)"}
            $hash=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
            if($hash-ne$entry.Value){throw "published original preview hash mismatch: $($entry.Key)"}
            Write-Host "ORIGINAL_PREVIEW_PUBLISH_OK $($entry.Key) size=$((Get-Item $p).Length)"
          }

          $exe=(Resolve-Path stage/release/FishingAutomation.exe).Path
          if((Get-Item $exe).VersionInfo.FileVersion-ne'0.1.51.0'){throw "EXE version mismatch: $((Get-Item $exe).VersionInfo.FileVersion)"}
          $proc=Start-Process $exe -WorkingDirectory (Resolve-Path stage/release).Path -PassThru
          Start-Sleep 5
          $proc.Refresh()
          if($proc.HasExited){throw "smoke test exit $($proc.ExitCode)"}
          Stop-Process $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Process MacroWatchdog -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          New-Item package/release,package/tools,out -ItemType Directory -Force | Out-Null
          Copy-Item stage/release/* package/release -Recurse -Force
          Copy-Item (Join-Path $root 'tools/ApplyUpdate.ps1') package/tools/ApplyUpdate.ps1 -Force
          'MABI AUTO V0.1.51 Windows Lite - original Abyss scenic previews restored' | Set-Content package/WINDOWS_LITE.txt -Encoding UTF8

          $zip='out/MabiAuto_V0.1.51_Windows_Lite.zip'
          Compress-Archive package/* $zip -CompressionLevel Optimal
          Remove-Item verify -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip verify -Force
          foreach($entry in $expected.GetEnumerator()){
            $p="verify/release/abyss/previews/$($entry.Key)"
            if(-not(Test-Path $p)){throw "ZIP original preview missing: $($entry.Key)"}
            $hash=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
            if($hash-ne$entry.Value){throw "ZIP original preview hash mismatch: $($entry.Key)"}
            Write-Host "ORIGINAL_PREVIEW_ZIP_OK $($entry.Key) $hash"
          }
          if((Get-Item verify/release/FishingAutomation.exe).VersionInfo.FileVersion-ne'0.1.51.0'){throw 'ZIP EXE version mismatch'}
          if(-not(Test-Path verify/tools/ApplyUpdate.ps1)){throw 'ZIP updater missing'}

          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MabiAuto_V0.1.51_Windows_Lite.zip" | Set-Content "$zip.sha256" -Encoding ASCII

          New-Item source-package -ItemType Directory -Force | Out-Null
          Copy-Item (Join-Path $root 'FishingAutomation') source-package/FishingAutomation -Recurse
          Copy-Item (Join-Path $root 'MacroWatchdog') source-package/MacroWatchdog -Recurse
          Copy-Item (Join-Path $root 'tools') source-package/tools -Recurse
          Get-ChildItem source-package -Recurse -Directory | Where-Object { $_.Name -in @('bin','obj','debug') } | Remove-Item -Recurse -Force
          Copy-Item release-source/v0151_release_notes.md source-package/RELEASE_NOTES.md
          Compress-Archive source-package/* out/MabiAuto_V0.1.51_Source.zip -CompressionLevel Optimal

          Write-Host "V0151_PACKAGE_OK SHA256=$hash"

      - name: Publish V0.1.51
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $tag='V0.1.51'
          $target=(git rev-parse HEAD).Trim()

          gh release view $tag --repo $repo *> $null
          if($LASTEXITCODE-eq0){
            gh release delete $tag --repo $repo --yes --cleanup-tag
            if($LASTEXITCODE-ne0){throw 'existing V0.1.51 release cleanup failed'}
          } else {
            $null=$LASTEXITCODE
          }

          gh release create $tag --repo $repo --target $target --title 'Mabi Auto V0.1.51' --notes-file release-source/v0151_release_notes.md out/MabiAuto_V0.1.51_Windows_Lite.zip out/MabiAuto_V0.1.51_Windows_Lite.zip.sha256 out/MabiAuto_V0.1.51_Source.zip
          if($LASTEXITCODE-ne0){throw 'V0.1.51 release creation failed'}

          $release=gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if($release.draft -or $release.prerelease){throw 'V0.1.51 must be stable/public'}
          $names=@($release.assets | ForEach-Object {$_.name})
          foreach($required in @('MabiAuto_V0.1.51_Windows_Lite.zip','MabiAuto_V0.1.51_Windows_Lite.zip.sha256','MabiAuto_V0.1.51_Source.zip')){
            if($required -notin $names){throw "release asset missing: $required"}
          }
          Write-Host "V0151_RELEASE_OK $($release.html_url)"
