name: Release V0.1.56 Diagnostics Only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0156-diagnostics-only.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v0156-diagnostics-only
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    steps:
      - name: Checkout V0.1.56 diagnostic patch
        uses: actions/checkout@v4
        with:
          ref: v0156-diagnostics-only
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore V0.1.55 source and apply diagnostics only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item source -ItemType Directory -Force | Out-Null
          gh release download V0.1.55 --repo $env:GITHUB_REPOSITORY --pattern 'MabiAuto_V0.1.55_Source.zip' --dir source
          if($LASTEXITCODE-ne0){throw 'V0.1.55 source download failed'}
          Expand-Archive source/MabiAuto_V0.1.55_Source.zip source/current -Force
          $root=(Resolve-Path source/current).Path

          $before=@{}
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $rel=$_.FullName.Substring($root.Length+1).Replace('\','/')
            $before[$rel]=(Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }

          python release-source/v0156_diagnostics_only.py $root
          if($LASTEXITCODE-ne0){throw 'V0.1.56 diagnostics patch failed'}

          $allowedChanged=@(
            'FishingAutomation/dungeon/ScenarioEngine.cs',
            'FishingAutomation/dungeon/ScenarioEngine.AbyssRetry.cs',
            'FishingAutomation/FishingAutomation.csproj',
            'FishingAutomation/UpdateManager.cs'
          )
          $allowedNew=@(
            'FishingAutomation/dungeon/ScenarioEngine.Diagnostics.cs'
          )

          $after=@{}
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $rel=$_.FullName.Substring($root.Length+1).Replace('\','/')
            $after[$rel]=(Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }

          foreach($rel in $before.Keys){
            if(-not $after.ContainsKey($rel)){throw "diagnostics patch deleted file: $rel"}
            if($before[$rel]-ne$after[$rel] -and $rel -notin $allowedChanged){
              throw "unexpected non-diagnostic file changed: $rel"
            }
          }
          foreach($rel in $after.Keys){
            if(-not $before.ContainsKey($rel) -and $rel -notin $allowedNew){
              throw "unexpected new file created: $rel"
            }
          }
          foreach($rel in $allowedChanged){
            if(-not $before.ContainsKey($rel)){throw "allowed source file missing before patch: $rel"}
            if($before[$rel]-eq$after[$rel]){throw "expected diagnostic/metadata file did not change: $rel"}
          }
          foreach($rel in $allowedNew){
            if(-not $after.ContainsKey($rel)){throw "diagnostic file missing: $rel"}
          }

          $retry=Get-Content -Raw (Join-Path $root 'FishingAutomation/dungeon/ScenarioEngine.AbyssRetry.cs')
          foreach($marker in @(
            'ScaleAbyssResultRoi',
            'GetGreenButtonRatio',
            'aspect < 0.74 || aspect > 0.86',
            'exitGreen < 0.18 || retryGreen < 0.18 || otherGreen < 0.18',
            'retry.Found && previous.Found && retry.Bounds.IntersectsWith(previous.Bounds)',
            '_input.ClickClientPoint(_hwnd, retry.Center);'
          )){
            if(-not $retry.Contains($marker)){throw "V0.1.55 result behavior lost: $marker"}
          }

          $engine=Get-Content -Raw (Join-Path $root 'FishingAutomation/dungeon/ScenarioEngine.cs')
          foreach($marker in @(
            'missing clear/touch templates is NOT treated as a successful',
            'Step 5 is not complete until the actual result screen is confirmed.',
            '어비스 클리어 화면 클릭 후 실제 결과 화면을 30초 안에 확인하지 못했습니다.'
          )){
            if(-not $engine.Contains($marker)){throw "V0.1.54 clear transition behavior lost: $marker"}
          }

          $diag=Get-Content -Raw (Join-Path $root 'FishingAutomation/dungeon/ScenarioEngine.Diagnostics.cs')
          foreach($marker in @(
            'Queue<Bitmap> _diagnosticFrames',
            'while (_diagnosticFrames.Count > 5)',
            'now - _diagnosticLastFrameSampleTick < 500',
            'DiagnosticPersistFailure',
            'DiagnosticSummary',
            '[진단] 어비스 상태 전환'
          )){
            if(-not $diag.Contains($marker)){throw "diagnostic marker missing: $marker"}
          }

          $project=Get-Content -Raw (Join-Path $root 'FishingAutomation/FishingAutomation.csproj')
          $update=Get-Content -Raw (Join-Path $root 'FishingAutomation/UpdateManager.cs')
          $main=Get-Content -Raw (Join-Path $root 'FishingAutomation/MainForm.cs')
          if(-not $project.Contains('<Version>0.1.56</Version>')){throw 'project version mismatch'}
          if(-not $update.Contains('CurrentVersion = "V0.1.56"')){throw 'updater version mismatch'}
          if(-not $main.Contains('await CheckForUpdatesAsync(false);')){throw 'startup auto-update check missing'}

          Write-Host 'V0156_DIAGNOSTICS_ONLY_AUDIT_OK'
          "SOURCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Windows build and smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:SOURCE_ROOT
          $fish=Join-Path $root 'FishingAutomation/FishingAutomation.csproj'
          $watch=Join-Path $root 'MacroWatchdog/MacroWatchdog.csproj'

          dotnet build $fish -c Release
          if($LASTEXITCODE-ne0){throw 'Windows app build failed'}
          dotnet build $watch -c Release
          if($LASTEXITCODE-ne0){throw 'watchdog build failed'}

          $pubArgs=@('-c','Release','-r','win-x64','--self-contained','true','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true','-p:EnableCompressionInSingleFile=true','-p:PublishTrimmed=false','-p:PublishAot=false','-p:DebugType=None','-p:DebugSymbols=false')
          dotnet publish $fish @pubArgs -o stage/release
          if($LASTEXITCODE-ne0){throw 'app publish failed'}
          dotnet publish $watch @pubArgs -o stage/watchdog
          if($LASTEXITCODE-ne0){throw 'watchdog publish failed'}
          Copy-Item stage/watchdog/MacroWatchdog.exe stage/release/MacroWatchdog.exe -Force

          foreach($name in @('hallucination_anchorage.jpg','madness_cave.jpg','scattered_waterway.jpg')){
            if(-not(Test-Path "stage/release/abyss/previews/$name")){throw "Abyss preview lost: $name"}
          }

          $exe=(Resolve-Path stage/release/FishingAutomation.exe).Path
          if((Get-Item $exe).VersionInfo.FileVersion-ne'0.1.56.0'){throw "EXE version mismatch: $((Get-Item $exe).VersionInfo.FileVersion)"}
          $proc=Start-Process $exe -WorkingDirectory (Resolve-Path stage/release).Path -PassThru
          Start-Sleep 5
          $proc.Refresh()
          if($proc.HasExited){throw "smoke test exit $($proc.ExitCode)"}
          Stop-Process $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Process MacroWatchdog -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          New-Item package/release,package/tools,out -ItemType Directory -Force | Out-Null
          Copy-Item stage/release/* package/release -Recurse -Force
          Copy-Item (Join-Path $root 'tools/ApplyUpdate.ps1') package/tools/ApplyUpdate.ps1 -Force
          'MABI AUTO V0.1.56 Windows Lite - diagnostics only' | Set-Content package/WINDOWS_LITE.txt -Encoding UTF8

          $zip='out/MabiAuto_V0.1.56_Windows_Lite.zip'
          Compress-Archive package/* $zip -CompressionLevel Optimal
          Remove-Item verify -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip verify -Force

          if((Get-Item verify/release/FishingAutomation.exe).VersionInfo.FileVersion-ne'0.1.56.0'){throw 'ZIP EXE version mismatch'}
          if(-not(Test-Path verify/tools/ApplyUpdate.ps1)){throw 'ZIP updater missing'}
          foreach($name in @('hallucination_anchorage.jpg','madness_cave.jpg','scattered_waterway.jpg')){
            if(-not(Test-Path "verify/release/abyss/previews/$name")){throw "ZIP Abyss preview lost: $name"}
          }

          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MabiAuto_V0.1.56_Windows_Lite.zip" | Set-Content "$zip.sha256" -Encoding ASCII

          New-Item source-package -ItemType Directory -Force | Out-Null
          Copy-Item (Join-Path $root 'FishingAutomation') source-package/FishingAutomation -Recurse
          Copy-Item (Join-Path $root 'MacroWatchdog') source-package/MacroWatchdog -Recurse
          Copy-Item (Join-Path $root 'tools') source-package/tools -Recurse
          Get-ChildItem source-package -Recurse -Directory | Where-Object { $_.Name -in @('bin','obj','debug') } | Remove-Item -Recurse -Force
          Copy-Item release-source/v0156_release_notes.md source-package/RELEASE_NOTES.md
          Compress-Archive source-package/* out/MabiAuto_V0.1.56_Source.zip -CompressionLevel Optimal

          Write-Host "V0156_PACKAGE_OK SHA256=$hash"

      - name: Publish V0.1.56
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $tag='V0.1.56'
          $target=(git rev-parse HEAD).Trim()

          gh release view $tag --repo $repo *> $null
          if($LASTEXITCODE-eq0){
            gh release delete $tag --repo $repo --yes --cleanup-tag
            if($LASTEXITCODE-ne0){throw 'existing V0.1.56 release cleanup failed'}
          } else {
            $null=$LASTEXITCODE
          }

          gh release create $tag --repo $repo --target $target --title 'Mabi Auto V0.1.56' --notes-file release-source/v0156_release_notes.md out/MabiAuto_V0.1.56_Windows_Lite.zip out/MabiAuto_V0.1.56_Windows_Lite.zip.sha256 out/MabiAuto_V0.1.56_Source.zip
          if($LASTEXITCODE-ne0){throw 'V0.1.56 release creation failed'}

          $release=gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if($release.draft -or $release.prerelease){throw 'V0.1.56 must be stable/public'}
          $names=@($release.assets | ForEach-Object {$_.name})
          foreach($required in @('MabiAuto_V0.1.56_Windows_Lite.zip','MabiAuto_V0.1.56_Windows_Lite.zip.sha256','MabiAuto_V0.1.56_Source.zip')){
            if($required -notin $names){throw "release asset missing: $required"}
          }
          Write-Host "V0156_RELEASE_OK $($release.html_url)"
