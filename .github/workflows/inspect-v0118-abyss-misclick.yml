name: Inspect V0.1.18 Abyss Misclick

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-v0118-abyss-misclick.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect V0.1.18 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri 'https://github.com/insubi/Mbi_auto_update/releases/download/V0.1.18/CombinedFishingDungeon_V0.1.18_CompassRecovery.zip' -OutFile current.zip
          Expand-Archive current.zip -DestinationPath current
          $root=Get-ChildItem current -Directory | Select-Object -First 1
          if($null -eq $root){throw 'source root missing'}
          $fish=Join-Path $root.FullName 'FishingAutomation'
          $out = New-Object System.Collections.Generic.List[string]
          $out.Add('=== FILE TREE (abyss/dungeon) ===')
          Get-ChildItem $fish -Recurse -File | Where-Object { $_.FullName -match '\\(abyss|dungeon)\\' } | ForEach-Object { $out.Add($_.FullName.Substring($root.FullName.Length+1)) }
          $out.Add('')
          $out.Add('=== TARGETS.JSON ===')
          $targets=Join-Path $fish 'abyss/config/targets.json'
          if(Test-Path $targets){ $out.Add((Get-Content -Raw $targets)) }
          $out.Add('')
          $out.Add('=== SEARCH: menu/click/selected/abyss/던전/어비스/망령 ===')
          Get-ChildItem $fish -Recurse -File -Include *.cs,*.json | ForEach-Object {
            $p=$_.FullName
            $lines=Get-Content $p
            for($i=0;$i -lt $lines.Count;$i++){
              if($lines[$i] -match 'abyss|menu|click|selected|던전|어비스|망령'){
                $out.Add(('{0}:{1}: {2}' -f $p.Substring($root.FullName.Length+1),($i+1),$lines[$i]))
              }
            }
          }
          New-Item -ItemType Directory -Force inspection | Out-Null
          $out | Set-Content inspection/v0118_abyss_misclick.txt -Encoding UTF8
          Copy-Item (Join-Path $fish 'dungeon/ScenarioEngine.cs') inspection/v0118_ScenarioEngine.cs.txt -Force
          Copy-Item (Join-Path $fish 'dungeon/TargetDetector.cs') inspection/v0118_TargetDetector.cs.txt -Force
          Copy-Item (Join-Path $fish 'dungeon/TemplateMatcher.cs') inspection/v0118_TemplateMatcher.cs.txt -Force
          Copy-Item (Join-Path $fish 'dungeon/InputController.cs') inspection/v0118_InputController.cs.txt -Force
          Copy-Item (Join-Path $fish 'MainForm.cs') inspection/v0118_MainForm.cs.txt -Force
          Copy-Item (Join-Path $fish 'abyss/config/targets.json') inspection/v0118_abyss_targets.json.txt -Force
          Copy-Item (Join-Path $fish 'abyss/config/scenario.json') inspection/v0118_abyss_scenario.json.txt -Force
          $abyssPng=Join-Path $fish 'abyss/templates/abyss.png'
          [Convert]::ToBase64String([IO.File]::ReadAllBytes($abyssPng)) | Set-Content inspection/v0118_abyss_template.b64 -Encoding ASCII
          Add-Type -AssemblyName System.Drawing
          $img=[System.Drawing.Image]::FromFile($abyssPng)
          "width=$($img.Width)`nheight=$($img.Height)`nsha256=$((Get-FileHash $abyssPng -Algorithm SHA256).Hash.ToLowerInvariant())" | Set-Content inspection/v0118_abyss_template_meta.txt -Encoding ASCII
          $img.Dispose()
      - name: Commit inspection
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection/v0118_*
          git commit -m 'Add V0.1.18 Abyss template inspection data' || exit 0
          git push
