name: Build V0.1.3 Frozen Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v76-frozen.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download v76 source and package
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path source-download,source-work,pkg-download,pkg-work,publish | Out-Null
          gh release download v76 --repo $env:REPO --pattern 'CombinedFishingDungeon_v76_StabilityRemote.zip' --dir source-download
          gh release download v76 --repo $env:REPO --pattern 'MabiAuto_v76_Windows_Lite.zip' --dir pkg-download
          tar -xf source-download/CombinedFishingDungeon_v76_StabilityRemote.zip -C source-work
          tar -xf pkg-download/MabiAuto_v76_Windows_Lite.zip -C pkg-work

          $sourceRoot = Get-ChildItem source-work -Directory | Select-Object -First 1
          $packageRoot = Get-ChildItem pkg-work -Directory | Select-Object -First 1
          if ($null -eq $sourceRoot -or $null -eq $packageRoot) { throw 'v76 roots not found' }

          $updater = Join-Path $sourceRoot.FullName 'FishingAutomation/UpdateManager.cs'
          $text = Get-Content -LiteralPath $updater -Raw
          $pattern = '(?s)public static async Task<ReleaseUpdateInfo\?> CheckLatestAsync\(CancellationToken ct = default\)\s*\{.*?\n\s*\}\s*\n\s*private static bool IsMainReleaseTag'
          $replacement = @'
public static Task<ReleaseUpdateInfo?> CheckLatestAsync(CancellationToken ct = default)
    {
        // Frozen diagnostic build: intentionally disable all GitHub update discovery.
        return Task.FromResult<ReleaseUpdateInfo?>(null);
    }

    private static bool IsMainReleaseTag
'@
          $patched = [regex]::Replace($text, $pattern, $replacement, 1)
          if ($patched -eq $text -or -not $patched.Contains('Frozen diagnostic build')) { throw 'Failed to patch v76 updater' }
          Set-Content -LiteralPath $updater -Value $patched -Encoding UTF8

          $app = Join-Path $sourceRoot.FullName 'FishingAutomation'
          $publishArgs = @('-c','Release','-r','win-x64','--self-contained','true',
            '-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true',
            '-p:EnableCompressionInSingleFile=true','-p:PublishTrimmed=false','-p:PublishAot=false',
            '-p:DebugType=None','-p:DebugSymbols=false')
          dotnet publish (Join-Path $app 'FishingAutomation.csproj') @publishArgs -o publish
          if ($LASTEXITCODE -ne 0) { throw 'Frozen v76 publish failed' }

          $newExe = Join-Path (Resolve-Path publish).Path 'FishingAutomation.exe'
          $runtimeExe = Join-Path $packageRoot.FullName 'release/FishingAutomation.exe'
          Copy-Item -LiteralPath $newExe -Destination $runtimeExe -Force

          $mirrorUpdater = Join-Path $packageRoot.FullName 'FishingAutomation/UpdateManager.cs'
          if (Test-Path -LiteralPath $mirrorUpdater) { Copy-Item -LiteralPath $updater -Destination $mirrorUpdater -Force }

          @'
MABI AUTO V0.1.3 FROZEN TEST

- Based on the original v76 / public V0.1.3 source and package.
- Automatic GitHub update discovery is disabled in this diagnostic build.
- Purpose: verify the older fishing state machine without being replaced by a newer release.
- Expected startup flow to test: compass -> S -> hook -> Space -> gauge.
- Do not use this as the normal latest release after diagnosis is complete.
'@ | Set-Content -LiteralPath (Join-Path $packageRoot.FullName 'FROZEN_TEST.txt') -Encoding UTF8

          $out = 'MabiAuto_V0.1.3_FROZEN_TEST.zip'
          Compress-Archive -LiteralPath $packageRoot.FullName -DestinationPath $out -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $out" | Set-Content -LiteralPath "$out.sha256" -Encoding ASCII
          "FROZEN_ZIP=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish frozen test release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'V0.1.3-frozen-test'
          $notes = @'
V0.1.3 frozen diagnostic build

Original v76/V0.1.3 fishing logic is preserved while GitHub automatic update discovery is disabled.
Use only to verify the old fishing sequence: compass -> S -> hook -> Space -> gauge.
This release is intentionally marked prerelease and must not replace the normal latest release.
'@
          Set-Content -LiteralPath notes.txt -Value $notes -Encoding UTF8
          if (gh release view $tag --repo $env:REPO *> $null) {
            gh release upload $tag $env:FROZEN_ZIP "$env:FROZEN_ZIP.sha256" --repo $env:REPO --clobber
          } else {
            gh release create $tag $env:FROZEN_ZIP "$env:FROZEN_ZIP.sha256" --repo $env:REPO --title 'Mabi Auto V0.1.3 Frozen Test' --notes-file notes.txt --prerelease
          }
