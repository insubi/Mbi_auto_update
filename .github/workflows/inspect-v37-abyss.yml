name: Inspect v37 abyss crash

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v37-abyss.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect v37 abyss files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir work && cd work
          gh release download v37 --repo "$REPO" --pattern 'CombinedFishingDungeon_v37_StabilityRemote.zip'
          unzip -q CombinedFishingDungeon_v37_StabilityRemote.zip
          ROOT="$(find . -maxdepth 2 -type d -name FishingAutomation | head -n1)"
          echo "ROOT=$ROOT"
          echo '===== abyss config and templates ====='
          find "$ROOT/abyss" -maxdepth 3 -type f -printf '%p %s bytes\n' | sort || true
          echo '===== image file types ====='
          find "$ROOT/abyss" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0 | xargs -0 -r file
          echo '===== TargetDetector.cs ====='
          cat "$ROOT/Dungeon/TargetDetector.cs" || true
          echo '===== TemplateMatcher.cs ====='
          cat "$ROOT/Dungeon/TemplateMatcher.cs" || true
          echo '===== WindowCapture.cs ====='
          cat "$ROOT/Dungeon/WindowCapture.cs" || true
          echo '===== UpdateManager.cs ====='
          cat "$ROOT/UpdateManager.cs" || true
