name: Release V0.1.60 Potion ESC and Result Multi-Signal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0160-potion-result.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v0160-potion-result
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    steps:
      - name: Checkout V0.1.60 branch
        uses: actions/checkout@v4
        with:
          ref: v0160-potion-result-multisignal
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore V0.1.59 source and apply V0.1.60
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item source -ItemType Directory -Force | Out-Null
          gh release download V0.1.59 --repo $env:GITHUB_REPOSITORY --pattern 'MabiAuto_V0.1.59_Source.zip' --dir source
          if($LASTEXITCODE-ne0){throw 'V0.1.59 source download failed'}
          Expand-Archive source/MabiAuto_V0.1.59_Source.zip source/current -Force
          $root=(Resolve-Path source/current).Path

          $before=@{}
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $rel=$_.FullName.Substring($root.Length+1).Replace('\','/')
            $before[$rel]=(Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }

          python release-source/v0160_potion_result_multisignal.py $root
          if($LASTEXITCODE-ne0){throw 'V0.1.60 patch failed'}

          $after=@{}
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $rel=$_.FullName.Substring($root.Length+1).Replace('\','/')
            $after[$rel]=(Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }

          $allowed=@(
            'FishingAutomation/dungeon/ScenarioEngine.cs',
            'FishingAutomation/dungeon/ScenarioEngine.AbyssRetry.cs',
            'FishingAutomation/abyss/config/scenario.json',
            'FishingAutomation/dungeon/config/scenario.json',
            'FishingAutomation/dungeon/config/targets.json',
            'FishingAutomation/dungeon/templates/popup_close.png',
            'FishingAutomation/FishingAutomation.csproj',
            'FishingAutomation/UpdateManager.cs'
          )
          $mutated=@()
          foreach($rel in $after.Keys){
            if(-not $before.ContainsKey($rel) -or $before[$rel]-ne$after[$rel]){$mutated += $rel}
          }
          foreach($rel in $before.Keys){
            if(-not $after.ContainsKey($rel)){throw "V0.1.60 deleted runtime/source file: $rel"}
          }
          foreach($rel in $mutated){
            if($rel -notin $allowed){throw "unexpected V0.1.60 mutation: $rel"}
          }
          foreach($required in @(
            'FishingAutomation/dungeon/ScenarioEngine.cs',
            'FishingAutomation/dungeon/ScenarioEngine.AbyssRetry.cs',
            'FishingAutomation/abyss/config/scenario.json',
            'FishingAutomation/dungeon/config/scenario.json',
            'FishingAutomation/dungeon/config/targets.json',
            'FishingAutomation/FishingAutomation.csproj',
            'FishingAutomation/UpdateManager.cs'
          )){
            if($required -notin $mutated){throw "expected V0.1.60 mutation missing: $required"}
          }

          $critical=@(
            'FishingAutomation/MainForm.cs',
            'FishingAutomation/MainForm.ReferenceUI.cs',
            'FishingAutomation/dungeon/ScenarioEngine.AbyssState.cs',
            'FishingAutomation/dungeon/ScenarioEngine.Diagnostics.cs',
            'FishingAutomation/dungeon/PeacaRouteEngine.cs',
            'FishingAutomation/abyss/config/targets.json',
            'FishingAutomation/abyss/config/appsettings.json',
            'FishingAutomation/dungeon/config/appsettings.json',
            'tools/ApplyUpdate.ps1',
            'START.cmd',
            'REPAIR_AUTO_UPDATE.cmd'
          )
          foreach($rel in $critical){
            if(-not $before.ContainsKey($rel)){throw "critical V0.1.59 file missing: $rel"}
            if($before[$rel]-ne$after[$rel]){throw "critical unrelated behavior changed: $rel"}
          }

          $srcTpl=Join-Path $root 'FishingAutomation/abyss/templates/popup_close.png'
          $dstTpl=Join-Path $root 'FishingAutomation/dungeon/templates/popup_close.png'
          if(-not(Test-Path $dstTpl)){throw 'normal dungeon popup template missing'}
          if((Get-FileHash $srcTpl -Algorithm SHA256).Hash-ne(Get-FileHash $dstTpl -Algorithm SHA256).Hash){
            throw 'normal popup template is not the proven Abyss template'
          }

          $normal=Get-Content -Raw (Join-Path $root 'FishingAutomation/dungeon/config/scenario.json') | ConvertFrom-Json
          $abyss=Get-Content -Raw (Join-Path $root 'FishingAutomation/abyss/config/scenario.json') | ConvertFrom-Json
          $normalTargets=Get-Content -Raw (Join-Path $root 'FishingAutomation/dungeon/config/targets.json') | ConvertFrom-Json
          $nm=@($normal.Monitors | Where-Object Target -eq 'potion_popup_close')
          $am=@($abyss.Monitors | Where-Object Target -eq 'abyss_popup_close')
          $nt=@($normalTargets | Where-Object Id -eq 'potion_popup_close')
          if($nm.Count-ne1 -or $nm[0].Action-ne'escape'){throw 'normal potion popup ESC monitor missing'}
          if($am.Count-ne1 -or $am[0].Action-ne'escape'){throw 'Abyss potion popup ESC monitor missing'}
          if($nt.Count-ne1 -or $nt[0].TemplatePath-ne'templates/popup_close.png'){throw 'normal potion popup target/template missing'}

          $engine=Get-Content -Raw (Join-Path $root 'FishingAutomation/dungeon/ScenarioEngine.cs')
          foreach($marker in @(
            'POTION_POPUP_ESC_V1',
            'case "escape":',
            '_input.TapScanCode(0x01);',
            'ESC 1회로 닫기 (구매 버튼 클릭 금지)',
            'ESC 후 닫힘 2프레임 확인',
            '추가 입력 없이 정지'
          )){
            if(-not $engine.Contains($marker)){throw "potion ESC marker missing: $marker"}
          }

          $retry=Get-Content -Raw (Join-Path $root 'FishingAutomation/dungeon/ScenarioEngine.AbyssRetry.cs')
          foreach($marker in @(
            'V0160_ABYSS_RESULT_MULTI_SIGNAL',
            'bool ocrSignal',
            'bool visualSignal = TryDetectAbyssResultButtonRow',
            'result-multisignal rejected',
            'visual_result_button_row_3signal',
            'exitGreen < 0.18 || retryGreen < 0.18 || otherGreen < 0.18',
            'retry.Found && previous.Found && retry.Bounds.IntersectsWith(previous.Bounds)',
            'AbyssRequireState(AbyssFlowState.ResultConfirmed, "다시 하기 클릭")'
          )){
            if(-not $retry.Contains($marker)){throw "result safety marker missing: $marker"}
          }

          $project=Get-Content -Raw (Join-Path $root 'FishingAutomation/FishingAutomation.csproj')
          $update=Get-Content -Raw (Join-Path $root 'FishingAutomation/UpdateManager.cs')
          if(-not $project.Contains('<Version>0.1.60</Version>')){throw 'project version mismatch'}
          if(-not $update.Contains('CurrentVersion = "V0.1.60"')){throw 'updater version mismatch'}

          Write-Host ('V0160_MUTATIONS ' + (($mutated | Sort-Object) -join ', '))
          Write-Host 'V0160_SOURCE_AUDIT_OK'
          "SOURCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build production app
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fish=Join-Path $env:SOURCE_ROOT 'FishingAutomation/FishingAutomation.csproj'
          dotnet build $fish -c Release -r win-x64
          if($LASTEXITCODE-ne0){throw 'production build failed'}

          $dll=Get-ChildItem (Join-Path $env:SOURCE_ROOT 'FishingAutomation/bin/Release') -Recurse -Filter 'FishingAutomation.dll' |
            Where-Object { $_.FullName -match 'win-x64' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if(-not $dll){throw 'production FishingAutomation.dll not found'}
          "PRODUCTION_DLL=$($dll.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run V0.1.59 regression plus V0.1.60 safety tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fishDir=(Resolve-Path (Join-Path $env:SOURCE_ROOT 'FishingAutomation')).Path
          $actualResult=(Resolve-Path 'tests/abyss-offline/result_buttons_actual.b64').Path

          $b64=((Get-Content $actualResult) -join '').Trim()
          if($b64.Length-ne4032){throw "actual-capture fixture b64 length mismatch: $($b64.Length)"}
          $bytes=[Convert]::FromBase64String($b64)
          $fixtureHash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          if($fixtureHash-ne'c23e9e68ac7cfbb0a67fd51a72c91df339f3ca0a664a1e57d2d1b1589b23e79d'){
            throw "actual-capture fixture hash mismatch: $fixtureHash"
          }

          dotnet run --project tests/abyss-offline/AbyssOfflineRegressionTests.csproj -c Release -- $env:PRODUCTION_DLL $fishDir $actualResult
          if($LASTEXITCODE-ne0){throw 'Abyss regression/state test failed'}
          Write-Host 'V0160_REGRESSION_OK'

      - name: Publish Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:SOURCE_ROOT
          $fish=Join-Path $root 'FishingAutomation/FishingAutomation.csproj'
          $watch=Join-Path $root 'MacroWatchdog/MacroWatchdog.csproj'

          dotnet build $watch -c Release
          if($LASTEXITCODE-ne0){throw 'watchdog build failed'}

          $pubArgs=@('-c','Release','-r','win-x64','--self-contained','true','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true','-p:EnableCompressionInSingleFile=true','-p:PublishTrimmed=false','-p:PublishAot=false','-p:DebugType=None','-p:DebugSymbols=false')
          dotnet publish $fish @pubArgs -o stage/release
          if($LASTEXITCODE-ne0){throw 'app publish failed'}
          dotnet publish $watch @pubArgs -o stage/watchdog
          if($LASTEXITCODE-ne0){throw 'watchdog publish failed'}
          Copy-Item stage/watchdog/MacroWatchdog.exe stage/release/MacroWatchdog.exe -Force

          $exe=(Resolve-Path stage/release/FishingAutomation.exe).Path
          if((Get-Item $exe).VersionInfo.FileVersion-ne'0.1.60.0'){throw "EXE version mismatch: $((Get-Item $exe).VersionInfo.FileVersion)"}

          $proc=Start-Process $exe -WorkingDirectory (Resolve-Path stage/release).Path -PassThru
          Start-Sleep 5
          $proc.Refresh()
          if($proc.HasExited){throw "smoke test exit $($proc.ExitCode)"}
          Stop-Process $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Process MacroWatchdog -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          # Verify the published runtime contains both popup monitors/templates.
          $pubNormal=(Resolve-Path stage/release/dungeon/config/scenario.json).Path
          $pubAbyss=(Resolve-Path stage/release/abyss/config/scenario.json).Path
          $pn=Get-Content -Raw $pubNormal | ConvertFrom-Json
          $pa=Get-Content -Raw $pubAbyss | ConvertFrom-Json
          if(-not(@($pn.Monitors | Where-Object { $_.Target-eq'potion_popup_close' -and $_.Action-eq'escape' }).Count-eq1)){throw 'published normal ESC monitor missing'}
          if(-not(@($pa.Monitors | Where-Object { $_.Target-eq'abyss_popup_close' -and $_.Action-eq'escape' }).Count-eq1)){throw 'published Abyss ESC monitor missing'}
          if(-not(Test-Path stage/release/dungeon/templates/popup_close.png)){throw 'published normal popup template missing'}

          New-Item package/release,package/tools,package/FishingAutomation,out -ItemType Directory -Force | Out-Null
          Copy-Item stage/release/* package/release -Recurse -Force
          Copy-Item (Join-Path $root 'tools/ApplyUpdate.ps1') package/tools/ApplyUpdate.ps1 -Force
          Copy-Item (Join-Path $root 'START.cmd') package/START.cmd -Force
          Copy-Item (Join-Path $root 'REPAIR_AUTO_UPDATE.cmd') package/REPAIR_AUTO_UPDATE.cmd -Force

          'Compatibility directory for legacy updater notification restore.' | Set-Content package/FishingAutomation/.update_compat -Encoding ASCII
          'MABI AUTO V0.1.60 Windows Lite - potion ESC close + Abyss result multi-signal' | Set-Content package/WINDOWS_LITE.txt -Encoding UTF8

          $zip='out/MabiAuto_V0.1.60_Windows_Lite.zip'
          Compress-Archive package/* $zip -CompressionLevel Optimal

          Remove-Item verify -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip verify -Force
          foreach($required in @(
            'release/FishingAutomation.exe',
            'release/dungeon/config/scenario.json',
            'release/dungeon/config/targets.json',
            'release/dungeon/templates/popup_close.png',
            'release/abyss/config/scenario.json',
            'tools/ApplyUpdate.ps1',
            'START.cmd',
            'REPAIR_AUTO_UPDATE.cmd',
            'FishingAutomation/.update_compat'
          )){
            if(-not(Test-Path (Join-Path verify $required))){throw "ZIP required file missing: $required"}
          }
          if((Get-Item verify/release/FishingAutomation.exe).VersionInfo.FileVersion-ne'0.1.60.0'){throw 'ZIP EXE version mismatch'}

          $vn=Get-Content -Raw verify/release/dungeon/config/scenario.json | ConvertFrom-Json
          $va=Get-Content -Raw verify/release/abyss/config/scenario.json | ConvertFrom-Json
          if(-not(@($vn.Monitors | Where-Object { $_.Target-eq'potion_popup_close' -and $_.Action-eq'escape' }).Count-eq1)){throw 'ZIP normal ESC monitor missing'}
          if(-not(@($va.Monitors | Where-Object { $_.Target-eq'abyss_popup_close' -and $_.Action-eq'escape' }).Count-eq1)){throw 'ZIP Abyss ESC monitor missing'}

          $updaterBytes=[IO.File]::ReadAllBytes((Resolve-Path verify/tools/ApplyUpdate.ps1))
          if($updaterBytes.Length-lt3 -or $updaterBytes[0]-ne0xEF -or $updaterBytes[1]-ne0xBB -or $updaterBytes[2]-ne0xBF){
            throw 'updater UTF-8 BOM regression'
          }

          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MabiAuto_V0.1.60_Windows_Lite.zip" | Set-Content "$zip.sha256" -Encoding ASCII

          New-Item source-package -ItemType Directory -Force | Out-Null
          Copy-Item (Join-Path $root 'FishingAutomation') source-package/FishingAutomation -Recurse
          Copy-Item (Join-Path $root 'MacroWatchdog') source-package/MacroWatchdog -Recurse
          Copy-Item (Join-Path $root 'tools') source-package/tools -Recurse
          Copy-Item (Join-Path $root 'START.cmd') source-package/START.cmd -Force
          Copy-Item (Join-Path $root 'REPAIR_AUTO_UPDATE.cmd') source-package/REPAIR_AUTO_UPDATE.cmd -Force
          Copy-Item tests/abyss-offline source-package/tests/abyss-offline -Recurse
          Get-ChildItem source-package -Recurse -Directory | Where-Object { $_.Name -in @('bin','obj','debug') } | Remove-Item -Recurse -Force
          Copy-Item release-source/v0160_release_notes.md source-package/RELEASE_NOTES.md
          Compress-Archive source-package/* out/MabiAuto_V0.1.60_Source.zip -CompressionLevel Optimal

          Write-Host "V0160_PACKAGE_OK SHA256=$hash"

      - name: End-to-end auto-update V0.1.59 to V0.1.60
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item legacy -ItemType Directory -Force | Out-Null
          gh release download V0.1.59 --repo $env:GITHUB_REPOSITORY --pattern 'MabiAuto_V0.1.59_Windows_Lite.zip' --dir legacy
          if($LASTEXITCODE-ne0){throw 'V0.1.59 Windows Lite download failed'}
          Expand-Archive legacy/MabiAuto_V0.1.59_Windows_Lite.zip legacy/install -Force

          $install=(Resolve-Path legacy/install).Path
          $legacyExe=Join-Path $install 'release/FishingAutomation.exe'
          if((Get-Item $legacyExe).VersionInfo.FileVersion-ne'0.1.59.0'){throw 'legacy EXE is not 0.1.59.0'}

          $legacyUpdater=(Resolve-Path legacy/install/tools/ApplyUpdate.ps1).Path
          $releaseZip=(Resolve-Path out/MabiAuto_V0.1.60_Windows_Lite.zip).Path
          $testZip=Join-Path $env:TEMP 'MabiAuto_V0.1.60_Windows_Lite_E2E.zip'
          Copy-Item $releaseZip $testZip -Force

          $args=@('-NoProfile','-ExecutionPolicy','Bypass','-File',$legacyUpdater,'-ZipPath',$testZip,'-InstallRoot',$install,'-ProcessId','2147483000')
          $p=Start-Process powershell.exe -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(90000)){
            Stop-Process $p.Id -Force -ErrorAction SilentlyContinue
            if(Test-Path (Join-Path $install 'update.log')){Get-Content (Join-Path $install 'update.log')}
            throw 'V0.1.59 updater did not exit within 90 seconds'
          }
          if($p.ExitCode-ne0){
            if(Test-Path (Join-Path $install 'update.log')){Get-Content (Join-Path $install 'update.log')}
            throw "V0.1.59 updater failed exit=$($p.ExitCode)"
          }

          $newExe=Join-Path $install 'release/FishingAutomation.exe'
          if((Get-Item $newExe).VersionInfo.FileVersion-ne'0.1.60.0'){throw 'updated version is not 0.1.60.0'}
          if(-not(Test-Path (Join-Path $install 'release/dungeon/templates/popup_close.png'))){throw 'updated potion popup template missing'}

          $log=Get-Content -Raw (Join-Path $install 'update.log')
          if(-not $log.Contains('New version startup health check OK. Update committed.')){
            Get-Content (Join-Path $install 'update.log')
            throw 'V0.1.59 -> V0.1.60 health check did not commit'
          }

          Get-Process FishingAutomation -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process MacroWatchdog -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'V0160_AUTO_UPDATE_E2E_OK'

      - name: Publish V0.1.60
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $tag='V0.1.60'
          $target=(git rev-parse HEAD).Trim()

          gh release view $tag --repo $repo *> $null
          if($LASTEXITCODE-eq0){
            gh release delete $tag --repo $repo --yes --cleanup-tag
            if($LASTEXITCODE-ne0){throw 'existing V0.1.60 release cleanup failed'}
          } else {
            $null=$LASTEXITCODE
          }

          gh release create $tag --repo $repo --target $target --title 'Mabi Auto V0.1.60' --notes-file release-source/v0160_release_notes.md out/MabiAuto_V0.1.60_Windows_Lite.zip out/MabiAuto_V0.1.60_Windows_Lite.zip.sha256 out/MabiAuto_V0.1.60_Source.zip
          if($LASTEXITCODE-ne0){throw 'V0.1.60 release creation failed'}

          $release=gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if($release.draft -or $release.prerelease){throw 'V0.1.60 must be stable/public'}
          $names=@($release.assets | ForEach-Object {$_.name})
          foreach($required in @('MabiAuto_V0.1.60_Windows_Lite.zip','MabiAuto_V0.1.60_Windows_Lite.zip.sha256','MabiAuto_V0.1.60_Source.zip')){
            if($required -notin $names){throw "release asset missing: $required"}
          }
          Write-Host "V0160_RELEASE_OK $($release.html_url)"
