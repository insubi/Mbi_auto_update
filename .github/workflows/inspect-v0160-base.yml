name: Inspect V0.1.59 popup and result flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v0160-base.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Download V0.1.59 source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item source -ItemType Directory -Force | Out-Null
          gh release download V0.1.59 --repo $env:GITHUB_REPOSITORY --pattern 'MabiAuto_V0.1.59_Source.zip' --dir source
          Expand-Archive source/MabiAuto_V0.1.59_Source.zip source/current -Force
          $root=(Resolve-Path source/current).Path
          "SOURCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Inspect production path wiring
        shell: pwsh
        run: |
          $root=$env:SOURCE_ROOT
          Get-ChildItem (Join-Path $root 'FishingAutomation') -Recurse -File -Include *.cs |
            Select-String -Pattern 'dungeon_config|Path.Combine.*dungeon|baseDir|abyss.*config|dungeon.*config' -Context 5,12 |
            ForEach-Object { $_.Path; $_.Context.PreContext; $_.Line; $_.Context.PostContext; '---' }

          Write-Host '=== NORMAL SCENARIO ==='
          Get-Content -Raw (Join-Path $root 'FishingAutomation/dungeon/config/scenario.json')
          Write-Host '=== NORMAL TARGET POPUP CHECK ==='
          $normalTargets=Get-Content -Raw (Join-Path $root 'FishingAutomation/dungeon/config/targets.json')
          if($normalTargets -match 'popup_close|abyss_popup_close|물약|닫기'){ Write-Host $normalTargets } else { Write-Host 'NO_NORMAL_POPUP_TARGET' }

          Write-Host '=== LEGACY SCENARIO ==='
          Get-Content -Raw (Join-Path $root 'FishingAutomation/dungeon_config/scenario.json')
