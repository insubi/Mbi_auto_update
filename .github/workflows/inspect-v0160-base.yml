name: Inspect V0.1.59 popup and result flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v0160-base.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Download V0.1.59 source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item source -ItemType Directory -Force | Out-Null
          gh release download V0.1.59 --repo $env:GITHUB_REPOSITORY --pattern 'MabiAuto_V0.1.59_Source.zip' --dir source
          Expand-Archive source/MabiAuto_V0.1.59_Source.zip source/current -Force
          $root=(Resolve-Path source/current).Path
          "SOURCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Inspect popup and result code
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:SOURCE_ROOT
          Write-Host '=== FILES ==='
          Get-ChildItem (Join-Path $root 'FishingAutomation') -Recurse -File |
            Where-Object { $_.Name -match 'ScenarioEngine|TargetDetector|scenario.json|targets.json' } |
            ForEach-Object { Write-Host $_.FullName.Substring($root.Length+1) }

          Write-Host '=== POPUP/ESC SEARCH ==='
          Get-ChildItem (Join-Path $root 'FishingAutomation') -Recurse -File -Include *.cs,*.json |
            Select-String -Pattern 'abyss_popup_close|popup_close|회복 물약|물약|구매하기|닫기|TapScanCode\(0x01\)|ESC' -Context 5,12 |
            ForEach-Object { $_.ToString(); $_.Context.PreContext; $_.Line; $_.Context.PostContext; '---' }

          Write-Host '=== CHECK MONITORS ==='
          Get-ChildItem (Join-Path $root 'FishingAutomation') -Recurse -File -Filter '*.cs' |
            Select-String -Pattern 'CheckMonitorsAsync' -Context 20,120 |
            ForEach-Object { $_.Path; $_.Context.PreContext; $_.Line; $_.Context.PostContext; '---' }

          Write-Host '=== RESULT DETECTION ==='
          Get-ChildItem (Join-Path $root 'FishingAutomation/dungeon') -Recurse -File -Filter '*.cs' |
            Select-String -Pattern 'TryDetectAbyssResultButtonRow|DetectAbyssResultRetryAsync|RetryAbyssResultAsync|AbyssResult' -Context 25,100 |
            ForEach-Object { $_.Path; $_.Context.PreContext; $_.Line; $_.Context.PostContext; '---' }

          Write-Host '=== SCENARIOS ==='
          Get-ChildItem (Join-Path $root 'FishingAutomation') -Recurse -File -Filter 'scenario.json' |
            ForEach-Object { Write-Host ('--- ' + $_.FullName.Substring($root.Length+1)); Get-Content -Raw $_.FullName }

          Write-Host '=== TARGETS WITH POPUP/RESULT ==='
          Get-ChildItem (Join-Path $root 'FishingAutomation') -Recurse -File -Filter 'targets.json' |
            ForEach-Object {
              Write-Host ('--- ' + $_.FullName.Substring($root.Length+1))
              $txt=Get-Content -Raw $_.FullName
              if($txt -match 'popup|result|retry|닫기|물약'){ Write-Host $txt }
            }
