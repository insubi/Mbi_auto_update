name: Inspect V0.1.33 Retry Priority

on:
  push:
    branches:
      - v0133-result-retry-fix
    paths:
      - '.github/workflows/inspect-v0133-retry-priority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Print retry monitor and challenge loop
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri 'https://github.com/insubi/Mbi_auto_update/releases/download/V0.1.31/CombinedFishingDungeon_V0.1.31_PeacaAutoRoute.zip' -OutFile current.zip
          Expand-Archive current.zip -DestinationPath current
          $root=Get-ChildItem current -Directory | Select-Object -First 1
          if($null-eq$root){throw 'source root missing'}
          python release-source/v0132_ulla_fixed_click_final.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.32 patch failed'}
          $engine=Join-Path $root.FullName 'FishingAutomation/dungeon/ScenarioEngine.cs'
          $lines=Get-Content $engine

          foreach($needle in @('private async Task<bool> CheckMonitorsAsync','private async Task VerifyChallengeBeforeEntryAsync')){
            $hit=Select-String -Path $engine -Pattern $needle -SimpleMatch | Select-Object -First 1
            if($null-eq$hit){throw "not found: $needle"}
            $start=$hit.LineNumber
            $end=[Math]::Min($lines.Count,$start+190)
            Write-Host "==== $needle lines $start..$end ===="
            for($i=$start;$i-le$end;$i++){ Write-Host ("{0,5}: {1}" -f $i,$lines[$i-1]) }
          }

          $scenario=Get-Content -Raw (Join-Path $root.FullName 'FishingAutomation/dungeon/config/scenario.json')|ConvertFrom-Json
          Write-Host '==== retry monitor ===='
          @($scenario.Monitors|Where-Object {$_.Target-eq'retry'})|ConvertTo-Json -Depth 8|Write-Host
          $targets=Get-Content -Raw (Join-Path $root.FullName 'FishingAutomation/dungeon/config/targets.json')|ConvertFrom-Json
          Write-Host '==== retry target ===='
          @($targets|Where-Object {$_.Id-eq'retry'})|ConvertTo-Json -Depth 8|Write-Host
