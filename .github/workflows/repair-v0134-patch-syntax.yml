name: Repair V0.1.34 Patch Syntax

on:
  workflow_dispatch:
  push:
    branches: [v0134-runtime-error-upload]
    paths: ['.github/workflows/repair-v0134-patch-syntax.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0134-runtime-error-upload
          fetch-depth: 0
      - name: Fix malformed assertion string and push
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='release-source/v0134_runtime_error_upload.py'
          $text=Get-Content -Raw $p
          $bad='    ''"runtime-errors/",'
          $good='    ''"runtime-errors/'','
          if(-not $text.Contains($bad)){throw 'expected malformed runtime-errors marker not found'}
          $text=$text.Replace($bad,$good)
          Set-Content -Path $p -Value $text -Encoding utf8NoBOM
          python -m py_compile $p
          if($LASTEXITCODE-ne0){throw 'patch still has Python syntax errors'}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $p
          git commit -m 'Fix V0.1.34 runtime upload patch syntax'
          git push origin HEAD:v0134-runtime-error-upload
