name: Build V0.1.32 Ula Fixed Click Final

on:
  workflow_dispatch:
  push:
    branches:
      - v0132-ulla-fixed-click-final
    paths:
      - '.github/workflows/build-v0132-ulla-fixed-click-final.yml'
      - 'release-source/v0132_ulla_fixed_click_final.py'

permissions:
  contents: write

env:
  RELEASE_TAG: V0.1.32

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Patch validate build and package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri 'https://github.com/insubi/Mbi_auto_update/releases/download/V0.1.31/CombinedFishingDungeon_V0.1.31_PeacaAutoRoute.zip' -OutFile current.zip
          Expand-Archive current.zip -DestinationPath current
          $root=Get-ChildItem current -Directory | Select-Object -First 1
          if($null-eq$root){throw 'source root missing'}
          $fish=Join-Path $root.FullName 'FishingAutomation'

          python release-source/v0132_ulla_fixed_click_final.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.32 patch failed'}

          $engine=Get-Content -Raw (Join-Path $fish 'dungeon/ScenarioEngine.cs')
          $input=Get-Content -Raw (Join-Path $fish 'dungeon/InputController.cs')
          $main=Get-Content -Raw (Join-Path $fish 'MainForm.cs')
          $refui=Get-Content -Raw (Join-Path $fish 'MainForm.ReferenceUI.cs')

          foreach($required in @(
            'var ullaBreadcrumbPoint = new Point(82, 66);',
            'M 입력 후 화면변화=',
            '울라 대륙 클릭 후 화면변화=',
            '화면 변화 거의 없음 2회 연속 -> 좌상단 끝 도달 확정',
            '좌상단 기준 지그재그 탐색 시작',
            '페카 심층 1-1',
            '페카 심층 2-1',
            'peaca_d1_1',
            'peaca_d2_1',
            '기존 던전 매크로 초입 확인 완료'
          )){
            if(-not (($engine+$main+$refui).Contains($required))){throw "required marker missing: $required"}
          }
          foreach($forbidden in @('peaca_d2_2','route_d2_2','route_enter_d2_2','페카 심층 2-2')){
            if(($engine+$main+$refui).Contains($forbidden)){throw "forbidden D2-2 residue: $forbidden"}
          }
          if($engine.Contains('DetectAsync("route_ulla_continent", first')){throw 'old Ula OCR hard gate remains'}
          if($engine.Contains('ulla.Center')){throw 'old OCR-center Ula click remains'}
          if(-not $input.Contains('DragClientPoint')){throw 'Interception drag support missing'}

          $targets=Get-Content -Raw (Join-Path $fish 'dungeon/config/targets.json')|ConvertFrom-Json
          foreach($id in @('route_peaca_map','route_peaca_popup_title','route_go_here','route_peaca_title','route_deep_tab','route_d1_1','route_d2_1','route_enter_d1_1','route_enter_d2_1','retry','scene_skip','selected','challenge','enter_bottom')){
            if(@($targets|Where-Object {$_.Id-eq$id}).Count-ne1){throw "target missing/duplicate: $id"}
          }
          foreach($id in @('route_d2_2','route_enter_d2_2','policy_shutdown','policy_error88')){
            if(@($targets|Where-Object {$_.Id-eq$id}).Count-ne0){throw "forbidden target returned: $id"}
          }
          $d21=@($targets|Where-Object {$_.Id-eq'route_d2_1'})[0]
          $enterD21=@($targets|Where-Object {$_.Id-eq'route_enter_d2_1'})[0]
          if($d21.Text-ne'D2-1'){throw "D2-1 OCR text incorrect: $($d21.Text)"}
          if($enterD21.Text -notmatch '2층 1구역'){throw "D2-1 entry OCR text incorrect: $($enterD21.Text)"}

          foreach($forbidden in @('DUNGEON_POLICY_SHUTDOWN_DETECTED','ThrowIfDungeonPolicyShutdownAsync')){
            if($engine.Contains($forbidden)){throw "removed policy detection returned: $forbidden"}
          }
          foreach($marker in @('DUNGEON_FULL_STABILITY_HARDENING_V7','동일 단계 복구','같은 복구 단계가','scene_skip 1/2 확인','scene_skip 2/2 연속 확인','DUNGEON_SCREEN_FIRST_RECOVERY_V6','DUNGEON_CHALLENGE_DISAMBIGUATION_V5','던전 밖 HUD 3/4 이상 확인','어비스 클릭 검증 실패')){
            if(-not $engine.Contains($marker)){throw "preserved engine marker missing: $marker"}
          }

          $retry=@($targets|Where-Object {$_.Id-eq'retry'})[0]
          if($retry.Kind-ne'hybrid' -or $retry.Text-ne'다시 하기' -or $retry.TemplatePath-ne'templates/retry_visual_v0129.jpg'){throw 'retry behavior changed unexpectedly'}
          $retryTemplate=Join-Path $fish 'dungeon/templates/retry_visual_v0129.jpg'
          $retryHash=(Get-FileHash $retryTemplate -Algorithm SHA256).Hash.ToLowerInvariant()
          if($retryHash-ne'0089b636041b76b4eabd269b7c50b82d045ef11f66368797947b7f72adea59aa'){throw "retry template changed: $retryHash"}

          $scenario=Get-Content -Raw (Join-Path $fish 'dungeon/config/scenario.json')|ConvertFrom-Json
          $sceneMon=@($scenario.Monitors|Where-Object {$_.Target-eq'scene_skip'})
          if($sceneMon.Count-ne1){throw 'scene_skip monitor missing/duplicate'}
          if([int]$sceneMon[0].CooldownMs-ne2500 -or [int]$sceneMon[0].ScanIntervalMs-ne1200){throw 'scene_skip timing changed'}

          $expected=@{
            'compass.png'='af26e115ad824262ec890e51bb072b74098278d7cdbc40c6f1e7381fb3c467c3';
            'gauge.png'='22d78ea16f21db75ff11cb7a576e3275204f051a4214f8791c9605d975a317f8';
            'healthbar.png'='b79c90379ff0558ab19f77ac28a5e2dd64928f3d0ec46b1ce3fc5906a7956373';
            'hook.png'='e584e44185e15edbb75c8505ea5002edcaf3c0e2e770d8f6417ba4ff4fde8949'
          }
          foreach($t in $expected.Keys){
            $h=(Get-FileHash (Join-Path $fish "templates/$t") -Algorithm SHA256).Hash.ToLowerInvariant()
            if($h-ne$expected[$t]){throw "fishing template changed: $t $h"}
          }

          dotnet restore (Join-Path $fish 'FishingAutomation.csproj')
          if($LASTEXITCODE-ne0){throw 'FishingAutomation restore failed'}
          dotnet build (Join-Path $fish 'FishingAutomation.csproj') -c Release --no-restore
          if($LASTEXITCODE-ne0){throw 'FishingAutomation build failed'}

          $watchProj=Join-Path $root.FullName 'MacroWatchdog/MacroWatchdog.csproj'
          if(Test-Path $watchProj){
            dotnet restore $watchProj
            if($LASTEXITCODE-ne0){throw 'MacroWatchdog restore failed'}
            dotnet build $watchProj -c Release --no-restore
            if($LASTEXITCODE-ne0){throw 'MacroWatchdog build failed'}
          }

          New-Item -ItemType Directory -Path stage,stage/release,out | Out-Null
          $pubArgs=@('-c','Release','-r','win-x64','--self-contained','true','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true','-p:EnableCompressionInSingleFile=true','-p:PublishTrimmed=false','-p:PublishAot=false','-p:DebugType=None','-p:DebugSymbols=false')
          dotnet publish (Join-Path $fish 'FishingAutomation.csproj') @pubArgs -o stage/release
          if($LASTEXITCODE-ne0){throw 'FishingAutomation publish failed'}
          if(Test-Path $watchProj){
            dotnet publish $watchProj @pubArgs -o stage/watchdog
            if($LASTEXITCODE-ne0){throw 'Watchdog publish failed'}
            if(Test-Path 'stage/watchdog/MacroWatchdog.exe'){Copy-Item 'stage/watchdog/MacroWatchdog.exe' 'stage/release/MacroWatchdog.exe' -Force}
          }

          $release=(Resolve-Path 'stage/release').Path
          $runtimeTargets=Get-Content -Raw (Join-Path $release 'dungeon/config/targets.json')|ConvertFrom-Json
          foreach($id in @('route_peaca_map','route_go_here','route_deep_tab','route_d1_1','route_d2_1','route_enter_d1_1','route_enter_d2_1')){
            if(@($runtimeTargets|Where-Object {$_.Id-eq$id}).Count-ne1){throw "runtime route target missing: $id"}
          }
          foreach($t in $expected.Keys){
            $h=(Get-FileHash (Join-Path $release "templates/$t") -Algorithm SHA256).Hash.ToLowerInvariant()
            if($h-ne$expected[$t]){throw "runtime fishing template changed: $t $h"}
          }
          if(-not(Test-Path (Join-Path $release 'dungeon/templates/retry_visual_v0129.jpg'))){throw 'runtime retry template missing'}

          $exe=Join-Path $release 'FishingAutomation.exe'
          $p=Start-Process $exe -WorkingDirectory $release -PassThru
          Start-Sleep 5
          $p.Refresh()
          if($p.HasExited){throw "smoke test exit $($p.ExitCode)"}
          Stop-Process $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process MacroWatchdog -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'SMOKE_TEST_OK'

          $lite=(Resolve-Path out).Path+'\MabiAuto_V0.1.32_Windows_Lite.zip'
          Compress-Archive -Path (Join-Path $release '*') -DestinationPath $lite -CompressionLevel Optimal
          $hash=(Get-FileHash $lite -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MabiAuto_V0.1.32_Windows_Lite.zip"|Set-Content "$lite.sha256" -Encoding ASCII
          Write-Host "LITE_SHA256=$hash"
          Write-Host "LITE_SIZE=$((Get-Item $lite).Length)"

      - name: Preserve package artifact
        uses: actions/upload-artifact@v4
        with:
          name: MabiAuto_V0.1.32_Windows_Lite
          path: |
            out/MabiAuto_V0.1.32_Windows_Lite.zip
            out/MabiAuto_V0.1.32_Windows_Lite.zip.sha256
          retention-days: 7
          compression-level: 0

      - name: Publish V0.1.32 with retries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $tag=$env:RELEASE_TAG
          $headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          }

          # Clean up only stale V0.1.32 drafts/releases from earlier failed attempts.
          $existing=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPO/releases?per_page=100"
          foreach($r in @($existing|Where-Object {$_.tag_name -eq $tag})){
            Write-Host "Deleting stale release id=$($r.id) draft=$($r.draft)"
            Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$env:REPO/releases/$($r.id)"
          }
          gh api -X DELETE "repos/$env:REPO/git/refs/tags/$tag" 2>$null
          $null=$LASTEXITCODE

          @(
            'MABI AUTO V0.1.32 - 울라 대륙 OCR 오정지 수정',
            '',
            '지도는 정상적으로 열렸지만 좌측 상단 울라 대륙 글자를 OCR이 놓쳐 정지하던 문제를 수정했습니다.',
            'M으로 지도 전환을 확인한 뒤 OCR 대신 800x1000 클라이언트의 고정 위치 (82,66)를 클릭하고, 월드맵 전환도 화면 변화량으로 검증합니다.',
            '이후 좌상단 끝 정렬, 지그재그 페카 고분 OCR 탐색, 여기로 가기, 심층 1-1/2-1, 기존 던전 매크로 인계는 V0.1.31과 동일합니다.',
            '',
            '테스트 실행 파일: MabiAuto_V0.1.32_Windows_Lite.zip'
          )|Set-Content notes.txt -Encoding UTF8

          # Create a draft first so users never see a release without the runtime ZIP.
          gh release create $tag --repo $env:REPO --target $env:GITHUB_SHA --title 'Mabi Auto V0.1.32' --notes-file notes.txt --draft
          if($LASTEXITCODE-ne0){throw 'V0.1.32 draft creation failed'}

          $zipUploaded=$false
          for($attempt=1;$attempt-le6;$attempt++){
            Write-Host "ZIP upload attempt $attempt/6"
            gh release upload $tag out/MabiAuto_V0.1.32_Windows_Lite.zip --repo $env:REPO --clobber
            if($LASTEXITCODE-eq0){$zipUploaded=$true;break}
            Start-Sleep -Seconds (10*$attempt)
          }
          if(-not $zipUploaded){throw 'runtime ZIP upload failed after 6 attempts'}

          $shaUploaded=$false
          for($attempt=1;$attempt-le3;$attempt++){
            gh release upload $tag out/MabiAuto_V0.1.32_Windows_Lite.zip.sha256 --repo $env:REPO --clobber
            if($LASTEXITCODE-eq0){$shaUploaded=$true;break}
            Start-Sleep -Seconds 5
          }
          if(-not $shaUploaded){throw 'SHA256 asset upload failed'}

          gh release edit $tag --repo $env:REPO --draft=false --latest
          if($LASTEXITCODE-ne0){throw 'V0.1.32 publish failed'}
          gh release view $tag --repo $env:REPO --json url,tagName,isDraft,isPrerelease
