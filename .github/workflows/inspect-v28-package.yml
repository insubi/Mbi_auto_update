name: Inspect Original v28 Package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v28-package.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect original v28 package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/user-attachments/files/32151849/CombinedFishingDungeon_v28_PhoneAlert_Fixed.zip'
          Invoke-WebRequest -Uri $url -OutFile v28.zip
          New-Item -ItemType Directory -Path v28 | Out-Null
          Expand-Archive -LiteralPath v28.zip -DestinationPath v28
          $root = Get-ChildItem v28 -Directory | Select-Object -First 1
          if ($null -eq $root) { throw 'v28 package root not found' }
          Write-Host '===== TOP LEVEL ====='
          Get-ChildItem $root.FullName -Force | Select-Object Name,Length | Format-Table -AutoSize
          Write-Host '===== PROJECT / UPDATE FILES ====='
          Get-ChildItem $root.FullName -Recurse -File | Where-Object {
            $_.Name -match 'Update|FishingAutomation\.csproj|FishingBot\.cs|Program\.cs|START\.cmd|\.exe$'
          } | Select-Object FullName,Length | Format-Table -AutoSize
          foreach ($rel in @('START.cmd','FishingAutomation/FishingAutomation.csproj','MacroWatchdog/MacroWatchdog.csproj')) {
            $p = Join-Path $root.FullName $rel
            if (Test-Path -LiteralPath $p) {
              Write-Host "===== $rel ====="
              Get-Content -LiteralPath $p
            }
          }
          $updaters = @(Get-ChildItem $root.FullName -Recurse -File -Filter UpdateManager.cs)
          Write-Host "UPDATE_MANAGER_COUNT=$($updaters.Count)"
