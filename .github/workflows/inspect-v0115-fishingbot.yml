name: Inspect V0.1.15 FishingBot

on:
  push:
    paths:
      - '.github/workflows/inspect-v0115-fishingbot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Download V0.1.15 source and print fishing control flow
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri 'https://github.com/insubi/Mbi_auto_update/releases/download/V0.1.15/CombinedFishingDungeon_V0.1.15_LowScoreCompassRecovery.zip' -OutFile current.zip
          Expand-Archive current.zip -DestinationPath current
          $bot=Get-ChildItem current -Recurse -Filter FishingBot.cs | Select-Object -First 1
          if($null -eq $bot){throw 'FishingBot.cs missing'}
          $lines=Get-Content -LiteralPath $bot.FullName
          Write-Host "FISHINGBOT=$($bot.FullName) LINES=$($lines.Count)"
          $patterns=@('RunAsync','WaitReady','WaitRoundReturn','readyWait','compassRecoveryFrames','TapSpace','TapS')
          $hits=New-Object System.Collections.Generic.HashSet[int]
          for($i=0;$i -lt $lines.Count;$i++){
            foreach($p in $patterns){if($lines[$i].Contains($p)){[void]$hits.Add($i)}}
          }
          $ranges=@()
          foreach($h in ($hits | Sort-Object)){
            $start=[Math]::Max(0,$h-25);$end=[Math]::Min($lines.Count-1,$h+90)
            $ranges += ,@($start,$end)
          }
          $merged=@()
          foreach($r in $ranges | Sort-Object {$_[0]}){
            if($merged.Count -eq 0 -or $r[0] -gt ($merged[-1][1]+1)){$merged += ,@($r[0],$r[1])}
            elseif($r[1] -gt $merged[-1][1]){$merged[-1][1]=$r[1]}
          }
          foreach($r in $merged){
            Write-Host "===== LINES $($r[0]+1)-$($r[1]+1) ====="
            for($i=$r[0];$i -le $r[1];$i++){Write-Host ('{0:D4}: {1}' -f ($i+1),$lines[$i])}
          }
