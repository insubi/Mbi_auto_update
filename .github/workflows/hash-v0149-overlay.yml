name: Hash V0.1.49 Overlay
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hash-v0149-overlay.yml'
permissions:
  contents: write
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0149-mode-separation
      - name: Hash overlay
        shell: bash
        run: |
          set -euo pipefail
          : > hashes.txt
          while IFS= read -r -d '' f; do
            rel="${f#release-source/v0149-overlay/}"
            h=$(sha256sum "$f" | awk '{print $1}')
            printf '%s=%s\n' "$rel" "$h" >> hashes.txt
          done < <(find release-source/v0149-overlay -type f -print0 | sort -z)
          cat hashes.txt
      - name: Save hashes to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          api="repos/$repo/contents/workflow-status/v0149_overlay_hashes.txt"
          encoded=$(base64 -w0 hashes.txt)
          existing=$(gh api "$api?ref=main" 2>/dev/null || true)
          if [ -n "$existing" ]; then
            sha=$(printf '%s' "$existing" | jq -r .sha)
            gh api -X PUT "$api" -f message='Update V0.1.49 overlay hashes' -f content="$encoded" -f branch=main -f sha="$sha" >/dev/null
          else
            gh api -X PUT "$api" -f message='Record V0.1.49 overlay hashes' -f content="$encoded" -f branch=main >/dev/null
          fi
