name: Inspect V0.1.49 Abyss Images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v0149-abyss-images.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Compare release image contents
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item old,new -ItemType Directory -Force | Out-Null
          gh release download V0.1.48 --repo $env:GITHUB_REPOSITORY --pattern 'MabiAuto_V0.1.48_Windows_Lite.zip' --dir old
          gh release download V0.1.49 --repo $env:GITHUB_REPOSITORY --pattern 'MabiAuto_V0.1.49_Windows_Lite.zip' --dir new
          Expand-Archive old/MabiAuto_V0.1.48_Windows_Lite.zip old/ex -Force
          Expand-Archive new/MabiAuto_V0.1.49_Windows_Lite.zip new/ex -Force
          Write-Host '=== V0.1.48 abyss preview/template files ==='
          Get-ChildItem old/ex -Recurse -File | Where-Object { $_.FullName -match '\\abyss\\(previews|templates)\\' } | ForEach-Object { $_.FullName.Substring((Resolve-Path old/ex).Path.Length+1) } | Sort-Object
          Write-Host '=== V0.1.49 abyss preview/template files ==='
          Get-ChildItem new/ex -Recurse -File | Where-Object { $_.FullName -match '\\abyss\\(previews|templates)\\' } | ForEach-Object { $_.FullName.Substring((Resolve-Path new/ex).Path.Length+1) } | Sort-Object
          Write-Host '=== V0.1.48 preview count ==='
          (Get-ChildItem old/ex -Recurse -File | Where-Object { $_.FullName -match '\\abyss\\previews\\' }).Count
          Write-Host '=== V0.1.49 preview count ==='
          (Get-ChildItem new/ex -Recurse -File | Where-Object { $_.FullName -match '\\abyss\\previews\\' }).Count
