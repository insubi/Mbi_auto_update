name: Release V0.1.41 All Template Path Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0141-template-paths.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0141-template-path-fix

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build validate and package V0.1.41
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'

          Invoke-WebRequest -Uri 'https://github.com/insubi/Mbi_auto_update/releases/download/V0.1.31/CombinedFishingDungeon_V0.1.31_PeacaAutoRoute.zip' -OutFile current.zip
          Expand-Archive current.zip -DestinationPath current -Force
          $root=Get-ChildItem current -Directory | Select-Object -First 1
          if($null-eq$root){throw 'source root missing'}
          $fish=Join-Path $root.FullName 'FishingAutomation'
          $dungeon=Join-Path $fish 'dungeon'

          python release-source/v0132_ulla_fixed_click_final.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.32 patch failed'}
          python release-source/v0133_result_retry_fastpath.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.33 patch failed'}
          python release-source/v0134_runtime_error_upload.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.34 patch failed'}
          python release-source/v0135_visual_test_environment.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.35 patch failed'}
          python release-source/v0136_worldmap_ocr_fix.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.36 patch failed'}
          python release-source/v0137_dungeon_icon_runda_fiod.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.37 patch failed'}
          python release-source/v0137_updater_survival.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.37 updater survival patch failed'}
          python release-source/v0138_arrival_timeout_5min.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.38 patch failed'}
          python release-source/v0139_slot_template_fix.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.39 patch failed'}
          python release-source/v0140_slot_hybrid_fix.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.40 patch failed'}
          python release-source/v0141_template_path_fix.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.41 patch failed'}

          $project=Get-Content -Raw (Join-Path $fish 'FishingAutomation.csproj')
          $engine=Get-Content -Raw (Join-Path $dungeon 'ScenarioEngine.cs')
          $matcher=Get-Content -Raw (Join-Path $dungeon 'TemplateMatcher.cs')
          $detector=Get-Content -Raw (Join-Path $dungeon 'TargetDetector.cs')
          $targets=Get-Content -Raw (Join-Path $dungeon 'config/targets.json') | ConvertFrom-Json

          if(-not $project.Contains('<Version>0.1.41</Version>')){throw 'project version is not 0.1.41'}
          if(-not $engine.Contains('WaitForDungeonSlotAsync(slotTarget, 30, ct)')){throw 'V0.1.40 slot wait lost'}
          if(-not $engine.Contains('WaitForTargetPairAsync(arrivalTarget, "route_deep_tab", 300, ct)')){throw 'Peaca five-minute arrival wait lost'}
          if(-not $engine.Contains('WaitForTargetAsync(arrivalTarget, 300, ct)')){throw 'Runda/Fiod five-minute arrival wait lost'}
          if(-not $matcher.Contains('FindBrightGlyphMultiScale')){throw 'V0.1.40 glyph matcher lost'}
          if(-not $detector.Contains('던전 템플릿 파일을 찾을 수 없습니다')){throw 'all-template startup preflight missing'}

          $templated=@($targets|Where-Object{ -not [string]::IsNullOrWhiteSpace($_.TemplatePath) })
          if($templated.Count-ne10){throw "expected 10 template targets, found $($templated.Count)"}
          foreach($t in $templated){
            if($t.TemplatePath.StartsWith('dungeon/templates/')){throw "duplicate dungeon prefix remains: $($t.Id) -> $($t.TemplatePath)"}
            $resolved=Join-Path $dungeon ($t.TemplatePath -replace '/', [IO.Path]::DirectorySeparatorChar)
            $exists=Test-Path $resolved
            Write-Host ("TEMPLATE_OK target={0} path={1} exists={2}" -f $t.Id,$t.TemplatePath,$exists)
            if(-not $exists){throw "unresolved template: $($t.Id) -> $resolved"}
          }

          $slotExpected=@{
            'route_d1_1'='templates/slot_peaca_d1_1_v0139.jpg'
            'route_d2_1'='templates/slot_peaca_d2_1_v0139.jpg'
            'route_regular_1_1'='templates/slot_regular_1_1_v0139.jpg'
            'route_regular_2_1'='templates/slot_regular_2_1_v0139.jpg'
          }
          foreach($id in $slotExpected.Keys){
            $t=@($targets|Where-Object{$_.Id-eq$id})[0]
            if($null-eq$t){throw "slot target missing: $id"}
            if($t.TemplatePath-ne$slotExpected[$id]){throw "$id path mismatch: $($t.TemplatePath)"}
            if($t.Kind-ne'slot-hybrid'){throw "$id kind mismatch"}
          }

          dotnet restore (Join-Path $fish 'FishingAutomation.csproj')
          if($LASTEXITCODE-ne0){throw 'FishingAutomation restore failed'}
          dotnet build (Join-Path $fish 'FishingAutomation.csproj') -c Release --no-restore
          if($LASTEXITCODE-ne0){throw 'FishingAutomation build failed'}

          $watchProj=Join-Path $root.FullName 'MacroWatchdog/MacroWatchdog.csproj'
          if(Test-Path $watchProj){
            dotnet restore $watchProj
            if($LASTEXITCODE-ne0){throw 'MacroWatchdog restore failed'}
            dotnet build $watchProj -c Release --no-restore
            if($LASTEXITCODE-ne0){throw 'MacroWatchdog build failed'}
          }

          New-Item -ItemType Directory -Path stage,stage/release,package,package/release,package/tools,out -Force | Out-Null
          $pubArgs=@('-c','Release','-r','win-x64','--self-contained','true','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true','-p:EnableCompressionInSingleFile=true','-p:PublishTrimmed=false','-p:PublishAot=false','-p:DebugType=None','-p:DebugSymbols=false')
          dotnet publish (Join-Path $fish 'FishingAutomation.csproj') @pubArgs -o stage/release
          if($LASTEXITCODE-ne0){throw 'FishingAutomation publish failed'}

          if(Test-Path $watchProj){
            dotnet publish $watchProj @pubArgs -o stage/watchdog
            if($LASTEXITCODE-ne0){throw 'MacroWatchdog publish failed'}
            if(Test-Path 'stage/watchdog/MacroWatchdog.exe'){
              Copy-Item 'stage/watchdog/MacroWatchdog.exe' 'stage/release/MacroWatchdog.exe' -Force
            }
          }

          $exe=(Resolve-Path 'stage/release/FishingAutomation.exe').Path
          $p=Start-Process $exe -WorkingDirectory (Resolve-Path 'stage/release').Path -PassThru
          Start-Sleep 5
          $p.Refresh()
          if($p.HasExited){throw "smoke test exit $($p.ExitCode)"}
          Stop-Process $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process MacroWatchdog -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'SMOKE_TEST_OK'

          Copy-Item 'stage/release/*' 'package/release' -Recurse -Force
          Copy-Item (Join-Path $root.FullName 'tools/ApplyUpdate.ps1') 'package/tools/ApplyUpdate.ps1' -Force
          @(
            'MABI AUTO V0.1.41 Windows Lite',
            'Updater-compatible package.',
            'All 10 dungeon template paths validated relative to release/dungeon.'
          ) | Set-Content 'package/WINDOWS_LITE.txt' -Encoding UTF8

          foreach($required in @(
            'package/release/FishingAutomation.exe',
            'package/release/dungeon/config/targets.json',
            'package/release/dungeon/templates/challenge_visual.png',
            'package/release/dungeon/templates/selected_red_visual.png',
            'package/release/dungeon/templates/retry_visual_v0129.jpg',
            'package/release/dungeon/templates/scene_skip_phone.jpg',
            'package/release/dungeon/templates/slot_peaca_d1_1_v0139.jpg',
            'package/release/dungeon/templates/slot_peaca_d2_1_v0139.jpg',
            'package/release/dungeon/templates/slot_regular_1_1_v0139.jpg',
            'package/release/dungeon/templates/slot_regular_2_1_v0139.jpg',
            'package/tools/ApplyUpdate.ps1',
            'package/WINDOWS_LITE.txt'
          )){
            if(-not(Test-Path $required)){throw "package missing: $required"}
          }

          $zip=(Resolve-Path out).Path+'\MabiAuto_V0.1.41_Windows_Lite.zip'
          Compress-Archive -Path 'package/*' -DestinationPath $zip -CompressionLevel Optimal

          Remove-Item verify -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath verify -Force
          $verifyDungeon=(Resolve-Path 'verify/release/dungeon').Path
          $verifyTargets=Get-Content -Raw 'verify/release/dungeon/config/targets.json' | ConvertFrom-Json
          $verifyTemplated=@($verifyTargets|Where-Object{ -not [string]::IsNullOrWhiteSpace($_.TemplatePath) })
          if($verifyTemplated.Count-ne10){throw "archive expected 10 template targets, found $($verifyTemplated.Count)"}
          foreach($t in $verifyTemplated){
            $resolved=Join-Path $verifyDungeon ($t.TemplatePath -replace '/', [IO.Path]::DirectorySeparatorChar)
            if(-not(Test-Path $resolved)){throw "archive unresolved template: $($t.Id) -> $resolved"}
          }
          if(-not(Test-Path 'verify/tools/ApplyUpdate.ps1')){throw 'archive missing updater'}

          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MabiAuto_V0.1.41_Windows_Lite.zip" | Set-Content "$zip.sha256" -Encoding ASCII
          $size=(Get-Item $zip).Length
          Write-Host 'ALL_10_TEMPLATE_PATHS_OK'
          Write-Host 'UPDATER_LAYOUT_OK'
          Write-Host "V0141_SHA256=$hash"
          Write-Host "V0141_SIZE=$size"
          if($size-gt180000000){throw "V0.1.41 ZIP unexpectedly large: $size"}

      - name: Publish V0.1.41
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='V0.1.41'
          $target=(git rev-parse HEAD).Trim()

          @(
            'MABI AUTO V0.1.41 - 던전 템플릿 경로 전체 수정',
            '',
            '던전 템플릿 타깃 10개를 전수 검사했습니다.',
            '기존 6개 템플릿 경로는 정상이며, V0.1.39에서 추가된 페카 1-1/2-1 및 룬다/피오드 1-1/2-1 총 4개 경로의 중복 dungeon 접두사를 수정했습니다.',
            '모든 던전 템플릿은 release/dungeon 기준 templates/... 상대경로로 검증합니다.',
            '던전 시작 시 설정된 모든 TemplatePath를 선검사하며, 파일이 없으면 target ID와 실제 찾으려던 경로를 즉시 오류로 표시합니다.',
            'TemplateMatcher도 파일 누락을 score=0.000으로 숨기지 않고 즉시 파일 경로 오류를 냅니다.',
            'V0.1.40 다중 배율 글자 매칭/OCR 백업, 도착 대기 5분, 구역 대기 30초, 보라색 아이콘 클릭은 유지됩니다.',
            '자동복구 기능은 이번 버전에 추가하지 않았습니다.'
          ) | Set-Content notes.txt -Encoding UTF8

          gh release view $tag --repo $env:REPO *> $null
          if($LASTEXITCODE-eq0){
            gh release delete $tag --repo $env:REPO --yes --cleanup-tag
            if($LASTEXITCODE-ne0){throw 'old V0.1.41 cleanup failed'}
          }
          $null=$LASTEXITCODE

          gh release create $tag --repo $env:REPO --target $target --title 'Mabi Auto V0.1.41' --notes-file notes.txt out/MabiAuto_V0.1.41_Windows_Lite.zip out/MabiAuto_V0.1.41_Windows_Lite.zip.sha256
          if($LASTEXITCODE-ne0){throw 'V0.1.41 release publish failed'}

          $release=gh api "repos/$env:REPO/releases/tags/$tag" | ConvertFrom-Json
          $zip=@($release.assets|Where-Object{$_.name-eq'MabiAuto_V0.1.41_Windows_Lite.zip'})[0]
          $sha=@($release.assets|Where-Object{$_.name-eq'MabiAuto_V0.1.41_Windows_Lite.zip.sha256'})[0]
          if($null-eq$zip -or $null-eq$sha){throw 'V0.1.41 release assets incomplete'}
          Write-Host "RELEASE_URL=$($release.html_url)"
          Write-Host "RELEASE_DIGEST=$($zip.digest)"
          Write-Host "RELEASE_SIZE=$($zip.size)"
          Write-Host 'V0141_RELEASE_OK'
