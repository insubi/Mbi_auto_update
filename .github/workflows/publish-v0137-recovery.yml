name: Publish V0.1.37 recovery release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0137-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Download validated V0.1.37 artifact and build V0.1.36 repair
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path artifact,repair,repair/tools,out,verify | Out-Null

          gh run download 35294858780 --repo $env:REPO --name MabiAuto_V0.1.37_Windows_Lite --dir artifact
          if($LASTEXITCODE-ne0){throw 'download validated V0.1.37 artifact failed'}

          $zip='artifact/MabiAuto_V0.1.37_Windows_Lite.zip'
          $sha='artifact/MabiAuto_V0.1.37_Windows_Lite.zip.sha256'
          if(-not(Test-Path $zip)){throw 'V0.1.37 zip missing from artifact'}
          if(-not(Test-Path $sha)){throw 'V0.1.37 sha missing from artifact'}

          Expand-Archive -LiteralPath $zip -DestinationPath verify -Force
          if(-not(Test-Path 'verify/release/FishingAutomation.exe')){throw 'validated zip missing release/FishingAutomation.exe'}
          if(-not(Test-Path 'verify/tools/ApplyUpdate.ps1')){throw 'validated zip missing tools/ApplyUpdate.ps1'}
          if(-not(Test-Path 'verify/WINDOWS_LITE.txt')){throw 'validated zip missing root marker'}

          $expected=((Get-Content -Raw $sha).Split(' ',[System.StringSplitOptions]::RemoveEmptyEntries)[0]).Trim().ToLowerInvariant()
          $actual=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($expected-ne$actual){throw "artifact hash mismatch expected=$expected actual=$actual"}

          Copy-Item 'verify/tools/ApplyUpdate.ps1' 'repair/tools/ApplyUpdate.ps1' -Force
          @(
            'MABI AUTO V0.1.36 updater repair',
            '',
            'V0.1.36 패키징 오류로 tools/ApplyUpdate.ps1이 삭제된 설치본을 복구합니다.',
            '1) MABI AUTO를 완전히 종료합니다.',
            '2) 이 ZIP의 내용(tools 폴더 포함)을 기존 MABI AUTO 폴더, 즉 START.cmd가 있는 폴더에 그대로 풉니다.',
            '3) MABI AUTO를 다시 실행하고 업데이트 버튼을 눌러 V0.1.37로 업데이트합니다.',
            '4) V0.1.37부터는 updater 파일이 다음 업데이트에도 유지됩니다.'
          ) | Set-Content 'repair/README_UPDATER_REPAIR.txt' -Encoding UTF8
          @(
            '@echo off',
            'cd /d "%~dp0"',
            'if not exist START.cmd (echo [ERROR] START.cmd가 있는 기존 MABI AUTO 폴더에 ZIP 내용을 풀어주세요.& pause & exit /b 1)',
            'if not exist tools\ApplyUpdate.ps1 (echo [ERROR] tools\ApplyUpdate.ps1이 없습니다.& pause & exit /b 1)',
            'echo updater 복구 확인 완료.',
            'start "" START.cmd'
          ) | Set-Content 'repair/REPAIR_CHECK_AND_START.cmd' -Encoding ASCII

          $repairZip=(Resolve-Path out).Path+'\MabiAuto_V0.1.36_UpdaterRepair.zip'
          Compress-Archive -Path 'repair/*' -DestinationPath $repairZip -CompressionLevel Optimal
          if((Get-Item $repairZip).Length-lt1000){throw 'repair zip unexpectedly small'}

          Copy-Item $zip 'out/MabiAuto_V0.1.37_Windows_Lite.zip' -Force
          Copy-Item $sha 'out/MabiAuto_V0.1.37_Windows_Lite.zip.sha256' -Force

          Write-Host "V0137_SHA256=$actual"
          Write-Host "V0137_SIZE=$((Get-Item $zip).Length)"
          Write-Host "REPAIR_SIZE=$((Get-Item $repairZip).Length)"

      - name: Publish or repair V0.1.37 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='V0.1.37'
          $target='7c3141f249a57e0783236579e8a532c0b4424f67'
          $assets=@(
            'out/MabiAuto_V0.1.37_Windows_Lite.zip',
            'out/MabiAuto_V0.1.37_Windows_Lite.zip.sha256',
            'out/MabiAuto_V0.1.36_UpdaterRepair.zip'
          )

          @(
            'MABI AUTO V0.1.37 - 던전 아이콘 클릭 + 룬다/피오드 1-1·2-1',
            '',
            '인식 테스트 메뉴 글자 잘림 수정.',
            '월드맵 던전 이름은 OCR 기준점으로만 사용하고 실제 클릭은 글씨 위 던전 아이콘에만 수행.',
            '룬다/피오드 1-1, 2-1 추가 및 정확한 진입 문구 확인 후 Space.',
            '업데이트 패키지에 tools/ApplyUpdate.ps1을 포함하여 다음 업데이트에서도 updater가 유지됨.',
            'V0.1.36에서 updater가 삭제된 사용자는 MabiAuto_V0.1.36_UpdaterRepair.zip을 기존 START.cmd 폴더에 한 번만 풀면 됨.'
          ) | Set-Content notes.txt -Encoding UTF8

          gh release view $tag --repo $env:REPO *> $null
          if($LASTEXITCODE-eq0){
            gh release upload $tag @assets --repo $env:REPO --clobber
            if($LASTEXITCODE-ne0){throw 'release asset upload failed'}
            gh release edit $tag --repo $env:REPO --title 'Mabi Auto V0.1.37' --notes-file notes.txt
            if($LASTEXITCODE-ne0){throw 'release edit failed'}
          }else{
            gh release create $tag @assets --repo $env:REPO --target $target --title 'Mabi Auto V0.1.37' --notes-file notes.txt
            if($LASTEXITCODE-ne0){throw 'release create failed'}
          }

          $release=gh api "repos/$env:REPO/releases/tags/$tag" | ConvertFrom-Json
          $names=@($release.assets|ForEach-Object{$_.name})
          foreach($required in @('MabiAuto_V0.1.37_Windows_Lite.zip','MabiAuto_V0.1.37_Windows_Lite.zip.sha256','MabiAuto_V0.1.36_UpdaterRepair.zip')){
            if($required-notin$names){throw "published asset missing: $required"}
          }
          $main=@($release.assets|Where-Object{$_.name-eq'MabiAuto_V0.1.37_Windows_Lite.zip'})[0]
          if([int64]$main.size-lt1000000){throw 'published main zip too small'}
          Write-Host "V0137_RELEASE_OK"
          Write-Host "RELEASE_URL=$($release.html_url)"
          Write-Host "RELEASE_SIZE=$($main.size)"
