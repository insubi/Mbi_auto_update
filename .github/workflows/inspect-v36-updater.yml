name: Inspect v36 updater

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v36-updater.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download v36 source and print updater files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir work
          cd work
          gh release download v36 --repo "$REPO" --pattern 'CombinedFishingDungeon_v36_StabilityRemote.zip'
          unzip -q CombinedFishingDungeon_v36_StabilityRemote.zip
          echo '===== UpdateManager.cs ====='
          U="$(find . -name UpdateManager.cs -type f | head -n1)"
          cat "$U"
          echo '===== ApplyUpdate.ps1 ====='
          P="$(find . -name ApplyUpdate.ps1 -type f | head -n1)"
          cat "$P"
