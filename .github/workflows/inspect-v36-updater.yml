name: Inspect v36 updater

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v36-updater.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download v36 source and print update call sites
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir work
          cd work
          gh release download v36 --repo "$REPO" --pattern 'CombinedFishingDungeon_v36_StabilityRemote.zip'
          unzip -q CombinedFishingDungeon_v36_StabilityRemote.zip
          echo '===== LaunchUpdater call sites ====='
          grep -R -n -B 35 -A 35 --include='*.cs' 'LaunchUpdater' . || true
          echo '===== update button / CheckLatest call sites ====='
          grep -R -n -B 25 -A 50 --include='*.cs' -E 'CheckLatestAsync|DownloadAsync|업데이트' . | head -n 700 || true
