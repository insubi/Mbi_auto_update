name: Inspect V0.1.28 Monitor Notify

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-v0128-monitor-notify.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Download source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri 'https://github.com/insubi/Mbi_auto_update/releases/download/V0.1.28/CombinedFishingDungeon_V0.1.28_ScreenFirstRecovery.zip' -OutFile current.zip
          Expand-Archive current.zip -DestinationPath current
          $root=Get-ChildItem current -Directory | Select-Object -First 1
          if($null-eq$root){throw 'source root missing'}
          $fish=Join-Path $root.FullName 'FishingAutomation'
          Write-Host '=== CHECK MONITORS ==='
          Get-Content (Join-Path $fish 'dungeon/ScenarioEngine.cs') | Select-String -Pattern 'CheckMonitorsAsync' -Context 5,55 | ForEach-Object {$_.ToString()}
          Write-Host '=== MAINFORM ENGINE RUN/CATCH ==='
          Get-Content (Join-Path $fish 'MainForm.cs') | Select-String -Pattern 'RunAsync|Telegram|Notify|Exception|자동복구|오류' -Context 5,12 | ForEach-Object {$_.ToString()}
          Write-Host '=== TELEGRAM REFERENCES ==='
          Get-ChildItem $fish -Recurse -Filter *.cs | Select-String -Pattern 'Telegram|SendMessage|Notify|알림' -Context 2,6 | ForEach-Object {$_.ToString()}
