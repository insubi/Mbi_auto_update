name: Inspect V0.1.30 Peaca Focused

on:
  push:
    branches: [v0131-peaca-map-navigation]
    paths: ['.github/workflows/inspect-v0130-peaca-focused.yml']

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Focused source inspection
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri 'https://github.com/insubi/Mbi_auto_update/releases/download/V0.1.30/CombinedFishingDungeon_V0.1.30_NoPolicyDetection.zip' -OutFile current.zip
          Expand-Archive current.zip -DestinationPath current
          $root=Get-ChildItem current -Directory | Select-Object -First 1
          $fish=Join-Path $root.FullName 'FishingAutomation'

          function Show-Matches($glob,$pattern,$before=4,$after=10){
            Get-ChildItem $fish -Recurse -Filter $glob | Select-String -Pattern $pattern -Context $before,$after | ForEach-Object {
              Write-Host ('###FILE ' + $_.Path.Substring($fish.Length+1) + ':' + $_.LineNumber)
              $_.Context.PreContext | ForEach-Object { Write-Host $_ }
              Write-Host $_.Line
              $_.Context.PostContext | ForEach-Object { Write-Host $_ }
              Write-Host '###END'
            }
          }

          Write-Host '=== UI DUNGEON SELECT ==='
          Show-Matches '*.cs' 'dungeonPicker|선택 던전|SelectedItem|SelectedDungeon' 5 12

          Write-Host '=== DUNGEON START/ENGINE CREATE ==='
          Show-Matches 'MainForm*.cs' 'ScenarioEngine|RunAsync|StartDungeon|dungeon' 5 12

          Write-Host '=== ENGINE SIGNATURES ==='
          $eng=Join-Path $fish 'dungeon/ScenarioEngine.cs'
          Select-String -Path $eng -Pattern 'public ScenarioEngine|public async Task|CaptureGameWindowAsync|DetectAsync\(|Click|TapScanCode|Drag' -Context 3,7 | ForEach-Object {
            Write-Host ('###ENGINE:' + $_.LineNumber); $_.Context.PreContext; $_.Line; $_.Context.PostContext; Write-Host '###END'
          }

          Write-Host '=== INPUT METHODS ==='
          Show-Matches '*.cs' 'class .*Input|TapScanCode|MouseDown|MouseUp|Move.*Mouse|Click.*Mouse|Drag|TapMouse|LeftClick|MoveTo' 4 10

          Write-Host '=== DETECTOR TYPES ==='
          Show-Matches '*.cs' 'class .*Detect|record .*Detect|Found.*Score|ReadText|MatchRect|Bounds|Center|Point' 3 8

          Write-Host '=== REFERENCE SCALE / WINDOW ==='
          Show-Matches '*.cs' '800|1000|ClientToScreen|Reference|ScaleX|ScaleY|GetClientRect' 3 8
