name: Inspect v28 vs V0.1.10 Fishing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v28-v0110-fishing.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and compare fishing sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/user-attachments/files/32151849/CombinedFishingDungeon_v28_PhoneAlert_Fixed.zip' -OutFile v28.zip
          Invoke-WebRequest -Uri 'https://github.com/insubi/Mbi_auto_update/releases/download/V0.1.10/CombinedFishingDungeon_V0.1.10_StabilityRemote.zip' -OutFile cur.zip
          Expand-Archive v28.zip -DestinationPath v28
          Expand-Archive cur.zip -DestinationPath cur
          $v28root = Get-ChildItem v28 -Directory | Select-Object -First 1
          $curroot = Get-ChildItem cur -Directory | Select-Object -First 1
          Write-Host "V28ROOT=$($v28root.FullName)"
          Write-Host "CURROOT=$($curroot.FullName)"
          foreach ($name in @('FishingBot.cs','TemplateMatcher.cs','CaptureService.cs','WindowLocator.cs','Config.cs','config.json')) {
            Write-Host "===== $name ====="
            $a = Get-ChildItem $v28root.FullName -Recurse -File -Filter $name | Select-Object -First 1
            $b = Get-ChildItem $curroot.FullName -Recurse -File -Filter $name | Select-Object -First 1
            Write-Host "v28=$($a.FullName)"
            Write-Host "cur=$($b.FullName)"
            if ($a -and $b -and $name -match '\.cs$') {
              Write-Host '-- v28 signatures --'
              Select-String -Path $a.FullName -Pattern 'class |public FishingBot|WaitReadyAndCast|WaitFor|MatchHook|MatchCompass|DetectGauge|Press|Send|compass|hookThreshold' | Select-Object -First 120 | ForEach-Object { $_.Line }
              Write-Host '-- current signatures --'
              Select-String -Path $b.FullName -Pattern 'class |public FishingBot|WaitReadyAndCast|WaitFor|MatchHook|MatchCompass|DetectGauge|Press|Send|compass|hookThreshold|HUD' | Select-Object -First 180 | ForEach-Object { $_.Line }
            }
          }
          Write-Host '===== TEMPLATE HASHES ====='
          foreach ($t in @('hook.png','compass.png','gauge.png','healthbar.png')) {
            $a = Get-ChildItem $v28root.FullName -Recurse -File -Filter $t | Select-Object -First 1
            $b = Get-ChildItem $curroot.FullName -Recurse -File -Filter $t | Select-Object -First 1
            if ($a) { Write-Host "v28 $t $((Get-FileHash $a.FullName -Algorithm SHA256).Hash.ToLower()) $($a.Length)" }
            if ($b) { Write-Host "cur $t $((Get-FileHash $b.FullName -Algorithm SHA256).Hash.ToLower()) $($b.Length)" }
          }
