name: Inspect v41 UI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v41-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v41 source and inspect UI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v41ui && mkdir -p /tmp/v41ui
          gh release download v41 --repo "$REPO" --pattern 'CombinedFishingDungeon_v41_StabilityRemote.zip' --dir /tmp/v41ui
          unzip -q /tmp/v41ui/CombinedFishingDungeon_v41_StabilityRemote.zip -d /tmp/v41ui/src
          ROOT="$(find /tmp/v41ui/src -mindepth 1 -maxdepth 1 -type d | head -n1)"
          A="$ROOT/FishingAutomation/abyss"
          echo '=== ABYSS CONFIG FILES ==='
          find "$A/config" -maxdepth 1 -type f -print | sort
          echo '=== TARGETS JSON ==='
          cat "$A/config/targets.json"
          echo '=== SCENARIO / MONITOR JSON ==='
          for f in "$A/config"/*.json; do echo "--- $f"; cat "$f"; done
          echo '=== SCENARIO ENGINE ==='
          find "$ROOT" -name 'ScenarioEngine.cs' -print -exec sed -n '1,320p' {} \;
          echo '=== TARGET DETECTOR ==='
          find "$ROOT" -name 'TargetDetector.cs' -print -exec sed -n '1,360p' {} \;
