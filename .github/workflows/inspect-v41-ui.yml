name: Inspect v46 baseline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v41-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect v46 source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v46 && mkdir -p /tmp/v46
          gh release download v46 --repo "$REPO" --pattern 'CombinedFishingDungeon_v46_StabilityRemote.zip' --dir /tmp/v46
          unzip -q /tmp/v46/CombinedFishingDungeon_v46_StabilityRemote.zip -d /tmp/v46/src
          ROOT="$(find /tmp/v46/src -mindepth 1 -maxdepth 1 -type d | head -n1)"
          echo '=== FILE LIST ==='
          find "$ROOT" -maxdepth 3 -type f | sort
          echo '=== MAINFORM HEAD/UPDATE ==='
          sed -n '1,220p' "$ROOT/FishingAutomation/MainForm.cs"
          grep -n -A 120 -B 20 -E 'CheckForUpdates|UpdateManager|Watchdog|Shown \+=' "$ROOT/FishingAutomation/MainForm.cs" || true
          echo '=== DASHBOARD ==='
          cat "$ROOT/FishingAutomation/MainForm.Dashboard.cs"
          echo '=== UPDATE MANAGER ==='
          cat "$ROOT/FishingAutomation/UpdateManager.cs" || true
          echo '=== WATCHDOG CLIENT ==='
          cat "$ROOT/FishingAutomation/WatchdogClient.cs" || true
          echo '=== ABYSS TARGETS/MONITORS ==='
          cat "$ROOT/FishingAutomation/abyss/config/targets.json"
          cat "$ROOT/FishingAutomation/abyss/config/scenario.json"
