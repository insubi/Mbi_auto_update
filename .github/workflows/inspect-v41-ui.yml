name: Inspect v41 UI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v41-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v42 source and inspect exit state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v42ui && mkdir -p /tmp/v42ui
          gh release download v42 --repo "$REPO" --pattern 'CombinedFishingDungeon_v42_StabilityRemote.zip' --dir /tmp/v42ui
          unzip -q /tmp/v42ui/CombinedFishingDungeon_v42_StabilityRemote.zip -d /tmp/v42ui/src
          ROOT="$(find /tmp/v42ui/src -mindepth 1 -maxdepth 1 -type d | head -n1)"
          echo '=== EXIT STATUS ==='
          grep -RIn -C 8 --include='*.cs' -E '퇴장|나가기|상태|Status' "$ROOT/FishingAutomation" | head -n 800 || true
