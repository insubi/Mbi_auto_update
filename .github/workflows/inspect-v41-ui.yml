name: Inspect v37 updater
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v41-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect v37 updater
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v37inspect && mkdir -p /tmp/v37inspect
          gh release download v37 --repo "$REPO" --pattern 'CombinedFishingDungeon_v37_StabilityRemote.zip' --dir /tmp/v37inspect
          unzip -q /tmp/v37inspect/CombinedFishingDungeon_v37_StabilityRemote.zip -d /tmp/v37inspect/src
          ROOT="$(find /tmp/v37inspect/src -mindepth 1 -maxdepth 1 -type d | head -n1)"
          echo '=== UPDATE MANAGER ==='
          cat "$ROOT/FishingAutomation/UpdateManager.cs" || true
          echo '=== APPLY UPDATE ==='
          cat "$ROOT/tools/ApplyUpdate.ps1" || true
          echo '=== UPDATE REFS IN MAINFORM ==='
          grep -n -A 35 -B 20 -E 'CheckForUpdatesAsync|ApplyUpdate|MarkStartupHealthy|Shown \+=' "$ROOT/FishingAutomation/MainForm.cs" || true
