name: Inspect v37 updater UI methods
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v41-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect updater UI methods
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v37inspect && mkdir -p /tmp/v37inspect
          gh release download v37 --repo "$REPO" --pattern 'CombinedFishingDungeon_v37_StabilityRemote.zip' --dir /tmp/v37inspect
          unzip -q /tmp/v37inspect/CombinedFishingDungeon_v37_StabilityRemote.zip -d /tmp/v37inspect/src
          ROOT="$(find /tmp/v37inspect/src -mindepth 1 -maxdepth 1 -type d | head -n1)"
          FILE="$ROOT/FishingAutomation/MainForm.cs"
          line=$(grep -n 'private async Task CheckForUpdatesAsync' "$FILE" | head -n1 | cut -d: -f1 || true)
          echo "check method line=$line"
          if [ -n "$line" ]; then start=$((line-20)); end=$((line+180)); sed -n "${start},${end}p" "$FILE"; fi
