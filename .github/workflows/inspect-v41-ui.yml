name: Verify v28 attachment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v41-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify v28 attachment
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/user-attachments/files/32151849/CombinedFishingDungeon_v28_PhoneAlert_Fixed.zip'
          curl -L --fail --retry 3 "$URL" -o /tmp/v28.zip
          ls -lh /tmp/v28.zip
          sha256sum /tmp/v28.zip
          unzip -t /tmp/v28.zip >/dev/null
          echo V28_ATTACHMENT_OK
