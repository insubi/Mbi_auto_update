name: Inspect v46 dashboard source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v41-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect dashboard source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v46inspect
          mkdir -p /tmp/v46inspect
          gh release download v46 --repo "$REPO" --pattern 'CombinedFishingDungeon_v46_StabilityRemote.zip' --dir /tmp/v46inspect
          unzip -q /tmp/v46inspect/CombinedFishingDungeon_v46_StabilityRemote.zip -d /tmp/v46inspect/src
          ROOT="$(find /tmp/v46inspect/src -mindepth 1 -maxdepth 1 -type d | head -n1)"
          echo '=== DASHBOARD SOURCE ==='
          nl -ba "$ROOT/FishingAutomation/MainForm.Dashboard.cs"
          echo '=== MAINFORM SOURCE ==='
          nl -ba "$ROOT/FishingAutomation/MainForm.cs" | sed -n '1,260p'
