name: Inspect v43 detector semantics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v41-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect detector and target model
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v43inspect && mkdir -p /tmp/v43inspect
          gh release download v43 --repo "$REPO" --pattern 'CombinedFishingDungeon_v43_StabilityRemote.zip' --dir /tmp/v43inspect
          unzip -q /tmp/v43inspect/CombinedFishingDungeon_v43_StabilityRemote.zip -d /tmp/v43inspect/src
          ROOT="$(find /tmp/v43inspect/src -mindepth 1 -maxdepth 1 -type d | head -n1)"
          echo '=== TARGET DETECTOR ==='
          nl -ba "$ROOT/FishingAutomation/Dungeon/TargetDetector.cs" | sed -n '1,180p'
          echo '=== TARGET MODEL ==='
          grep -RIn -A 45 -B 5 --include='Models.cs' -E 'class TargetDefinition|record TargetDefinition' "$ROOT/FishingAutomation/Dungeon" || true
