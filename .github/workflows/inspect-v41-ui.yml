name: Inspect v41 UI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v41-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v41 source and inspect UI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v41ui && mkdir -p /tmp/v41ui
          gh release download v41 --repo "$REPO" --pattern 'CombinedFishingDungeon_v41_StabilityRemote.zip' --dir /tmp/v41ui
          unzip -q /tmp/v41ui/CombinedFishingDungeon_v41_StabilityRemote.zip -d /tmp/v41ui/src
          ROOT="$(find /tmp/v41ui/src -mindepth 1 -maxdepth 1 -type d | head -n1)"
          D="$ROOT/FishingAutomation/MainForm.Dashboard.cs"
          M="$ROOT/FishingAutomation/MainForm.cs"
          echo '=== DASHBOARD 1-180 ==='
          nl -ba "$D" | sed -n '1,180p'
          echo '=== DASHBOARD 180-390 ==='
          nl -ba "$D" | sed -n '180,390p'
          echo '=== DASHBOARD 390-540 ==='
          nl -ba "$D" | sed -n '390,540p'
          echo '=== MAINFORM 1-220 ==='
          nl -ba "$M" | sed -n '1,220p'
