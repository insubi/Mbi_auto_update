name: Inspect v47 dashboard dependencies
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v41-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect v47 dashboard dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v47 && mkdir -p /tmp/v47
          gh release download v47 --repo "$REPO" --pattern 'CombinedFishingDungeon_v47_StabilityRemote.zip' --dir /tmp/v47
          unzip -q /tmp/v47/CombinedFishingDungeon_v47_StabilityRemote.zip -d /tmp/v47/src
          ROOT="$(find /tmp/v47/src -mindepth 1 -maxdepth 1 -type d | head -n1)"
          APP="$ROOT/FishingAutomation"
          echo '=== DASHBOARD SOURCE ==='
          nl -ba "$APP/MainForm.Dashboard.cs"
          echo '=== REFERENCES OUTSIDE DASHBOARD ==='
          grep -RIn --include='*.cs' --exclude='MainForm.Dashboard.cs' -E '_readyBadge|_failureValue|_averageValue|_startTimeValue|_telegramQuickValue|_updateStatusValue|_currentDungeonValue|_sysGameValue|_sysTemplateValue|_sysOcrValue|_sysInputValue|_sysWatchdogValue|_sysTelegramValue|_sysUpdateValue|_stageTime|_timeoutValue|_miniStatus|_miniInfo|_logToggle|_dungeonPicker|_dungeonGallery|_dashboard|BuildLayout|UpdateDashboard|TrackProgress|ToggleMini|ApplyLogVisibility' "$APP" || true
          echo '=== MAINFORM CORE ==='
          sed -n '1,760p' "$APP/MainForm.cs"
          echo '=== UPDATE ==='
          cat "$APP/MainForm.Update.cs"
          echo '=== DIAGNOSTICS ==='
          cat "$APP/MainForm.Diagnostics.cs"
