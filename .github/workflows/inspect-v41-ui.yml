name: Inspect v46 dashboard dependencies
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v41-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect v46 dashboard dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v46 && mkdir -p /tmp/v46
          gh release download v46 --repo "$REPO" --pattern 'CombinedFishingDungeon_v46_StabilityRemote.zip' --dir /tmp/v46
          unzip -q /tmp/v46/CombinedFishingDungeon_v46_StabilityRemote.zip -d /tmp/v46/src
          ROOT="$(find /tmp/v46/src -mindepth 1 -maxdepth 1 -type d | head -n1)"
          APP="$ROOT/FishingAutomation"
          echo '=== FIELD REFERENCES OUTSIDE DASHBOARD ==='
          grep -RIn --include='*.cs' --exclude='MainForm.Dashboard.cs' -E '_readyBadge|_failureValue|_averageValue|_startTimeValue|_telegramQuickValue|_updateStatusValue|_currentDungeonValue|_sysGameValue|_sysTemplateValue|_sysOcrValue|_sysInputValue|_sysTelegramValue|_sysUpdateValue|_stageTime|_timeoutValue|_miniStatus|_miniInfo|_logToggle|_dungeonPicker|_dashboard' "$APP" || true
          echo '=== UPDATE ==='
          cat "$APP/MainForm.Update.cs"
          echo '=== DIAGNOSTICS ==='
          cat "$APP/MainForm.Diagnostics.cs"
          echo '=== MAINFORM TAIL ==='
          sed -n '220,760p' "$APP/MainForm.cs"
