name: Inspect v41 UI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v41-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v41 source and inspect UI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v41ui && mkdir -p /tmp/v41ui
          gh release download v41 --repo "$REPO" --pattern 'CombinedFishingDungeon_v41_StabilityRemote.zip' --dir /tmp/v41ui
          unzip -q /tmp/v41ui/CombinedFishingDungeon_v41_StabilityRemote.zip -d /tmp/v41ui/src
          ROOT="$(find /tmp/v41ui/src -mindepth 1 -maxdepth 1 -type d | head -n1)"
          S="$ROOT/FishingAutomation/Dungeon/ScenarioEngine.cs"
          M="$ROOT/FishingAutomation/Dungeon/Models.cs"
          echo '=== SCENARIO ENGINE 190-520 ==='
          nl -ba "$S" | sed -n '190,520p'
          echo '=== MODEL FILES ==='
          grep -RIn -C 6 --include='*.cs' -E 'class Monitor|record Monitor|ScenarioMonitor|ScanIntervalMs|TargetDefinition|Roi' "$ROOT/FishingAutomation/Dungeon" | head -n 400 || true
