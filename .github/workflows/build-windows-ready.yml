name: Build Windows Lite

on:
  workflow_run:
    workflows: ['Publish Release Source']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Draft bridge release to build'
        required: true
        default: 'v76'

permissions:
  contents: write

concurrency:
  group: windows-lite-release
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Select v76 bridge source, build V0.1.3 and verify package
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = gh api "repos/$env:REPO/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Release lookup failed' }
          if ($env:SOURCE_SHA) {
            $matches = @($releases | Where-Object { $_.target_commitish -eq $env:SOURCE_SHA -and $_.tag_name -eq 'v76' })
            if ($matches.Count -ne 1) { throw 'Expected exactly one v76 bridge release for the source workflow commit' }
            $tag = $matches[0].tag_name
          } else { $tag = $env:REQUESTED_TAG }
          if ($tag -ne 'v76') { throw 'This bridge packaging pipeline currently requires v76' }
          $selected = @($releases | Where-Object { $_.tag_name -eq $tag })
          if ($selected.Count -ne 1) { throw 'Expected exactly one matching bridge release' }
          $release = $selected[0]
          if (-not $release.draft) { throw 'Refusing to replace an already published bridge release' }
          $assets = @($release.assets | Where-Object { $_.name -eq 'CombinedFishingDungeon_v76_StabilityRemote.zip' })
          if ($assets.Count -ne 1) { throw 'Expected exactly one v76 source ZIP' }
          New-Item -ItemType Directory -Path source-download,source-work | Out-Null
          gh release download $tag --repo $env:REPO --pattern $assets[0].name --dir source-download
          if ($LASTEXITCODE -ne 0) { throw 'Source download failed' }
          tar -xf (Join-Path source-download $assets[0].name) -C source-work
          if ($LASTEXITCODE -ne 0) { throw 'Source extraction failed' }
          ./release-source/v76-package.ps1 -SourceRoot source-work/CombinedFishingDungeon_v76 -OutputRoot build-output
          ./release-source/v58-test-update.ps1 -SourceRoot source-work/CombinedFishingDungeon_v76 -PackageRoot build-output/MabiAuto_v76 -WorkRoot update-test
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Keep V0.1.3 verification reports
        uses: actions/upload-artifact@v4
        with:
          name: V0.1.3-stability-verification
          path: |
            source-work/CombinedFishingDungeon_v76/V0_1_3_FISHING_AUDIT.json
            build-output/v76-package-inventory.json
            update-test/verification.txt
          if-no-files-found: error

      - name: Publish bridge v76 and public V0.1.3 release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Legacy integer-tag bridge for users still on the pre-semantic updater line.
          gh release upload $env:RELEASE_TAG build-output/MabiAuto_v76_Windows_Lite.zip build-output/MabiAuto_v76_Windows_Lite.zip.sha256 --repo $env:REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Bridge package upload failed; release remains draft' }
          gh release edit $env:RELEASE_TAG --repo $env:REPO --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Bridge release publication failed' }

          # Public semantic patch release for V0.1.x users.
          $publicSourceRoot = 'build-output/CombinedFishingDungeon_V0.1.3'
          $publicPackageRoot = 'build-output/MabiAuto_V0.1.3'
          Copy-Item -LiteralPath 'source-work/CombinedFishingDungeon_v76' -Destination $publicSourceRoot -Recurse
          Copy-Item -LiteralPath 'build-output/MabiAuto_v76' -Destination $publicPackageRoot -Recurse

          # Keep the public source package source-only. Build/debug by-products are not useful to users.
          Get-ChildItem -LiteralPath $publicSourceRoot -Recurse -Directory -Force | Where-Object {
            $_.Name -in @('bin','obj','.vs','debug')
          } | Sort-Object FullName -Descending | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $publicSourceRoot -Recurse -File -Force | Where-Object {
            $_.Extension -in @('.pdb','.user','.suo') -or $_.Name -match '^timeout_.*\.png$|^recovery_.*\.png$'
          } | Remove-Item -Force -ErrorAction SilentlyContinue

          $publicSourceZip = 'build-output/CombinedFishingDungeon_V0.1.3_StabilityRemote.zip'
          $publicPackageZip = 'build-output/MabiAuto_V0.1.3_Windows_Lite.zip'
          Compress-Archive -LiteralPath $publicSourceRoot -DestinationPath $publicSourceZip -CompressionLevel Optimal
          Compress-Archive -LiteralPath $publicPackageRoot -DestinationPath $publicPackageZip -CompressionLevel Optimal
          $publicHash = (Get-FileHash -LiteralPath $publicPackageZip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$publicHash  MabiAuto_V0.1.3_Windows_Lite.zip" | Set-Content -LiteralPath "$publicPackageZip.sha256" -Encoding ASCII

          $notes = 'build-output/V0.1.3-release-notes.txt'
          @'
          MABI AUTO V0.1.3 - 낚시 시작 인식 복구

          V0.1.2 업데이트 뒤 현재 낚시 시작 아이콘을 인식하지 못해 60초 진행 정지 알림이 발생하던 문제를 수정했습니다.
          패키지의 구형 물/낚싯대 hook.png를 현재 원형 Space 낚시 아이콘으로 교체했습니다.
          START.cmd가 실행 때마다 이미 정상인 release/templates 파일을 구형 소스 템플릿으로 덮어쓰지 않도록 변경했습니다.
          기존 설정의 HookThreshold가 0.85여도 좁은 낚시 ROI 안에서 2프레임 연속 0.82 판정으로 안전하게 인식합니다.
          Interception Space 전송이 실패하면 성공 진행으로 기록하지 않고 다시 시도합니다.
          V0.1.2의 어비스 안정화, HOME UI, 텔레그램, 관리자 권한, 800x1000 창 배치 및 안전 정지 동작은 유지합니다.

          일반 사용자는 MabiAuto_V0.1.3_Windows_Lite.zip을 받으세요.
          '@ | Set-Content -LiteralPath $notes -Encoding UTF8

          if (gh release view 'V0.1.3' --repo $env:REPO *> $null) {
            throw 'Public V0.1.3 release already exists; refusing to overwrite a published stable version'
          }
          gh release create 'V0.1.3' $publicSourceZip $publicPackageZip "$publicPackageZip.sha256" --repo $env:REPO --target $env:SOURCE_SHA --title 'Mabi Auto V0.1.3' --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Public V0.1.3 release publication failed' }
