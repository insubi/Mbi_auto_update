name: Inspect V0.1.20 Dungeon Challenge

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-v0120-dungeon-challenge.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect V0.1.20 dungeon challenge flow
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri 'https://github.com/insubi/Mbi_auto_update/releases/download/V0.1.20/CombinedFishingDungeon_V0.1.20_AbyssOutsideHudQuorum.zip' -OutFile current.zip
          Expand-Archive current.zip -DestinationPath current
          $root=Get-ChildItem current -Directory | Select-Object -First 1
          if($null -eq $root){throw 'source root missing'}
          $fish=Join-Path $root.FullName 'FishingAutomation'
          New-Item -ItemType Directory -Force inspection | Out-Null
          Copy-Item (Join-Path $fish 'dungeon/config/scenario.json') inspection/v0120_dungeon_scenario.json.txt -Force
          Copy-Item (Join-Path $fish 'dungeon/config/targets.json') inspection/v0120_dungeon_targets.json.txt -Force
          Copy-Item (Join-Path $fish 'dungeon/ScenarioEngine.cs') inspection/v0120_dungeon_ScenarioEngine.cs.txt -Force
          Get-ChildItem (Join-Path $fish 'dungeon/templates') -File | ForEach-Object {
            $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$($_.Name)`t$($_.Length)`t$h"
          } | Set-Content inspection/v0120_dungeon_template_meta.txt -Encoding UTF8
      - name: Commit inspection
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection/v0120_dungeon_*
          git commit -m 'Inspect V0.1.20 dungeon challenge flow' || exit 0
          git push
