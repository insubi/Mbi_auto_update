name: Build V0.1.35 Visual Test Environment

on:
  workflow_dispatch:
  push:
    branches:
      - v0135-visual-test-env
    paths:
      - '.github/workflows/build-v0135-visual-test-env.yml'
      - 'release-source/v0135_visual_test_environment.py'
      - 'release-source/visual-test-assets/**'

permissions:
  contents: write

env:
  RELEASE_TAG: V0.1.35

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Patch validate build and package V0.1.35
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'

          Invoke-WebRequest -Uri 'https://github.com/insubi/Mbi_auto_update/releases/download/V0.1.31/CombinedFishingDungeon_V0.1.31_PeacaAutoRoute.zip' -OutFile current.zip
          Expand-Archive current.zip -DestinationPath current
          $root=Get-ChildItem current -Directory | Select-Object -First 1
          if($null-eq$root){throw 'source root missing'}
          $fish=Join-Path $root.FullName 'FishingAutomation'

          python release-source/v0132_ulla_fixed_click_final.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.32 patch failed'}
          python release-source/v0133_result_retry_fastpath.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.33 patch failed'}
          python release-source/v0134_runtime_error_upload.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.34 patch failed'}
          python release-source/v0135_visual_test_environment.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.35 patch failed'}

          $project=Get-Content -Raw (Join-Path $fish 'FishingAutomation.csproj')
          $tester=Get-Content -Raw (Join-Path $fish 'VisualRecognitionTester.cs')
          $ui=Get-Content -Raw (Join-Path $fish 'MainForm.VisualTest.cs')
          $uploader=Get-Content -Raw (Join-Path $fish 'RuntimeErrorUploader.cs')
          $refui=Get-Content -Raw (Join-Path $fish 'MainForm.ReferenceUI.cs')
          $engine=Get-Content -Raw (Join-Path $fish 'dungeon/ScenarioEngine.cs')

          foreach($required in @(
            '<Version>0.1.35</Version>',
            'VISUAL_TEST_ENV_V10',
            'VisualRecognitionTester',
            'AddButton("인식 테스트"',
            'UploadVisualTestRunAsync',
            'test-runs/',
            'source = "visual-test"',
            'gameInputSent = false',
            '룬다 던전이 보이는 기존 스크린샷이 아직 없어',
            'RUNTIME_ERROR_GITHUB_UPLOAD_V9',
            'DUNGEON_RESULT_RETRY_FASTPATH_V8',
            'var ullaBreadcrumbPoint = new Point(82, 66);',
            '페카 심층 1-1',
            '페카 심층 2-1'
          )){
            if(-not (($project+$tester+$ui+$uploader+$refui+$engine).Contains($required))){
              throw "required marker missing: $required"
            }
          }

          foreach($forbidden in @(
            'ClickClientPoint',
            'TapScanCode',
            'DragClientPoint',
            'FindRequiredGameWindow',
            'SetForegroundWindow'
          )){
            if($tester.Contains($forbidden)){throw "visual tester live-input/window regression: $forbidden"}
          }

          $assetDir=Join-Path $fish 'visual-tests/assets'
          foreach($name in @('peaca_label.jpg','fiod_label.jpg','peaca_popup_title.jpg','go_here.jpg','d1_slots.jpg','d2_slots.jpg','d2_enter.jpg','retry_candidate.jpg')){
            if(-not(Test-Path (Join-Path $assetDir $name))){throw "visual test asset missing: $name"}
          }

          dotnet restore (Join-Path $fish 'FishingAutomation.csproj')
          if($LASTEXITCODE-ne0){throw 'FishingAutomation restore failed'}
          dotnet build (Join-Path $fish 'FishingAutomation.csproj') -c Release --no-restore
          if($LASTEXITCODE-ne0){throw 'FishingAutomation build failed'}

          $watchProj=Join-Path $root.FullName 'MacroWatchdog/MacroWatchdog.csproj'
          if(Test-Path $watchProj){
            dotnet restore $watchProj
            if($LASTEXITCODE-ne0){throw 'MacroWatchdog restore failed'}
            dotnet build $watchProj -c Release --no-restore
            if($LASTEXITCODE-ne0){throw 'MacroWatchdog build failed'}
          }

          New-Item -ItemType Directory -Path stage,stage/release,package,package/release,out | Out-Null
          $pubArgs=@('-c','Release','-r','win-x64','--self-contained','true','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true','-p:EnableCompressionInSingleFile=true','-p:PublishTrimmed=false','-p:PublishAot=false','-p:DebugType=None','-p:DebugSymbols=false')
          dotnet publish (Join-Path $fish 'FishingAutomation.csproj') @pubArgs -o stage/release
          if($LASTEXITCODE-ne0){throw 'FishingAutomation publish failed'}

          if(Test-Path $watchProj){
            dotnet publish $watchProj @pubArgs -o stage/watchdog
            if($LASTEXITCODE-ne0){throw 'MacroWatchdog publish failed'}
            if(Test-Path 'stage/watchdog/MacroWatchdog.exe'){Copy-Item 'stage/watchdog/MacroWatchdog.exe' 'stage/release/MacroWatchdog.exe' -Force}
          }

          foreach($name in @('peaca_label.jpg','fiod_label.jpg','peaca_popup_title.jpg','go_here.jpg','d1_slots.jpg','d2_slots.jpg','d2_enter.jpg','retry_candidate.jpg')){
            if(-not(Test-Path (Join-Path 'stage/release/visual-tests/assets' $name))){
              throw "published visual test asset missing: $name"
            }
          }

          $exe=(Resolve-Path 'stage/release/FishingAutomation.exe').Path
          $p=Start-Process $exe -WorkingDirectory (Resolve-Path 'stage/release').Path -PassThru
          Start-Sleep 5
          $p.Refresh()
          if($p.HasExited){throw "smoke test exit $($p.ExitCode)"}
          Stop-Process $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process MacroWatchdog -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'SMOKE_TEST_OK'

          Copy-Item 'stage/release/*' 'package/release' -Recurse -Force

          $sourceTools=Join-Path $root.FullName 'tools'
          $applyScript=Join-Path $sourceTools 'ApplyUpdate.ps1'
          if(-not(Test-Path $applyScript)){throw 'source tools/ApplyUpdate.ps1 missing'}
          New-Item -ItemType Directory -Path 'package/tools' -Force | Out-Null
          Copy-Item $applyScript 'package/tools/ApplyUpdate.ps1' -Force

          @(
            'MABI AUTO V0.1.35 Windows Lite',
            'Updater-compatible root marker. Keep the release and tools folders.'
          ) | Set-Content 'package/WINDOWS_LITE.txt' -Encoding UTF8

          $zip=(Resolve-Path out).Path+'\MabiAuto_V0.1.35_Windows_Lite.zip'
          Compress-Archive -Path 'package/*' -DestinationPath $zip -CompressionLevel Optimal

          Remove-Item verify -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip -DestinationPath verify
          $children=@(Get-ChildItem verify -Force)
          $dirs=@($children|Where-Object{$_.PSIsContainer})
          if($children.Count-eq1 -and $dirs.Count-eq1){$sourceRoot=$dirs[0].FullName}else{$sourceRoot=(Resolve-Path verify).Path}
          if(-not(Test-Path (Join-Path $sourceRoot 'release/FishingAutomation.exe'))){
            throw 'updater simulation failed: release/FishingAutomation.exe missing'
          }
          if(-not(Test-Path (Join-Path $sourceRoot 'tools/ApplyUpdate.ps1'))){
            throw 'updater simulation failed: tools/ApplyUpdate.ps1 missing'
          }
          Write-Host "UPDATER_LAYOUT_OK children=$($children.Count) applyScript=OK"

          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MabiAuto_V0.1.35_Windows_Lite.zip"|Set-Content "$zip.sha256" -Encoding ASCII
          Write-Host "LITE_SHA256=$hash"
          Write-Host "LITE_SIZE=$((Get-Item $zip).Length)"

      - name: Preserve package artifact
        uses: actions/upload-artifact@v4
        with:
          name: MabiAuto_V0.1.35_Windows_Lite
          path: |
            out/MabiAuto_V0.1.35_Windows_Lite.zip
            out/MabiAuto_V0.1.35_Windows_Lite.zip.sha256
          retention-days: 7
          compression-level: 0

      - name: Publish V0.1.35
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $tag=$env:RELEASE_TAG

          gh release view $tag --repo $env:REPO *> $null
          if($LASTEXITCODE-eq0){gh release delete $tag --repo $env:REPO --yes --cleanup-tag}
          $null=$LASTEXITCODE

          @(
            'MABI AUTO V0.1.35 - 오프라인 OCR/OpenCV 인식 테스트',
            '',
            '왼쪽 메뉴에 인식 테스트를 추가했습니다.',
            '실제 게임에 키/마우스를 보내지 않고 저장된 이전 스크린샷으로 현재 Windows.Media.Ocr + OpenCV 검출 코드를 검사합니다.',
            '현재 테스트: 페카 월드맵, 피오드 월드맵, 페카 팝업, 여기로 가기, D1-1, D2-1, 2층 1구역 진입, 다시 하기.',
            '룬다는 보이는 스크린샷이 아직 없어 SKIP으로 표시합니다.',
            '테스트 실행 결과는 기존 에러 전송 설정이 켜져 있으면 같은 비공개 GitHub 저장소의 test-runs/ 아래로 summary.json + test.log를 전송합니다.',
            '실패 항목은 800x1000 합성 테스트 프레임도 failures/ 아래에 올립니다.',
            'V0.1.34 실전 에러 자동 전송 및 기존 던전/어비스/낚시 기능을 유지합니다.'
          )|Set-Content notes.txt -Encoding UTF8

          gh release create $tag --repo $env:REPO --target $env:GITHUB_SHA --title 'Mabi Auto V0.1.35' --notes-file notes.txt out/MabiAuto_V0.1.35_Windows_Lite.zip out/MabiAuto_V0.1.35_Windows_Lite.zip.sha256
          if($LASTEXITCODE-ne0){throw 'release publish failed'}

          $release=gh api "repos/$env:REPO/releases/tags/$tag" | ConvertFrom-Json
          $zip=@($release.assets|Where-Object{$_.name-eq'MabiAuto_V0.1.35_Windows_Lite.zip'})[0]
          if($null-eq$zip -or [int64]$zip.size-lt 1000000){throw 'published ZIP missing/small'}
          Write-Host "RELEASE_URL=$($release.html_url)"
          Write-Host "RELEASE_DIGEST=$($zip.digest)"
          Write-Host "RELEASE_ZIP_SIZE=$($zip.size)"
