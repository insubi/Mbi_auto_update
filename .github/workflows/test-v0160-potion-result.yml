name: Test V0.1.60 Potion ESC and Result Multi-Signal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-v0160-potion-result.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    steps:
      - name: Checkout V0.1.60 branch
        uses: actions/checkout@v4
        with:
          ref: v0160-potion-result-multisignal
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download V0.1.59 source and apply V0.1.60
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item source -ItemType Directory -Force | Out-Null
          gh release download V0.1.59 --repo $env:GITHUB_REPOSITORY --pattern 'MabiAuto_V0.1.59_Source.zip' --dir source
          if($LASTEXITCODE-ne0){throw 'V0.1.59 source download failed'}
          Expand-Archive source/MabiAuto_V0.1.59_Source.zip source/current -Force
          $root=(Resolve-Path source/current).Path

          $before=@{}
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $rel=$_.FullName.Substring($root.Length+1).Replace('\','/')
            $before[$rel]=(Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }

          python release-source/v0160_potion_result_multisignal.py $root
          if($LASTEXITCODE-ne0){throw 'V0.1.60 patch failed'}

          $after=@{}
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $rel=$_.FullName.Substring($root.Length+1).Replace('\','/')
            $after[$rel]=(Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }

          $allowed=@(
            'FishingAutomation/dungeon/ScenarioEngine.cs',
            'FishingAutomation/dungeon/ScenarioEngine.AbyssRetry.cs',
            'FishingAutomation/abyss/config/scenario.json',
            'FishingAutomation/dungeon/config/scenario.json',
            'FishingAutomation/dungeon/config/targets.json',
            'FishingAutomation/dungeon/templates/popup_close.png',
            'FishingAutomation/FishingAutomation.csproj',
            'FishingAutomation/UpdateManager.cs'
          )
          $mutated=@()
          foreach($rel in $after.Keys){
            if(-not $before.ContainsKey($rel) -or $before[$rel]-ne$after[$rel]){$mutated += $rel}
          }
          foreach($rel in $before.Keys){
            if(-not $after.ContainsKey($rel)){throw "V0.1.60 deleted file: $rel"}
          }
          foreach($rel in $mutated){
            if($rel -notin $allowed){throw "unexpected V0.1.60 mutation: $rel"}
          }
          foreach($required in @(
            'FishingAutomation/dungeon/ScenarioEngine.cs',
            'FishingAutomation/dungeon/ScenarioEngine.AbyssRetry.cs',
            'FishingAutomation/abyss/config/scenario.json',
            'FishingAutomation/dungeon/config/scenario.json',
            'FishingAutomation/dungeon/config/targets.json',
            'FishingAutomation/FishingAutomation.csproj',
            'FishingAutomation/UpdateManager.cs'
          )){
            if($required -notin $mutated){throw "expected V0.1.60 mutation missing: $required"}
          }

          $srcTpl=Join-Path $root 'FishingAutomation/abyss/templates/popup_close.png'
          $dstTpl=Join-Path $root 'FishingAutomation/dungeon/templates/popup_close.png'
          if(-not(Test-Path $dstTpl)){throw 'normal dungeon popup template missing'}
          if((Get-FileHash $srcTpl -Algorithm SHA256).Hash-ne(Get-FileHash $dstTpl -Algorithm SHA256).Hash){
            throw 'normal dungeon popup template differs from proven Abyss template'
          }

          $normal=Get-Content -Raw (Join-Path $root 'FishingAutomation/dungeon/config/scenario.json') | ConvertFrom-Json
          $abyss=Get-Content -Raw (Join-Path $root 'FishingAutomation/abyss/config/scenario.json') | ConvertFrom-Json
          $nm=@($normal.Monitors | Where-Object Target -eq 'potion_popup_close')
          $am=@($abyss.Monitors | Where-Object Target -eq 'abyss_popup_close')
          if($nm.Count-ne1 -or $nm[0].Action-ne'escape'){throw 'normal potion popup is not ESC monitor'}
          if($am.Count-ne1 -or $am[0].Action-ne'escape'){throw 'Abyss potion popup is not ESC monitor'}

          $engine=Get-Content -Raw (Join-Path $root 'FishingAutomation/dungeon/ScenarioEngine.cs')
          if(-not $engine.Contains('POTION_POPUP_ESC_V1')){throw 'popup ESC code missing'}
          if(-not $engine.Contains('ESC 후 닫힘 2프레임 확인')){throw 'popup close verification missing'}

          $retry=Get-Content -Raw (Join-Path $root 'FishingAutomation/dungeon/ScenarioEngine.AbyssRetry.cs')
          foreach($marker in @(
            'V0160_ABYSS_RESULT_MULTI_SIGNAL',
            'bool visualSignal = TryDetectAbyssResultButtonRow',
            'result-multisignal rejected',
            'visual_result_button_row_3signal',
            'exitGreen < 0.18 || retryGreen < 0.18 || otherGreen < 0.18',
            'retry.Found && previous.Found && retry.Bounds.IntersectsWith(previous.Bounds)'
          )){
            if(-not $retry.Contains($marker)){throw "result multi-signal marker missing: $marker"}
          }

          Write-Host ('V0160_MUTATIONS ' + (($mutated | Sort-Object) -join ', '))
          Write-Host 'V0160_SOURCE_AUDIT_OK'
          "SOURCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build production
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fish=Join-Path $env:SOURCE_ROOT 'FishingAutomation/FishingAutomation.csproj'
          dotnet build $fish -c Release -r win-x64
          if($LASTEXITCODE-ne0){throw 'V0.1.60 production build failed'}
          $dll=Get-ChildItem (Join-Path $env:SOURCE_ROOT 'FishingAutomation/bin/Release') -Recurse -Filter 'FishingAutomation.dll' |
            Where-Object { $_.FullName -match 'win-x64' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if(-not $dll){throw 'production DLL not found'}
          "PRODUCTION_DLL=$($dll.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run Abyss regression and state tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fishDir=(Resolve-Path (Join-Path $env:SOURCE_ROOT 'FishingAutomation')).Path
          $actualResult=(Resolve-Path 'tests/abyss-offline/result_buttons_actual.b64').Path
          dotnet run --project tests/abyss-offline/AbyssOfflineRegressionTests.csproj -c Release -- $env:PRODUCTION_DLL $fishDir $actualResult
          if($LASTEXITCODE-ne0){throw 'Abyss regression test failed'}

          $project=Get-Content -Raw (Join-Path $env:SOURCE_ROOT 'FishingAutomation/FishingAutomation.csproj')
          $update=Get-Content -Raw (Join-Path $env:SOURCE_ROOT 'FishingAutomation/UpdateManager.cs')
          if(-not $project.Contains('<Version>0.1.60</Version>')){throw 'project version mismatch'}
          if(-not $update.Contains('CurrentVersion = "V0.1.60"')){throw 'updater version mismatch'}
          Write-Host 'V0160_POTION_RESULT_REGRESSION_OK'
