name: Release V0.1.50 Abyss Preview Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0150-abyss-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v0150-abyss-preview
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    steps:
      - name: Checkout V0.1.50 patch source
        uses: actions/checkout@v4
        with:
          ref: v0150-abyss-preview-fix
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore V0.1.49 source and apply image fix
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item source -ItemType Directory -Force | Out-Null
          gh release download V0.1.49 --repo $env:GITHUB_REPOSITORY --pattern 'MabiAuto_V0.1.49_Source.zip' --dir source
          if($LASTEXITCODE-ne0){throw 'V0.1.49 source download failed'}
          Expand-Archive source/MabiAuto_V0.1.49_Source.zip source/current -Force
          $root=(Resolve-Path source/current).Path

          python release-source/v0150_abyss_preview_fix.py $root
          if($LASTEXITCODE-ne0){throw 'V0.1.50 abyss preview patch failed'}

          $refui=Get-Content -Raw (Join-Path $root 'FishingAutomation/MainForm.ReferenceUI.cs')
          foreach($marker in @(
            'LoadDungeonPreview("hallucination_anchorage.png")',
            'LoadDungeonPreview("madness_cave.png")',
            'LoadDungeonPreview("scattered_waterway.png")',
            'Path.Combine(AppContext.BaseDirectory, "abyss", "templates", fileName)'
          )){
            if(-not $refui.Contains($marker)){throw "preview code marker missing: $marker"}
          }
          if($refui.Contains('"abyss", "previews"')){throw 'obsolete preview directory remains'}

          foreach($name in @('hallucination_anchorage.png','madness_cave.png','scattered_waterway.png')){
            $image=Join-Path $root "FishingAutomation/abyss/templates/$name"
            if(-not(Test-Path $image)){throw "source abyss image missing: $name"}
            if((Get-Item $image).Length-le0){throw "source abyss image empty: $name"}
          }

          $project=Get-Content -Raw (Join-Path $root 'FishingAutomation/FishingAutomation.csproj')
          $update=Get-Content -Raw (Join-Path $root 'FishingAutomation/UpdateManager.cs')
          $main=Get-Content -Raw (Join-Path $root 'FishingAutomation/MainForm.cs')
          if(-not $project.Contains('<Version>0.1.50</Version>')){throw 'project version mismatch'}
          if(-not $update.Contains('CurrentVersion = "V0.1.50"')){throw 'updater version mismatch'}
          if(-not $main.Contains('await CheckForUpdatesAsync(false);')){throw 'startup auto-update check missing'}

          "SOURCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Windows build and verify abyss images
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:SOURCE_ROOT
          $fish=Join-Path $root 'FishingAutomation/FishingAutomation.csproj'
          $watch=Join-Path $root 'MacroWatchdog/MacroWatchdog.csproj'

          dotnet build $fish -c Release
          if($LASTEXITCODE-ne0){throw 'Windows app build failed'}
          dotnet build $watch -c Release
          if($LASTEXITCODE-ne0){throw 'watchdog build failed'}

          $pubArgs=@('-c','Release','-r','win-x64','--self-contained','true','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true','-p:EnableCompressionInSingleFile=true','-p:PublishTrimmed=false','-p:PublishAot=false','-p:DebugType=None','-p:DebugSymbols=false')
          dotnet publish $fish @pubArgs -o stage/release
          if($LASTEXITCODE-ne0){throw 'app publish failed'}
          dotnet publish $watch @pubArgs -o stage/watchdog
          if($LASTEXITCODE-ne0){throw 'watchdog publish failed'}
          Copy-Item stage/watchdog/MacroWatchdog.exe stage/release/MacroWatchdog.exe -Force

          foreach($name in @('hallucination_anchorage.png','madness_cave.png','scattered_waterway.png')){
            $image="stage/release/abyss/templates/$name"
            if(-not(Test-Path $image)){throw "published abyss image missing: $name"}
            if((Get-Item $image).Length-le0){throw "published abyss image empty: $name"}
            Write-Host "ABYSS_PREVIEW_OK $name size=$((Get-Item $image).Length)"
          }

          $exe=(Resolve-Path stage/release/FishingAutomation.exe).Path
          if((Get-Item $exe).VersionInfo.FileVersion-ne'0.1.50.0'){throw 'EXE version mismatch'}
          $proc=Start-Process $exe -WorkingDirectory (Resolve-Path stage/release).Path -PassThru
          Start-Sleep 5
          $proc.Refresh()
          if($proc.HasExited){throw "smoke test exit $($proc.ExitCode)"}
          Stop-Process $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Process MacroWatchdog -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          New-Item package/release,package/tools,out -ItemType Directory -Force | Out-Null
          Copy-Item stage/release/* package/release -Recurse -Force
          Copy-Item (Join-Path $root 'tools/ApplyUpdate.ps1') package/tools/ApplyUpdate.ps1 -Force
          'MABI AUTO V0.1.50 Windows Lite - Abyss preview images restored' | Set-Content package/WINDOWS_LITE.txt -Encoding UTF8

          $zip='out/MabiAuto_V0.1.50_Windows_Lite.zip'
          Compress-Archive package/* $zip -CompressionLevel Optimal
          Remove-Item verify -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip verify -Force

          foreach($name in @('hallucination_anchorage.png','madness_cave.png','scattered_waterway.png')){
            if(-not(Test-Path "verify/release/abyss/templates/$name")){throw "ZIP abyss image missing: $name"}
          }
          if((Get-Item verify/release/FishingAutomation.exe).VersionInfo.FileVersion-ne'0.1.50.0'){throw 'ZIP EXE version mismatch'}
          if(-not(Test-Path verify/tools/ApplyUpdate.ps1)){throw 'ZIP updater missing'}

          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MabiAuto_V0.1.50_Windows_Lite.zip" | Set-Content "$zip.sha256" -Encoding ASCII

          New-Item source-package -ItemType Directory -Force | Out-Null
          Copy-Item (Join-Path $root 'FishingAutomation') source-package/FishingAutomation -Recurse
          Copy-Item (Join-Path $root 'MacroWatchdog') source-package/MacroWatchdog -Recurse
          Copy-Item (Join-Path $root 'tools') source-package/tools -Recurse
          Get-ChildItem source-package -Recurse -Directory | Where-Object { $_.Name -in @('bin','obj','debug') } | Remove-Item -Recurse -Force
          Copy-Item release-source/v0150_release_notes.md source-package/RELEASE_NOTES.md
          Compress-Archive source-package/* out/MabiAuto_V0.1.50_Source.zip -CompressionLevel Optimal

          Write-Host "V0150_PACKAGE_OK SHA256=$hash"

      - name: Publish V0.1.50
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $tag='V0.1.50'
          $target=(git rev-parse HEAD).Trim()

          gh release view $tag --repo $repo *> $null
          if($LASTEXITCODE-eq0){
            gh release delete $tag --repo $repo --yes --cleanup-tag
            if($LASTEXITCODE-ne0){throw 'existing V0.1.50 release cleanup failed'}
          } else {
            $null=$LASTEXITCODE
          }

          gh release create $tag --repo $repo --target $target --title 'Mabi Auto V0.1.50' --notes-file release-source/v0150_release_notes.md out/MabiAuto_V0.1.50_Windows_Lite.zip out/MabiAuto_V0.1.50_Windows_Lite.zip.sha256 out/MabiAuto_V0.1.50_Source.zip
          if($LASTEXITCODE-ne0){throw 'V0.1.50 release creation failed'}

          $release=gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if($release.draft -or $release.prerelease){throw 'V0.1.50 must be stable/public'}
          $names=@($release.assets | ForEach-Object {$_.name})
          foreach($required in @('MabiAuto_V0.1.50_Windows_Lite.zip','MabiAuto_V0.1.50_Windows_Lite.zip.sha256','MabiAuto_V0.1.50_Source.zip')){
            if($required -notin $names){throw "release asset missing: $required"}
          }
          Write-Host "V0150_RELEASE_OK $($release.html_url)"
