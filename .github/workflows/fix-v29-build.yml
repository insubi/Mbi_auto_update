name: Fix v29 build asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v29-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Patch v29 ZIP and replace release asset
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET='CombinedFishingDungeon_v29_DashboardSmartUpdate.zip'
          TAG='v29'
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --clobber
          rm -rf work
          mkdir work
          unzip -q "$ASSET" -d work

          python3 - <<'PY'
          from pathlib import Path
          root = Path('work/CombinedFishingDungeon_v29/FishingAutomation')

          p = root / 'UpdateManager.cs'
          s = p.read_text(encoding='utf-8-sig')
          old = '        Process.Start(psi) ?? throw new InvalidOperationException("업데이트 도우미를 실행하지 못했습니다.");\n'
          new = '        var updaterProcess = Process.Start(psi);\n        if (updaterProcess is null)\n            throw new InvalidOperationException("업데이트 도우미를 실행하지 못했습니다.");\n'
          if old in s:
              s = s.replace(old, new)
          elif 'var updaterProcess = Process.Start(psi);' not in s:
              raise SystemExit('UpdateManager.cs expected line not found')
          p.write_text(s, encoding='utf-8-sig')

          p = root / 'MainForm.Dashboard.cs'
          s = p.read_text(encoding='utf-8-sig')
          head = s.split('namespace', 1)[0]
          if 'using DungeonVisionBot;' not in head:
              s = 'using DungeonVisionBot;\n\n' + s
          p.write_text(s, encoding='utf-8-sig')

          note = Path('work/CombinedFishingDungeon_v29/BUILD_FIX_v29.txt')
          note.write_text(
              'MABI AUTO v29 BUILD FIX\n\n'
              '- UpdateManager.cs CS0201 수정\n'
              '- MainForm.Dashboard.cs WindowTools CS0103 수정\n',
              encoding='utf-8-sig')
          PY

          rm -f "$ASSET"
          (cd work && zip -qr "../$ASSET" CombinedFishingDungeon_v29)
          gh release upload "$TAG" "$ASSET" --repo "$REPO" --clobber
