name: Build V0.1.31 Peaca Map Navigation

on:
  workflow_dispatch:
  push:
    branches:
      - v0131-peaca-map-navigation
    paths:
      - '.github/workflows/build-v0131-peaca-map-navigation.yml'
      - 'release-source/v0131_peaca_map_navigation.py'
      - 'release-source/v0131_peaca_drag_interface_fix.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Patch and validate V0.1.31
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri 'https://github.com/insubi/Mbi_auto_update/releases/download/V0.1.30/CombinedFishingDungeon_V0.1.30_NoPolicyDetection.zip' -OutFile current.zip
          Expand-Archive current.zip -DestinationPath current
          $root=Get-ChildItem current -Directory | Select-Object -First 1
          if($null-eq$root){throw 'source root missing'}
          $fish=Join-Path $root.FullName 'FishingAutomation'

          python release-source/v0131_peaca_map_navigation.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.31 patch failed'}
          python release-source/v0131_peaca_drag_interface_fix.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.31 drag compatibility fix failed'}

          $main=Get-Content -Raw (Join-Path $fish 'MainForm.cs')
          $ref=Get-Content -Raw (Join-Path $fish 'MainForm.ReferenceUI.cs')
          $dash=Get-Content -Raw (Join-Path $fish 'MainForm.Dashboard.cs')
          $engine=Get-Content -Raw (Join-Path $fish 'dungeon/ScenarioEngine.cs')
          $input=Get-Content -Raw (Join-Path $fish 'dungeon/InputController.cs')
          $targets=Get-Content -Raw (Join-Path $fish 'dungeon/config/targets.json')|ConvertFrom-Json

          foreach($text in @('페카 심층 1-1','페카 심층 2-2','현재 위치')){
            if(-not(($main+$ref+$dash).Contains($text))){throw "regular dungeon UI string missing: $text"}
          }
          foreach($marker in @(
            'PEACA_MAP_NAVIGATION_V1',
            'PreparePeacaDeepDungeonAsync',
            '화면 변화 거의 없음 2회',
            '임의 좌표는 클릭하지 않습니다',
            '기존 던전 매크로로 인계'
          )){if(-not $engine.Contains($marker)){throw "Peaca navigation marker missing: $marker"}}
          if(-not $input.Contains('DragClientPoint')){throw 'verified map drag primitive missing'}
          if($engine.Contains('_input.DragClientPoint(')){throw 'map drag still depends on fallback interface'}
          if(-not $engine.Contains('if (_input is not InterceptionInput interception)')){throw 'Interception-only Peaca drag guard missing'}

          foreach($id in @('map_ula_header','peaca_map_name','peaca_detail_name','peaca_goto','peaca_deep_tab','peaca_deep_screen','peaca_entry_11','peaca_entry_22')){
            if(@($targets|Where-Object {$_.Id-eq$id}).Count-ne1){throw "Peaca OCR target missing/duplicate: $id"}
          }
          if((@($targets|Where-Object {$_.Id-eq'peaca_entry_11'})[0]).Text-ne'심층 1층 1구역 진입'){throw 'D1-1 entry target changed'}
          if((@($targets|Where-Object {$_.Id-eq'peaca_entry_22'})[0]).Text-ne'심층 2층 2구역 진입'){throw 'D2-2 entry target changed'}

          foreach($id in @('policy_shutdown','policy_error88')){
            if(@($targets|Where-Object {$_.Id-eq$id}).Count-ne0){throw "removed policy target returned: $id"}
          }
          foreach($forbidden in @('policy_shutdown','policy_error88','ThrowIfDungeonPolicyShutdownAsync','DUNGEON_POLICY_SHUTDOWN_DETECTED','DUNGEON_GLOBAL_POLICY_GUARD_V7','운영 정책/ERROR 88')){
            if($engine.Contains($forbidden)){throw "policy detection residue returned: $forbidden"}
          }

          foreach($marker in @(
            'DUNGEON_FULL_STABILITY_HARDENING_V7',
            '동일 단계 복구',
            '같은 복구 단계가',
            'scene_skip 1/2 확인',
            'scene_skip 2/2 연속 확인',
            'DUNGEON_SCREEN_FIRST_RECOVERY_V6',
            'DUNGEON_CHALLENGE_DISAMBIGUATION_V5',
            '던전 밖 HUD 3/4 이상 확인',
            '어비스 클릭 검증 실패'
          )){if(-not $engine.Contains($marker)){throw "preserved marker missing: $marker"}}

          foreach($id in @('retry','scene_skip','selected','challenge','enter_bottom')){
            if(@($targets|Where-Object {$_.Id-eq$id}).Count-ne1){throw "required target missing/duplicate: $id"}
          }
          $retry=@($targets|Where-Object {$_.Id-eq'retry'})[0]
          if($retry.Kind-ne'hybrid' -or $retry.Text-ne'다시 하기' -or $retry.TemplatePath-ne'templates/retry_visual_v0129.jpg'){
            throw 'retry hybrid behavior changed unexpectedly'
          }
          $retryTemplate=Join-Path $fish 'dungeon/templates/retry_visual_v0129.jpg'
          if(-not(Test-Path $retryTemplate)){throw 'retry template missing'}
          $retryHash=(Get-FileHash $retryTemplate -Algorithm SHA256).Hash.ToLowerInvariant()
          if($retryHash-ne'0089b636041b76b4eabd269b7c50b82d045ef11f66368797947b7f72adea59aa'){
            throw "retry template changed: $retryHash"
          }

          $scenario=Get-Content -Raw (Join-Path $fish 'dungeon/config/scenario.json')|ConvertFrom-Json
          $sceneMon=@($scenario.Monitors|Where-Object {$_.Target-eq'scene_skip'})
          if($sceneMon.Count-ne1){throw 'scene_skip monitor missing/duplicate'}
          if([int]$sceneMon[0].CooldownMs-ne2500 -or [int]$sceneMon[0].ScanIntervalMs-ne1200){throw 'scene_skip timing changed'}

          $expected=@{
            'compass.png'='af26e115ad824262ec890e51bb072b74098278d7cdbc40c6f1e7381fb3c467c3';
            'gauge.png'='22d78ea16f21db75ff11cb7a576e3275204f051a4214f8791c9605d975a317f8';
            'healthbar.png'='b79c90379ff0558ab19f77ac28a5e2dd64928f3d0ec46b1ce3fc5906a7956373';
            'hook.png'='e584e44185e15edbb75c8505ea5002edcaf3c0e2e770d8f6417ba4ff4fde8949'
          }
          foreach($t in $expected.Keys){
            $h=(Get-FileHash (Join-Path $fish "templates/$t") -Algorithm SHA256).Hash.ToLowerInvariant()
            if($h-ne$expected[$t]){throw "fishing template changed: $t $h"}
          }

          dotnet restore (Join-Path $fish 'FishingAutomation.csproj')
          if($LASTEXITCODE-ne0){throw 'FishingAutomation restore failed'}
          dotnet build (Join-Path $fish 'FishingAutomation.csproj') -c Release --no-restore
          if($LASTEXITCODE-ne0){throw 'FishingAutomation build failed'}

          $watchProj=Join-Path $root.FullName 'MacroWatchdog/MacroWatchdog.csproj'
          if(Test-Path $watchProj){
            dotnet restore $watchProj
            if($LASTEXITCODE-ne0){throw 'MacroWatchdog restore failed'}
            dotnet build $watchProj -c Release --no-restore
            if($LASTEXITCODE-ne0){throw 'MacroWatchdog build failed'}
          }

          New-Item -ItemType Directory -Path stage,stage/release,out | Out-Null
          Copy-Item -LiteralPath $root.FullName -Destination 'stage/MabiAuto_V0.1.31' -Recurse
          $pkg=(Resolve-Path 'stage/MabiAuto_V0.1.31').Path
          $pkgFish=Join-Path $pkg 'FishingAutomation'
          $args=@('-c','Release','-r','win-x64','--self-contained','true','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true','-p:EnableCompressionInSingleFile=true','-p:PublishTrimmed=false','-p:PublishAot=false','-p:DebugType=None','-p:DebugSymbols=false')
          dotnet publish (Join-Path $pkgFish 'FishingAutomation.csproj') @args -o stage/release
          if($LASTEXITCODE-ne0){throw 'FishingAutomation publish failed'}

          $watch=Join-Path $pkg 'MacroWatchdog/MacroWatchdog.csproj'
          if(Test-Path $watch){
            dotnet publish $watch @args -o stage/watchdog
            if($LASTEXITCODE-ne0){throw 'Watchdog publish failed'}
            if(Test-Path 'stage/watchdog/MacroWatchdog.exe'){Copy-Item 'stage/watchdog/MacroWatchdog.exe' 'stage/release/MacroWatchdog.exe' -Force}
          }

          $release=Join-Path $pkg 'release'
          if(Test-Path $release){Remove-Item $release -Recurse -Force}
          Copy-Item (Resolve-Path 'stage/release').Path -Destination $release -Recurse

          foreach($t in $expected.Keys){
            $h=(Get-FileHash (Join-Path $release "templates/$t") -Algorithm SHA256).Hash.ToLowerInvariant()
            if($h-ne$expected[$t]){throw "runtime fishing template changed: $t $h"}
          }
          if(-not(Test-Path (Join-Path $release 'dungeon/templates/retry_visual_v0129.jpg'))){throw 'runtime retry template missing'}

          $runtimeTargets=Get-Content -Raw (Join-Path $release 'dungeon/config/targets.json')|ConvertFrom-Json
          foreach($id in @('map_ula_header','peaca_map_name','peaca_detail_name','peaca_goto','peaca_deep_tab','peaca_deep_screen','peaca_entry_11','peaca_entry_22')){
            if(@($runtimeTargets|Where-Object {$_.Id-eq$id}).Count-ne1){throw "runtime Peaca target missing: $id"}
          }

          $exe=Join-Path $release 'FishingAutomation.exe'
          $p=Start-Process $exe -WorkingDirectory $release -PassThru
          Start-Sleep 5
          $p.Refresh()
          if($p.HasExited){throw "smoke test exit $($p.ExitCode)"}
          Stop-Process $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process MacroWatchdog -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'SMOKE_TEST_OK'

          $source=(Resolve-Path out).Path+'\CombinedFishingDungeon_V0.1.31_PeacaMapNavigation.zip'
          Compress-Archive -LiteralPath $root.FullName -DestinationPath $source -CompressionLevel Optimal
          $lite=(Resolve-Path out).Path+'\MabiAuto_V0.1.31_Windows_Lite.zip'
          Compress-Archive -LiteralPath $pkg -DestinationPath $lite -CompressionLevel Optimal
          $hash=(Get-FileHash $lite -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MabiAuto_V0.1.31_Windows_Lite.zip"|Set-Content "$lite.sha256" -Encoding ASCII
          Write-Host "LITE_SHA256=$hash"

      - name: Publish V0.1.31 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='V0.1.31'
          @(
            'MABI AUTO V0.1.31 - 페카 심층 자동 이동 테스트',
            '',
            '던전 모드의 기존 선택 던전 메뉴에 현재 위치 / 페카 심층 1-1 / 페카 심층 2-2를 추가했습니다.',
            '페카 선택 시 M -> 울라 대륙 -> 좌상단 경계 정렬(화면 변화 2회 확인) -> 지그재그 OCR 탐색 -> 페카 고분 + 여기로 가기 검증 -> Space -> 심층 던전 -> 선택 구역 -> 기존 선택됨/도전 매크로로 인계합니다.',
            'OCR로 페카 고분을 찾지 못하면 임의 좌표를 클릭하지 않고 안전 정지합니다.',
            '현재 위치를 선택하면 V0.1.30과 동일하게 사용자가 던전 앞에서 시작하는 기존 방식입니다.',
            '운영 정책/ERROR 88 OCR 감지는 제거된 상태를 유지합니다.',
            '',
            '테스트 실행 파일: MabiAuto_V0.1.31_Windows_Lite.zip'
          )|Set-Content notes.txt -Encoding UTF8
          $assets=@(
            'out/CombinedFishingDungeon_V0.1.31_PeacaMapNavigation.zip',
            'out/MabiAuto_V0.1.31_Windows_Lite.zip',
            'out/MabiAuto_V0.1.31_Windows_Lite.zip.sha256'
          )
          if(gh release view $tag --repo $env:REPO *> $null){
            gh release upload $tag @assets --repo $env:REPO --clobber
          }else{
            gh release create $tag @assets --repo $env:REPO --target $env:GITHUB_SHA --title 'Mabi Auto V0.1.31' --notes-file notes.txt
          }
