name: Release V0.1.61 Abyss Flow and Potion Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0161-abyss-flow-potion.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v0161-abyss-flow-potion
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    steps:
      - name: Checkout V0.1.61 patch branch
        uses: actions/checkout@v4
        with:
          ref: v0161-abyss-retry-potion-fix
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore V0.1.60 source and apply V0.1.61
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item source -ItemType Directory -Force | Out-Null
          gh release download V0.1.60 --repo $env:GITHUB_REPOSITORY --pattern 'MabiAuto_V0.1.60_Source.zip' --dir source
          if($LASTEXITCODE-ne0){throw 'V0.1.60 source download failed'}
          Expand-Archive source/MabiAuto_V0.1.60_Source.zip source/current -Force
          $root=(Resolve-Path source/current).Path

          python release-source/v0161_abyss_retry_potion_fix.py $root
          if($LASTEXITCODE-ne0){throw 'V0.1.61 primary patch failed'}
          python release-source/v0161_abyss_flow_potion_hotfix.py $root
          if($LASTEXITCODE-ne0){throw 'V0.1.61 flow/potion hardening failed'}

          $engine=Get-Content -Raw (Join-Path $root 'FishingAutomation/dungeon/ScenarioEngine.cs')
          $state=Get-Content -Raw (Join-Path $root 'FishingAutomation/dungeon/ScenarioEngine.AbyssState.cs')
          $retry=Get-Content -Raw (Join-Path $root 'FishingAutomation/dungeon/ScenarioEngine.AbyssRetry.cs')

          if($engine.Contains('5단계에서 실제 결과 화면을 먼저 확인')){throw 'step-5 result fast-path remains'}
          if($state.Contains('(AbyssFlowState.CombatClearWait, AbyssFlowState.ResultConfirmed) => true')){throw 'direct CombatClearWait -> ResultConfirmed transition remains'}
          foreach($marker in @(
            '실제 결과 화면 후보 1/2',
            '실제 결과 화면 2/2 확인',
            'result.Bounds.IntersectsWith(previousResult.Bounds)',
            '회복 물약 팝업 확인({popupSource}) -> 마우스 클릭 없이 ESC 1회',
            '회복 물약 팝업 ESC 후 닫힘 2프레임 확인'
          )){
            if(-not $engine.Contains($marker)){throw "runtime marker missing: $marker"}
          }
          if($engine.Contains('팝업 닫기 이미지 확인 -> 클릭')){throw 'legacy recovery popup mouse click remains'}
          if(-not $retry.Contains('aspect < 0.74 || aspect > 0.92')){throw 'result aspect 0.92 guard missing'}

          $project=Get-Content -Raw (Join-Path $root 'FishingAutomation/FishingAutomation.csproj')
          $update=Get-Content -Raw (Join-Path $root 'FishingAutomation/UpdateManager.cs')
          if(-not $project.Contains('<Version>0.1.61</Version>')){throw 'project version mismatch'}
          if(-not $update.Contains('CurrentVersion = "V0.1.61"')){throw 'updater version mismatch'}

          "SOURCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'V0161_SOURCE_PATCH_OK'

      - name: Build and smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fish=Join-Path $env:SOURCE_ROOT 'FishingAutomation/FishingAutomation.csproj'
          $watch=Join-Path $env:SOURCE_ROOT 'MacroWatchdog/MacroWatchdog.csproj'

          dotnet build $fish -c Release -r win-x64
          if($LASTEXITCODE-ne0){throw 'FishingAutomation build failed'}
          dotnet build $watch -c Release
          if($LASTEXITCODE-ne0){throw 'MacroWatchdog build failed'}

          $pubArgs=@('-c','Release','-r','win-x64','--self-contained','true','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true','-p:EnableCompressionInSingleFile=true','-p:PublishTrimmed=false','-p:PublishAot=false','-p:DebugType=None','-p:DebugSymbols=false')
          dotnet publish $fish @pubArgs -o stage/release
          if($LASTEXITCODE-ne0){throw 'app publish failed'}
          dotnet publish $watch @pubArgs -o stage/watchdog
          if($LASTEXITCODE-ne0){throw 'watchdog publish failed'}
          Copy-Item stage/watchdog/MacroWatchdog.exe stage/release/MacroWatchdog.exe -Force

          $exe=(Resolve-Path stage/release/FishingAutomation.exe).Path
          if((Get-Item $exe).VersionInfo.FileVersion-ne'0.1.61.0'){throw "EXE version mismatch: $((Get-Item $exe).VersionInfo.FileVersion)"}

          $proc=Start-Process $exe -WorkingDirectory (Resolve-Path stage/release).Path -PassThru
          Start-Sleep 5
          $proc.Refresh()
          if($proc.HasExited){throw "smoke test exit $($proc.ExitCode)"}
          Stop-Process $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Process MacroWatchdog -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $abyssTargets=Get-Content -Raw stage/release/abyss/config/targets.json | ConvertFrom-Json
          $abyssScenario=Get-Content -Raw stage/release/abyss/config/scenario.json | ConvertFrom-Json
          if(-not(@($abyssTargets | Where-Object Id -eq 'abyss_potion_popup_title').Count-eq1)){throw 'published potion title OCR target missing'}
          if(-not(@($abyssScenario.Monitors | Where-Object { $_.Target-eq'abyss_potion_popup_title' -and $_.Action-eq'escape' }).Count-eq1)){throw 'published potion title ESC monitor missing'}

          Write-Host 'V0161_BUILD_SMOKE_OK'

      - name: Package Windows and source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:SOURCE_ROOT
          New-Item package/release,package/tools,package/FishingAutomation,out,source-package -ItemType Directory -Force | Out-Null
          Copy-Item stage/release/* package/release -Recurse -Force
          Copy-Item (Join-Path $root 'tools/ApplyUpdate.ps1') package/tools/ApplyUpdate.ps1 -Force
          Copy-Item (Join-Path $root 'START.cmd') package/START.cmd -Force
          Copy-Item (Join-Path $root 'REPAIR_AUTO_UPDATE.cmd') package/REPAIR_AUTO_UPDATE.cmd -Force
          'Compatibility directory for legacy updater notification restore.' | Set-Content package/FishingAutomation/.update_compat -Encoding ASCII
          'MABI AUTO V0.1.61 Windows Lite - Abyss flow guard + potion ESC recovery' | Set-Content package/WINDOWS_LITE.txt -Encoding UTF8

          $zip='out/MabiAuto_V0.1.61_Windows_Lite.zip'
          Compress-Archive package/* $zip -CompressionLevel Optimal
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MabiAuto_V0.1.61_Windows_Lite.zip" | Set-Content "$zip.sha256" -Encoding ASCII

          Copy-Item (Join-Path $root 'FishingAutomation') source-package/FishingAutomation -Recurse
          Copy-Item (Join-Path $root 'MacroWatchdog') source-package/MacroWatchdog -Recurse
          Copy-Item (Join-Path $root 'tools') source-package/tools -Recurse
          Copy-Item (Join-Path $root 'START.cmd') source-package/START.cmd -Force
          Copy-Item (Join-Path $root 'REPAIR_AUTO_UPDATE.cmd') source-package/REPAIR_AUTO_UPDATE.cmd -Force
          Copy-Item release-source/v0161_release_notes.md source-package/RELEASE_NOTES.md
          Get-ChildItem source-package -Recurse -Directory | Where-Object { $_.Name -in @('bin','obj','debug') } | Remove-Item -Recurse -Force
          Compress-Archive source-package/* out/MabiAuto_V0.1.61_Source.zip -CompressionLevel Optimal

          Remove-Item verify -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip verify -Force
          if((Get-Item verify/release/FishingAutomation.exe).VersionInfo.FileVersion-ne'0.1.61.0'){throw 'ZIP EXE version mismatch'}
          foreach($required in @(
            'release/FishingAutomation.exe',
            'release/abyss/config/scenario.json',
            'release/abyss/config/targets.json',
            'release/dungeon/config/scenario.json',
            'release/dungeon/config/targets.json',
            'tools/ApplyUpdate.ps1',
            'START.cmd',
            'REPAIR_AUTO_UPDATE.cmd'
          )){
            if(-not(Test-Path (Join-Path verify $required))){throw "ZIP required file missing: $required"}
          }
          Write-Host "V0161_PACKAGE_OK SHA256=$hash"

      - name: Publish V0.1.61
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $tag='V0.1.61'

          gh release view $tag --repo $repo *> $null
          if($LASTEXITCODE-eq0){
            gh release delete $tag --repo $repo --yes --cleanup-tag
            if($LASTEXITCODE-ne0){throw 'existing V0.1.61 cleanup failed'}
          } else {
            $null=$LASTEXITCODE
          }

          gh release create $tag --repo $repo --target v0161-abyss-retry-potion-fix --title 'Mabi Auto V0.1.61' --notes-file release-source/v0161_release_notes.md out/MabiAuto_V0.1.61_Windows_Lite.zip out/MabiAuto_V0.1.61_Windows_Lite.zip.sha256 out/MabiAuto_V0.1.61_Source.zip
          if($LASTEXITCODE-ne0){throw 'V0.1.61 release creation failed'}

          $release=gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          $names=@($release.assets | ForEach-Object {$_.name})
          foreach($required in @('MabiAuto_V0.1.61_Windows_Lite.zip','MabiAuto_V0.1.61_Windows_Lite.zip.sha256','MabiAuto_V0.1.61_Source.zip')){
            if($required -notin $names){throw "release asset missing: $required"}
          }
          Write-Host "V0161_RELEASE_OK $($release.html_url)"
