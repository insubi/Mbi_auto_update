name: Inspect V0.1.58 Abyss State Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v0158-abyss-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact V0.1.58 methods
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item source -ItemType Directory -Force | Out-Null
          gh release download V0.1.58 --repo $env:GITHUB_REPOSITORY --pattern 'MabiAuto_V0.1.58_Source.zip' --dir source
          Expand-Archive source/MabiAuto_V0.1.58_Source.zip source/current -Force
          $root=(Resolve-Path source/current).Path
          $engine=(Join-Path $root 'FishingAutomation/dungeon/ScenarioEngine.cs')
          $retry=(Join-Path $root 'FishingAutomation/dungeon/ScenarioEngine.AbyssRetry.cs')

          @'
          from pathlib import Path
          import sys

          def method(text, needle):
              i=text.find(needle)
              if i<0:
                  print("MISSING", needle)
                  return
              b=text.find("{", i)
              depth=0
              in_str=False
              verbatim=False
              esc=False
              j=b
              while j < len(text):
                  ch=text[j]
                  if in_str:
                      if verbatim:
                          if ch=='"':
                              if j+1 < len(text) and text[j+1]=='"':
                                  j += 2; continue
                              in_str=False; verbatim=False
                      else:
                          if esc: esc=False
                          elif ch=='\\': esc=True
                          elif ch=='"': in_str=False
                  else:
                      if ch=='"':
                          in_str=True
                          verbatim=(j>0 and text[j-1]=='@')
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0:
                              print("===== "+needle+" =====")
                              print(text[i:j+1])
                              return
                  j+=1
              print("UNTERMINATED", needle)

          for p in sys.argv[1:]:
              t=Path(p).read_text(encoding='utf-8-sig')
              if p.endswith('ScenarioEngine.cs'):
                  for n in [
                      'public async Task RunAsync(CancellationToken ct)',
                      'private async Task ExecuteStepAsync(ScenarioStep step, CancellationToken ct)',
                      'private async Task<DetectionResult> DetectAbyssConfirmedClearAsync',
                      'private async Task<DetectionResult> WaitForAbyssTouchPromptAsync',
                      'private async Task WaitForAbyssClearScreenGoneAsync',
                      'private async Task AdvanceAbyssClearScreenAsync'
                  ]: method(t,n)
              else:
                  for n in [
                      'private async Task RetryAbyssResultAsync',
                      'private async Task WaitForAbyssRetryTransitionAsync'
                  ]: method(t,n)
          '@ | Set-Content extract.py -Encoding UTF8

          python extract.py $engine $retry
