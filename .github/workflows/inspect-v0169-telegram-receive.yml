name: Inspect V0.1.69 Telegram Receive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v0169-telegram-receive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Telegram receive flow
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item cur -ItemType Directory -Force | Out-Null
          gh release download V0.1.69 --repo $env:GITHUB_REPOSITORY --pattern 'MabiAuto_V0.1.69_Source.zip' --dir cur
          Expand-Archive cur/MabiAuto_V0.1.69_Source.zip cur/src -Force
          $root=(Resolve-Path cur/src).Path
          Write-Host '=== TELEGRAM NOTIFIER ==='
          Get-Content (Join-Path $root 'FishingAutomation/TelegramNotifier.cs')
          Write-Host '=== MAINFORM TELEGRAM ==='
          Get-Content (Join-Path $root 'FishingAutomation/MainForm.Telegram.cs')
          Write-Host '=== TELEGRAM REFERENCES ==='
          Get-ChildItem (Join-Path $root 'FishingAutomation') -Filter '*.cs' -Recurse | ForEach-Object {
            Select-String -Path $_.FullName -Pattern 'HandleTelegramCommandAsync|StartPolling|Telegram|/status|/item|/itemreset|OnCommand' -Context 2,8
          } | ForEach-Object {$_.ToString()}
