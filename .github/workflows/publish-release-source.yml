name: Publish Release Source

on:
  push:
    branches: [main]
    paths:
      - 'release-source/*.zip'
      - 'release-source/*.patch'
      - 'release-source/v*_apply.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build source ZIP if needed and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          INPUT="$(git diff-tree --no-commit-id --name-only --diff-filter=AM -r "$GITHUB_SHA" | grep -E '^release-source/(.*\.zip|.*\.patch|v[0-9]+_apply\.py)$' | sort -V | tail -n1 || true)"
          if [ -z "$INPUT" ]; then
            INPUT="$(find release-source -maxdepth 1 -type f \( -name '*.zip' -o -name '*.patch' -o -name 'v*_apply.py' \) | sort -V | tail -n1 || true)"
          fi
          if [ -z "$INPUT" ]; then
            echo 'No release source input found.'
            exit 1
          fi

          BASE_NAME="$(basename "$INPUT")"
          VERSION="$(printf '%s' "$BASE_NAME" | sed -nE 's/.*v([0-9]+).*/\1/p')"
          if [ -z "$VERSION" ]; then
            echo "Could not parse version from $BASE_NAME"
            exit 1
          fi

          if [[ "$INPUT" == *.patch || "$INPUT" == *_apply.py || "$BASE_NAME" == v*_overlay.zip ]]; then
            if [ "$VERSION" -le 1 ]; then
              echo 'Overlay releases require a previous integer version.'
              exit 1
            fi
            BASE_VERSION=$((VERSION - 1))
            BASE_TAG="v$BASE_VERSION"
            echo "Creating v$VERSION source from $BASE_TAG + $INPUT"

            SOURCE_ASSET="$(gh release view "$BASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -Ei '\.zip$' | grep -Eiv 'Windows_Lite|Windows_Ready|Prebuilt' | head -n1 || true)"
            if [ -z "$SOURCE_ASSET" ]; then
              echo "No source ZIP found in $BASE_TAG"
              exit 1
            fi

            rm -rf patch-work "CombinedFishingDungeon_v$VERSION"
            mkdir patch-work
            gh release download "$BASE_TAG" --repo "$REPO" --pattern "$SOURCE_ASSET" --clobber
            unzip -q "$SOURCE_ASSET" -d patch-work
            ROOT="$(find patch-work -mindepth 1 -maxdepth 1 -type d | head -n1)"
            if [ -z "$ROOT" ]; then
              echo 'Base source ZIP does not contain a root directory.'
              exit 1
            fi

            if [[ "$INPUT" == *.patch ]]; then
              patch -d "$ROOT" -p2 < "$INPUT"
            elif [[ "$INPUT" == *_apply.py ]]; then
              python3 "$INPUT" "$ROOT"
            else
              unzip -oq "$INPUT" -d "$ROOT"
            fi

            TARGET_ROOT="CombinedFishingDungeon_v$VERSION"
            mv "$ROOT" "$TARGET_ROOT"
            ZIP="CombinedFishingDungeon_v${VERSION}_StabilityRemote.zip"
            zip -qr "$ZIP" "$TARGET_ROOT"
            unzip -t "$ZIP" >/dev/null
          else
            ZIP="$INPUT"
            unzip -t "$ZIP" >/dev/null
          fi

          TAG="v$VERSION"
          TITLE="Mabi Auto $TAG"
          NOTES_FILE="release-notes.txt"
          cat > "$NOTES_FILE" <<EOF
          MABI AUTO $TAG

          안정성 중심 업데이트입니다.
          소스 패키지 게시 후 GitHub Actions가 Windows_Lite 완성본과 SHA256 파일을 자동 생성합니다.
          Windows_Lite는 사용자 PC에 .NET SDK 설치가 필요하지 않습니다.
          EOF

          if [ "$VERSION" -ge 58 ]; then
            cat > "$NOTES_FILE" <<EOF
          MABI AUTO $TAG - 안전 배포 최적화

          v57 기능 로직과 OCR/다시하기/업데이트 복구 동작을 유지합니다.
          배포에 불필요한 소스, README, 디버그 파일 및 대소문자 중복 경로를 정리했습니다.
          설정·템플릿은 기존 실행부와 도구가 참조하는 경로에 그대로 유지합니다.
          .NET self-contained x64 유지. OpenCV/OCR/WinForms trimming 및 AOT를 사용하지 않습니다.
          Windows 빌드, 실행·Watchdog 시작 확인, 기존 updater의 설정 보존 테스트 후 공개됩니다.
          일반 사용자는 MabiAuto_${TAG}_Windows_Lite.zip을 받으세요.
          EOF
          fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            if [ "$VERSION" -ge 58 ] && [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')" != true ]; then
              echo "Refusing to replace already published $TAG. Use a new version."
              exit 1
            fi
            echo "Release $TAG exists; replacing source ZIP assets."
            while IFS= read -r asset; do
              [ -z "$asset" ] && continue
              if printf '%s' "$asset" | grep -Eqi '\.zip$' && ! printf '%s' "$asset" | grep -Eqi 'Windows_Lite|Windows_Ready|Prebuilt'; then
                gh release delete-asset "$TAG" "$asset" --repo "$REPO" -y || true
              fi
            done < <(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
            gh release upload "$TAG" "$ZIP" --repo "$REPO" --clobber
          else
            echo "Creating release $TAG"
            RELEASE_FLAGS=()
            if [ "$VERSION" -ge 58 ]; then RELEASE_FLAGS+=(--draft); fi
            gh release create "$TAG" "$ZIP" \
              --repo "$REPO" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" "${RELEASE_FLAGS[@]}"
          fi

          echo "SOURCE RELEASE OK: $TAG / $(basename "$ZIP")"
