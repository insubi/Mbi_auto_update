name: Release V0.1.47 Recovery Entry Priority

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0147-recovery-entry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0147-recovery-entry-priority

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build validate and package V0.1.47
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri 'https://github.com/insubi/Mbi_auto_update/releases/download/V0.1.31/CombinedFishingDungeon_V0.1.31_PeacaAutoRoute.zip' -OutFile current.zip
          Expand-Archive current.zip -DestinationPath current -Force
          $root=Get-ChildItem current -Directory | Select-Object -First 1
          if($null-eq$root){throw 'source root missing'}
          $fish=Join-Path $root.FullName 'FishingAutomation'
          $dungeon=Join-Path $fish 'dungeon'

          $patches=@(
            'v0132_ulla_fixed_click_final.py',
            'v0133_result_retry_fastpath.py',
            'v0134_runtime_error_upload.py',
            'v0135_visual_test_environment.py',
            'v0136_worldmap_ocr_fix.py',
            'v0137_dungeon_icon_runda_fiod.py',
            'v0137_updater_survival.py',
            'v0138_arrival_timeout_5min.py',
            'v0139_slot_template_fix.py',
            'v0140_slot_hybrid_fix.py',
            'v0141_template_path_fix.py',
            'v0142_entry_exact_click_fix.py',
            'v0143_selected_entry_click_guards.py',
            'v0144_entry_space.py',
            'v0145_entry_state_hardening.py',
            'v0146_retry_entry_guard.py',
            'v0147_recovery_entry_priority.py'
          )
          foreach($p in $patches){
            python (Join-Path 'release-source' $p) $root.FullName
            if($LASTEXITCODE-ne0){throw "patch failed: $p"}
          }

          $project=Get-Content -Raw (Join-Path $fish 'FishingAutomation.csproj')
          $engine=Get-Content -Raw (Join-Path $dungeon 'ScenarioEngine.cs')
          $targets=Get-Content -Raw (Join-Path $dungeon 'config/targets.json') | ConvertFrom-Json
          $refui=Get-Content -Raw (Join-Path $fish 'MainForm.ReferenceUI.cs')

          if(-not $project.Contains('<Version>0.1.47</Version>')){throw 'project version is not 0.1.47'}

          $start=$engine.IndexOf('private async Task<int?> DetectKnownDungeonRecoveryStepAsync')
          $end=$engine.IndexOf('// DUNGEON_SCREEN_FIRST_RECOVERY_V6',$start)
          if($start-lt0 -or $end-lt0){throw 'recovery detector block missing'}
          $block=$engine.Substring($start,$end-$start)

          foreach($marker in @(
            '[던전 자동복구] 입장 화면 우선 판정',
            'DetectAsync("selected_ocr_strict", frame, ct)',
            'DetectAsync("challenge_confirm_strict", frame, ct)',
            'FindDungeonStepIndex("enter_bottom")',
            'DetectAsync("retry_ocr_strict", frame, ct)',
            '정확 OCR 다시 하기 확인'
          )){
            if(-not $block.Contains($marker)){throw "recovery marker missing: $marker"}
          }

          if($block.Contains('DetectAsync("retry", frame, ct)')){throw 'loose retry remains in recovery detector'}
          if($block.IndexOf('DetectAsync("selected_ocr_strict", frame, ct)') -gt $block.IndexOf('DetectAsync("retry_ocr_strict", frame, ct)')){
            throw 'retry is checked before entry state'
          }

          foreach($marker in @(
            '[retry guard] 입장 화면에서는 다시 하기 클릭 금지',
            '입장 화면 감지 -> scene_skip 클릭 차단',
            '도전 상태 + 오른쪽 입장하기 확인 -> Space 입력'
          )){
            if(-not $engine.Contains($marker)){throw "existing protection missing: $marker"}
          }

          $strict=@($targets|Where-Object{$_.Id-eq'retry_ocr_strict'})[0]
          if($null-eq$strict -or $strict.Kind-ne'ocr' -or $strict.Text-ne'다시 하기' -or [int]$strict.MaxEditDistance-ne0){
            throw 'retry_ocr_strict config mismatch'
          }

          if(-not $refui.Contains('AddButton("인식", new(18, 511, 170, 59), owner.ShowVisualRecognitionTest, "image", "nav");')){
            throw 'recognition nav UI regressed'
          }

          dotnet restore (Join-Path $fish 'FishingAutomation.csproj')
          dotnet build (Join-Path $fish 'FishingAutomation.csproj') -c Release --no-restore
          if($LASTEXITCODE-ne0){throw 'FishingAutomation build failed'}

          $watchProj=Join-Path $root.FullName 'MacroWatchdog/MacroWatchdog.csproj'
          if(Test-Path $watchProj){
            dotnet restore $watchProj
            dotnet build $watchProj -c Release --no-restore
            if($LASTEXITCODE-ne0){throw 'MacroWatchdog build failed'}
          }

          New-Item -ItemType Directory -Path stage,stage/release,package,package/release,package/tools,out -Force | Out-Null
          $pubArgs=@('-c','Release','-r','win-x64','--self-contained','true','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true','-p:EnableCompressionInSingleFile=true','-p:PublishTrimmed=false','-p:PublishAot=false','-p:DebugType=None','-p:DebugSymbols=false')

          dotnet publish (Join-Path $fish 'FishingAutomation.csproj') @pubArgs -o stage/release
          if($LASTEXITCODE-ne0){throw 'FishingAutomation publish failed'}

          if(Test-Path $watchProj){
            dotnet publish $watchProj @pubArgs -o stage/watchdog
            if($LASTEXITCODE-ne0){throw 'MacroWatchdog publish failed'}
            if(Test-Path 'stage/watchdog/MacroWatchdog.exe'){
              Copy-Item 'stage/watchdog/MacroWatchdog.exe' 'stage/release/MacroWatchdog.exe' -Force
            }
          }

          $exe=(Resolve-Path 'stage/release/FishingAutomation.exe').Path
          $p=Start-Process $exe -WorkingDirectory (Resolve-Path 'stage/release').Path -PassThru
          Start-Sleep 5
          $p.Refresh()
          if($p.HasExited){throw "smoke test exit $($p.ExitCode)"}
          Stop-Process $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process MacroWatchdog -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          Copy-Item 'stage/release/*' 'package/release' -Recurse -Force
          Copy-Item (Join-Path $root.FullName 'tools/ApplyUpdate.ps1') 'package/tools/ApplyUpdate.ps1' -Force
          @(
            'MABI AUTO V0.1.47 Windows Lite',
            'Recovery prioritizes selected/challenge/entry before retry.',
            'Recovery retry uses strict OCR only.'
          ) | Set-Content 'package/WINDOWS_LITE.txt' -Encoding UTF8

          foreach($required in @(
            'package/release/FishingAutomation.exe',
            'package/release/dungeon/config/targets.json',
            'package/tools/ApplyUpdate.ps1',
            'package/WINDOWS_LITE.txt'
          )){
            if(-not(Test-Path $required)){throw "package missing: $required"}
          }

          $zip=(Resolve-Path out).Path+'\MabiAuto_V0.1.47_Windows_Lite.zip'
          Compress-Archive -Path 'package/*' -DestinationPath $zip -CompressionLevel Optimal
          Remove-Item verify -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath verify -Force

          $publishedExe=Get-Item 'verify/release/FishingAutomation.exe'
          if($publishedExe.VersionInfo.FileVersion-ne'0.1.47.0'){throw "archive exe version mismatch: $($publishedExe.VersionInfo.FileVersion)"}
          if(-not(Test-Path 'verify/tools/ApplyUpdate.ps1')){throw 'archive missing updater'}

          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MabiAuto_V0.1.47_Windows_Lite.zip" | Set-Content "$zip.sha256" -Encoding ASCII
          $size=(Get-Item $zip).Length

          Write-Host 'RECOVERY_ENTRY_PRIORITY_OK'
          Write-Host 'RECOVERY_STRICT_RETRY_ONLY_OK'
          Write-Host 'NO_LOOSE_RETRY_IN_RECOVERY_OK'
          Write-Host 'PUBLISHED_EXE_VERSION_OK'
          Write-Host 'SMOKE_TEST_OK'
          Write-Host 'UPDATER_LAYOUT_OK'
          Write-Host "V0147_SHA256=$hash"
          Write-Host "V0147_SIZE=$size"

      - name: Publish V0.1.47
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='V0.1.47'
          $target=(git rev-parse HEAD).Trim()

          @(
            'MABI AUTO V0.1.47 - 자동복구 입장 상태 우선 판정',
            '',
            'V0.1.46 로그에서 도전 화면인데 자동복구가 계속 4단계 다시하기로 복귀하던 문제를 수정했습니다.',
            '자동복구는 이제 선택됨/도전/입장하기 정확 상태를 가장 먼저 검사하고, 보이면 1단계 입장 흐름으로 복귀합니다.',
            '입장 상태가 아닐 때만 전투 종료 화면을 확인하고, 마지막으로 정확 OCR retry_ocr_strict를 검사합니다.',
            '자동복구 화면판별에서 느슨한 hybrid retry는 더 이상 사용하지 않습니다.',
            '기존 retry 클릭 가드, scene_skip 입장 차단, 정확 OCR 상태판정, Space 전용 입장은 유지됩니다.'
          ) | Set-Content notes.txt -Encoding UTF8

          gh release view $tag --repo $env:REPO *> $null
          if($LASTEXITCODE-eq0){
            gh release delete $tag --repo $env:REPO --yes --cleanup-tag
          }
          $null=$LASTEXITCODE

          gh release create $tag --repo $env:REPO --target $target --title 'Mabi Auto V0.1.47' --notes-file notes.txt out/MabiAuto_V0.1.47_Windows_Lite.zip out/MabiAuto_V0.1.47_Windows_Lite.zip.sha256
          if($LASTEXITCODE-ne0){throw 'V0.1.47 release publish failed'}

          $release=gh api "repos/$env:REPO/releases/tags/$tag" | ConvertFrom-Json
          $zip=@($release.assets|Where-Object{$_.name-eq'MabiAuto_V0.1.47_Windows_Lite.zip'})[0]
          if($null-eq$zip){throw 'V0.1.47 zip missing'}
          Write-Host "RELEASE_DIGEST=$($zip.digest)"
          Write-Host "RELEASE_SIZE=$($zip.size)"
          Write-Host 'V0147_RELEASE_OK'
