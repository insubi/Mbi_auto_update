name: Inspect V0.1.55 Updater

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v0155-updater.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Inspect watchdog bootstrap
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item source -ItemType Directory -Force | Out-Null
          gh release download V0.1.55 --repo $env:GITHUB_REPOSITORY --pattern 'MabiAuto_V0.1.55_Source.zip' --dir source
          Expand-Archive source/MabiAuto_V0.1.55_Source.zip source/current -Force
          $root=(Resolve-Path source/current).Path
          $matches=Get-ChildItem (Join-Path $root 'FishingAutomation') -Recurse -Filter '*.cs' | Where-Object {
            (Get-Content -Raw $_.FullName) -match 'class WatchdogClient'
          }
          foreach($m in $matches){
            Write-Host "=== $($m.FullName) ==="
            Get-Content $m.FullName
          }
