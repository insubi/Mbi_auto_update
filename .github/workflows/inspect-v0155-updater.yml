name: Inspect V0.1.55 Updater

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v0155-updater.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Find updater method definitions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item source -ItemType Directory -Force | Out-Null
          gh release download V0.1.55 --repo $env:GITHUB_REPOSITORY --pattern 'MabiAuto_V0.1.55_Source.zip' --dir source
          Expand-Archive source/MabiAuto_V0.1.55_Source.zip source/current -Force
          $root=(Resolve-Path source/current).Path

          Write-Host '=== method locations ==='
          Get-ChildItem (Join-Path $root 'FishingAutomation') -Recurse -Filter '*.cs' | ForEach-Object {
            Select-String -Path $_.FullName -Pattern 'CheckForUpdatesAsync|RunStartupDiagnosticsAsync' | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber):$($_.Line)"
            }
          }

          $files=Get-ChildItem (Join-Path $root 'FishingAutomation') -Recurse -Filter '*.cs'
          foreach($file in $files){
            $raw=Get-Content -Raw $file.FullName
            if($raw.Contains('CheckForUpdatesAsync')){
              Write-Host "=== FILE $($file.FullName) ==="
              Write-Host $raw
            }
          }
