name: Cleanup duplicate V0.1.32 draft

on:
  push:
    branches:
      - v0132-peaca-breadcrumb-fixed-click
    paths:
      - '.github/workflows/cleanup-v0132-duplicate.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded run and delete its draft only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          gh api -X POST "repos/${REPO}/actions/runs/35272170621/cancel" || true
          gh api -X DELETE "repos/${REPO}/releases/391047325" || true
          echo "Superseded V0.1.32 draft/run cleanup requested. Current run/draft left untouched."
