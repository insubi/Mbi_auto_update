name: Cleanup duplicate V0.1.32 draft

on:
  push:
    branches:
      - v0132-peaca-breadcrumb-fixed-click
    paths:
      - '.github/workflows/cleanup-v0132-duplicate.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded runs and delete stale drafts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          for run_id in 35272170621 35272374893; do
            gh api -X POST "repos/${REPO}/actions/runs/${run_id}/cancel" || true
          done
          for release_id in 391047325 391048217 391053912; do
            gh api -X DELETE "repos/${REPO}/releases/${release_id}" || true
          done
          echo "Stale V0.1.32 runs/drafts cleanup requested."
