name: Build V0.1.19 Abyss Menu Guard

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v0119-abyss-menu-guard.yml'
      - 'release-source/v0119_abyss_menu_guard.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Patch and build V0.1.19
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri 'https://github.com/insubi/Mbi_auto_update/releases/download/V0.1.18/CombinedFishingDungeon_V0.1.18_CompassRecovery.zip' -OutFile current.zip
          Expand-Archive current.zip -DestinationPath current
          $root=Get-ChildItem current -Directory | Select-Object -First 1
          if($null -eq $root){throw 'source root missing'}
          $fish=Join-Path $root.FullName 'FishingAutomation'

          python release-source/v0119_abyss_menu_guard.py $root.FullName
          if($LASTEXITCODE-ne0){throw 'V0.1.19 patch failed'}

          $abyssTemplate=Join-Path $fish 'abyss/templates/abyss.png'
          $abyssHash=(Get-FileHash $abyssTemplate -Algorithm SHA256).Hash.ToLowerInvariant()
          if($abyssHash-ne'8ff4c90fe647fec8a7ba852395e79bb331247245296bee07d87318ef0b257868'){throw "abyss template changed: $abyssHash"}

          $engine=Get-Content -Raw (Join-Path $fish 'dungeon/ScenarioEngine.cs')
          foreach($m in @('VerifyAbyssSelectionScreenAsync','abyssIconRejected = new List<Rectangle>()','g.FillRectangle(Brushes.Black, rejected)','어비스 클릭 검증 실패','ESC: wrong content -> menu','어비스 클릭 검증 성공')){
            if(-not $engine.Contains($m)){throw "Abyss guard marker missing: $m"}
          }

          $expected=@{
            'compass.png'='af26e115ad824262ec890e51bb072b74098278d7cdbc40c6f1e7381fb3c467c3';
            'gauge.png'='22d78ea16f21db75ff11cb7a576e3275204f051a4214f8791c9605d975a317f8';
            'healthbar.png'='b79c90379ff0558ab19f77ac28a5e2dd64928f3d0ec46b1ce3fc5906a7956373';
            'hook.png'='e584e44185e15edbb75c8505ea5002edcaf3c0e2e770d8f6417ba4ff4fde8949'
          }
          foreach($t in $expected.Keys){
            $h=(Get-FileHash (Join-Path $fish "templates/$t") -Algorithm SHA256).Hash.ToLowerInvariant()
            if($h-ne$expected[$t]){throw "fishing template changed: $t $h"}
          }
          $bot=Get-Content -Raw (Join-Path $fish 'FishingBot.cs')
          foreach($m in @('compass.Score >= 0.28 && hook.Score < 0.70 && compassCentered','compassRecoveryFrames >= 6','hook.Score >= 0.80 && hook.Scale >= 0.90 && hook.Scale <= 1.10','hardReadyWait.ElapsedMilliseconds >= 10000','stage1_hard_reset_10s')){
            if(-not $bot.Contains($m)){throw "fishing marker missing: $m"}
          }

          New-Item -ItemType Directory -Path stage,stage/release,out | Out-Null
          Copy-Item -LiteralPath $root.FullName -Destination 'stage/MabiAuto_V0.1.19' -Recurse
          $pkg=(Resolve-Path 'stage/MabiAuto_V0.1.19').Path
          $pkgFish=Join-Path $pkg 'FishingAutomation'
          $args=@('-c','Release','-r','win-x64','--self-contained','true','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true','-p:EnableCompressionInSingleFile=true','-p:PublishTrimmed=false','-p:PublishAot=false','-p:DebugType=None','-p:DebugSymbols=false')
          dotnet publish (Join-Path $pkgFish 'FishingAutomation.csproj') @args -o stage/release
          if($LASTEXITCODE-ne0){throw 'FishingAutomation publish failed'}

          $watch=Join-Path $pkg 'MacroWatchdog/MacroWatchdog.csproj'
          if(Test-Path $watch){
            dotnet publish $watch @args -o stage/watchdog
            if($LASTEXITCODE-ne0){throw 'Watchdog publish failed'}
            if(Test-Path 'stage/watchdog/MacroWatchdog.exe'){Copy-Item 'stage/watchdog/MacroWatchdog.exe' 'stage/release/MacroWatchdog.exe' -Force}
          }

          $release=Join-Path $pkg 'release'
          if(Test-Path $release){Remove-Item $release -Recurse -Force}
          Copy-Item (Resolve-Path 'stage/release').Path -Destination $release -Recurse

          $runtimeAbyss=(Get-FileHash (Join-Path $release 'abyss/templates/abyss.png') -Algorithm SHA256).Hash.ToLowerInvariant()
          if($runtimeAbyss-ne'8ff4c90fe647fec8a7ba852395e79bb331247245296bee07d87318ef0b257868'){throw "runtime abyss template changed: $runtimeAbyss"}
          foreach($t in $expected.Keys){
            $h=(Get-FileHash (Join-Path $release "templates/$t") -Algorithm SHA256).Hash.ToLowerInvariant()
            if($h-ne$expected[$t]){throw "runtime fishing template changed: $t $h"}
          }

          $exe=Join-Path $release 'FishingAutomation.exe'
          $p=Start-Process $exe -WorkingDirectory $release -PassThru
          Start-Sleep 3
          $p.Refresh()
          if($p.HasExited){throw "smoke test exit $($p.ExitCode)"}
          Stop-Process $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process MacroWatchdog -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue

          $source=(Resolve-Path out).Path+'\CombinedFishingDungeon_V0.1.19_AbyssMenuGuard.zip'
          Compress-Archive -LiteralPath $root.FullName -DestinationPath $source -CompressionLevel Optimal
          $lite=(Resolve-Path out).Path+'\MabiAuto_V0.1.19_Windows_Lite.zip'
          Compress-Archive -LiteralPath $pkg -DestinationPath $lite -CompressionLevel Optimal
          $hash=(Get-FileHash $lite -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MabiAuto_V0.1.19_Windows_Lite.zip"|Set-Content "$lite.sha256" -Encoding ASCII
          Write-Host "LITE_SHA256=$hash"

      - name: Publish V0.1.19 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='V0.1.19'
          @(
            'MABI AUTO V0.1.19 - 어비스 메뉴 오클릭 방지',
            '',
            '어비스 아이콘 클릭 후 실제 어비스 던전 선택 화면인지 2프레임 연속 확인합니다.',
            '망령의 탑처럼 다른 콘텐츠가 열리면 즉시 ESC로 돌아가고, 잘못 인식한 후보 위치를 제외한 뒤 다음 후보를 찾습니다.',
            '잘못된 화면에서 60초를 그대로 기다리지 않습니다.',
            '후보 4개가 모두 실패하면 메뉴를 닫고 Smart Recovery로 즉시 넘깁니다.',
            '어비스 인식 이미지와 V0.1.18 낚시 로직은 유지했습니다.',
            '',
            '일반 실행 파일: MabiAuto_V0.1.19_Windows_Lite.zip'
          )|Set-Content notes.txt -Encoding UTF8
          $assets=@('out/CombinedFishingDungeon_V0.1.19_AbyssMenuGuard.zip','out/MabiAuto_V0.1.19_Windows_Lite.zip','out/MabiAuto_V0.1.19_Windows_Lite.zip.sha256')
          if(gh release view $tag --repo $env:REPO *> $null){
            gh release upload $tag @assets --repo $env:REPO --clobber
          }else{
            gh release create $tag @assets --repo $env:REPO --title 'Mabi Auto V0.1.19' --notes-file notes.txt
          }
